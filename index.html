/* ------------------------------------------------------------- stato */
var mview = { q:"" };

function morals(){ return S.morals || (S.morals = []); }
function moralById(id){ return morals().filter(function(m){ return m.id === id; })[0] || null; }
function moralMark(){ return S.settings.moralMark || "M:"; }
/* Il segno di chiusura e' l'apertura senza i due punti: si apre con "M:" e si
   chiude con "M". Serve soprattutto nel quaderno, dove una riga puo' essere
   lunghissima e la morale finisce molto prima della riga. */
function moralClose(){
  var mk = moralMark();
  var senza = mk.replace(/[^0-9A-Za-z\u00C0-\u00FF]+$/, "");
  return senza || mk;
}
function segnoIsolato(text, i, segno){
  var prima = i > 0 ? text.charAt(i-1) : " ";
  var dopo = text.charAt(i + segno.length) || " ";
  var lett = /[0-9A-Za-z\u00C0-\u00FF]/;
  return !lett.test(prima) && !lett.test(dopo);
}

/* Le frasi segnate: da "M:" fino a fine riga. Il segno deve stare all'inizio
   di una parola, così una "M:" in mezzo a una sigla non conta. */
function findMorals(text){
  var mk = moralMark(), chiudi = moralClose(), out = [];
  if(!mk || !text) return out;
  var i = 0;
  while(i < text.length){
    var a = text.indexOf(mk, i);
    if(a < 0) break;
    var prima = a > 0 ? text.charAt(a-1) : "";
    if(prima && !/[\s(\[«"'—–-]/.test(prima)){ i = a + mk.length; continue; }
    var fineRiga = text.indexOf("\n", a);
    if(fineRiga < 0) fineRiga = text.length;
    var dopoApertura = a + mk.length;

    /* la chiusura: una "M" da sola, prima della fine della riga */
    var c = dopoApertura, fine = fineRiga, tagliato = fineRiga;
    while(c < fineRiga){
      var k = text.indexOf(chiudi, c);
      if(k < 0 || k >= fineRiga) break;
      /* una "M:" che apre un'altra morale non e' una chiusura */
      if(text.slice(k, k + mk.length) === mk){ c = k + mk.length; continue; }
      if(segnoIsolato(text, k, chiudi)){ fine = k; tagliato = k + chiudi.length; break; }
      c = k + chiudi.length;
    }

    var dentro = text.slice(dopoApertura, fine).trim();
    if(!dentro){ i = dopoApertura; continue; }
    out.push({ start:a, end:tagliato, text:dentro });
    i = tagliato;
  }
  return out;
}

/* Converte le frasi segnate di owner[campo] in morali. ctx dice da dove
   arrivano: { pid, cid }. Torna quante ne ha create. */
function convertiMorali(owner, campo, campoMor, ctx){
  var text = owner[campo] || "";
  var trovate = findMorals(text);
  if(!trovate.length) return 0;
  ctx = ctx || {};
  owner[campoMor] = owner[campoMor] || [];
  var out = "", last = 0;
  trovate.forEach(function(f){
    out += text.slice(last, f.start) + f.text;
    last = f.end;
    var m = {
      id:uid(), text:f.text, ts:Date.now(), day:todayStr(),
      pid:ctx.pid || null, cid:ctx.cid || null
    };
    morals().unshift(m);
    owner[campoMor].push({ text:f.text, moralId:m.id, at:Date.now() });
  });
  out += text.slice(last);
  owner[campo] = out;
  save();
  return trovate.length;
}
function avvisaMorali(n){
  if(!n) return;
  showToast(n === 1 ? t("moralMade1") : t("moralMadeN").replace("N", String(n)));
}
/* Come sopra, ma la frase esce proprio dal testo invece di restare
   evidenziata: serve alla barra del turno, dove il testo diventa un compito. */
function estraiMorali(text, ctx){
  var trovate = findMorals(text);
  if(!trovate.length) return { resto:text, n:0 };
  ctx = ctx || {};
  var resto = "", last = 0;
  trovate.forEach(function(f){
    resto += text.slice(last, f.start);
    last = f.end;
    morals().unshift({ id:uid(), text:f.text, ts:Date.now(), day:todayStr(),
      pid:ctx.pid || null, cid:ctx.cid || null });
  });
  resto += text.slice(last);
  save();
  return { resto:resto.replace(/[ \t]+/g, " ").trim(), n:trovate.length };
}

/* il testo di un compito non porta mai il segno della morale */
function stripMoral(text){
  if(!text) return text;
  var trovate = findMorals(text), out = "", last = 0;
  trovate.forEach(function(f){ out += text.slice(last, f.start) + f.text; last = f.end; });
  out += text.slice(last);
  return out.trim();
}

/* Fa le due conversioni insieme — asterischi e "M:" — su uno stesso campo.
   Torna { compiti, morali }. */
function convertiTutto(owner, campo, p, ctx){
  var compiti = convertiMarcati(owner, campo, "tasks", p, ctx && ctx.crea);
  var mor = convertiMorali(owner, campo, "morals", ctx);
  return { compiti:compiti, morali:mor };
}
function avvisaTutto(r){
  if(r.compiti && r.morali) showToast(t("bothMade"));
  else if(r.compiti) avvisaCompiti(r.compiti);
  else if(r.morali) avvisaMorali(r.morali);
  return (r.compiti + r.morali) > 0;
}

/* il testo con le frasi diventate morale evidenziate; un tocco ci porta sopra */
function textWithMorals(text, tasks, moraliDiQui){
  var frag = textWithTasks(text, tasks);
  if(!moraliDiQui || !moraliDiQui.length) return frag;
  /* ricostruisco: i pezzi di testo semplice vengono ripassati cercando le morali */
  var out = document.createDocumentFragment();
  Array.prototype.slice.call(frag.childNodes).forEach(function(n){
    if(n.nodeType !== 3){ out.appendChild(n); return; }
    out.appendChild(spezzaPerMorali(n.textContent, moraliDiQui));
  });
  return out;
}
function spezzaPerMorali(testo, moraliDiQui){
  var frag = document.createDocumentFragment();
  var marks = [];
  moraliDiQui.forEach(function(mk){
    var i = (testo || "").indexOf(mk.text);
    if(i >= 0) marks.push({ start:i, end:i + mk.text.length, mor:mk });
  });
  marks.sort(function(a,b){ return a.start - b.start; });
  var last = 0;
  marks.forEach(function(mk){
    if(mk.start < last) return;
    if(mk.start > last) frag.appendChild(document.createTextNode(testo.slice(last, mk.start)));
    var esiste = moralById(mk.mor.moralId);
    var sp = document.createElement("button");
    sp.className = "mkmoral" + (esiste ? "" : " gone");
    sp.textContent = mk.mor.text;
    sp.title = esiste ? t("moralGoBack") : t("moralGone");
    var salto = null;
    sp.onclick = function(e){
      e.stopPropagation();
      clearTimeout(salto);
      salto = setTimeout(function(){
        if(modificaAperta) return;
        vaiAllaMorale(mk.mor.moralId);
      }, 280);
    };
    sp.addEventListener("dblclick", function(){ clearTimeout(salto); });
    frag.appendChild(sp);
    last = mk.end;
  });
  if(last < (testo || "").length) frag.appendChild(document.createTextNode(testo.slice(last)));
  return frag;
}
function vaiAllaMorale(id){
  if(!moralById(id)) return;
  mview.q = "";
  setMode("mor");
  setTimeout(function(){
    var el = document.querySelector('.moritem[data-id="' + id + '"]');
    if(el){
      el.scrollIntoView({ block:"center", behavior:"smooth" });
      el.classList.add("flash");
      setTimeout(function(){ el.classList.remove("flash"); }, 1400);
    }
  }, 90);
}

/* ------------------------------------------------------------- render */
function renderMor(){
  $("modeMorName").textContent = t("mMor");
  $("morTitle").textContent = t("moralTitle");
  $("morSearch").placeholder = t("moralSearch");

  var q = mview.q.trim().toLowerCase();
  var tutte = morals();
  var viste = q ? tutte.filter(function(m){
    return (m.text || "").toLowerCase().indexOf(q) >= 0 || (etichettaMorale(m) || "").toLowerCase().indexOf(q) >= 0;
  }) : tutte;
  $("morN").textContent = viste.length ? String(viste.length) : "";

  var host = $("morList");
  host.textContent = "";
  if(!viste.length){
    var e = document.createElement("p"); e.className = "empty";
    e.textContent = tutte.length ? t("moralEmptyFilter") : t("moralEmpty");
    host.appendChild(e);
    if(!tutte.length){
      var n = document.createElement("p"); n.className = "labnote";
      n.textContent = t("moralNote");
      host.appendChild(n);
    }
    return;
  }
  viste.forEach(function(m){ host.appendChild(moralCard(m)); });

  var hint = document.createElement("p"); hint.className = "labnote";
  hint.style.marginTop = "14px";
  hint.textContent = t("moralHint");
  host.appendChild(hint);
}

/* di chi parla questa morale */
function etichettaMorale(m){
  if(m.pid){ var p = patById(m.pid); if(p) return p.alias || ""; }
  if(m.cid){ var c = colById(m.cid); if(c) return c.name || ""; }
  return "";
}

function moralCard(m){
  var box = document.createElement("div"); box.className = "moritem";
  box.dataset.id = m.id;

  var body = document.createElement("div"); body.className = "mobody";
  var tx = document.createElement("div"); tx.className = "motext";
  tx.textContent = m.text;
  attaccaModifica(tx, function(){
    modificaTesto(tx, m.text, {
      annulla: renderMor,
      salva: function(nuovo){ m.text = nuovo; save(); renderMor(); }
    });
  });
  body.appendChild(tx);

  var meta = document.createElement("div"); meta.className = "mometa";
  var quando = document.createElement("span"); quando.className = "moday";
  quando.textContent = fmtDayShort(m.day || todayStr());
  meta.appendChild(quando);

  var nome = etichettaMorale(m);
  if(nome){
    var chip = document.createElement("button");
    chip.className = "mochip";
    chip.textContent = t("moralFrom") + " " + nome;
    chip.title = t("moralGo");
    chip.onclick = function(){ apriSorgente(m); };
    meta.appendChild(chip);
  } else if(m.pid || m.cid){
    meta.appendChild(chip2(t("moralGone")));
  }
  body.appendChild(meta);

  var x = document.createElement("button"); x.className = "mx";
  x.setAttribute("aria-label", t("del"));
  x.appendChild(svgIcon("trash", 15));
  x.onclick = function(){ eliminaMorale(m); };

  box.appendChild(body); box.appendChild(x);
  return box;

  function chip2(testo){
    var s = document.createElement("span"); s.className = "mochip off"; s.textContent = testo; return s;
  }
}

function apriSorgente(m){
  if(m.pid && patById(m.pid)){
    pview.id = m.pid; pview.tab = "notes";
    setMode("pat"); window.scrollTo(0,0);
  } else if(m.cid && colById(m.cid)){
    cview.id = m.cid; cview.tab = "ev";
    setMode("col"); window.scrollTo(0,0);
  }
}

function eliminaMorale(m){
  var idx = morals().indexOf(m);
  if(idx < 0) return;
  morals().splice(idx, 1);
  save(); renderMor();
  showToast(t("moralDeleted"), t("undo"), function(){
    morals().splice(Math.min(idx, morals().length), 0, m);
    save(); renderMor();
  });
}

function openMoralSheet(){
  openSheet(function(sheet, close){
    var h = document.createElement("h2"); h.textContent = t("moralNew");
    sheet.appendChild(h);
    var ta = document.createElement("textarea");
    ta.className = "pastearea"; ta.placeholder = t("moralPh"); ta.style.minHeight = "110px";
    sheet.appendChild(ta);

    var row = document.createElement("div");
    row.style.cssText = "display:flex; gap:8px; align-items:center; margin-top:10px";
    var mic = document.createElement("button"); mic.className = "mic-sm";
    mic.appendChild(svgIcon("mic", 15));
    mic.onclick = function(){ dictateInto(ta, mic); };
    row.appendChild(mic);
    sheet.appendChild(row);

    var acts = document.createElement("div"); acts.className = "sheet-actions";
    var ok = document.createElement("button"); ok.className = "btn"; ok.style.background = "var(--accent)";
    ok.textContent = t("saveBtn");
    ok.onclick = function(){
      var v = stripMoral(ta.value.trim());
      if(!v){ showToast(t("moralNeed")); ta.focus(); return; }
      morals().unshift({ id:uid(), text:v, ts:Date.now(), day:todayStr(), pid:null, cid:null });
      save(); stopDictation(); close(); renderMor();
    };
    var cn = document.createElement("button"); cn.className = "btn btn-ghost";
    cn.textContent = t("cancel"); cn.onclick = function(){ stopDictation(); close(); };
    acts.appendChild(ok); acts.appendChild(cn);
    sheet.appendChild(acts);
    setTimeout(function(){ ta.focus(); }, 80);
  });
}

/* ------------------------------------------------------------- avvio */
function initMor(){
  S.morals = S.morals || [];
  $("modeMor").onclick = function(){ setMode("mor"); };
  $("modeMed").onclick = function(){ setMode("med"); };
  $("morNewBtn").onclick = openMoralSheet;
  $("morSearch").addEventListener("input", function(){ mview.q = this.value; renderMor(); });
}

function sysUsato(s){ return !!(s && (s.status || sysHaTesto(s) || hasPhotos(s))); }
function sysCount(p){ return SYS_DEF.filter(function(d){ return sysUsato(sysGet(p, d.id)); }).length; }
function sysHasBad(p){
  return SYS_DEF.some(function(d){ var s = sysGet(p, d.id); return !!(s && s.status === "bad"); });
}
/* prima di cambiare qualcosa in un giorno nuovo, metto da parte com'era */
function sysTouch(s){
  var oggi = todayStr();
  if(s.day && s.day !== oggi && (s.status || sysHaTesto(s))){
    s.hist = s.hist || [];
    s.hist.push({ day:s.day, text:s.text || "", status:s.status || "" });
  }
  s.day = oggi;
  s.ts = Date.now();
}
function sysStWord(st){
  return st === "ok" ? t("sysOk") : st === "watch" ? t("sysWatch") : st === "bad" ? t("sysBad") : "";
}
function sysRels(id){
  var k = S.settings.ui === "de" ? 3 : 2;
  return SYS_REL.filter(function(r){ return r[0] === id || r[1] === id; })
    .map(function(r){ return { id:(r[0] === id ? r[1] : r[0]), why:r[k] }; });
}
function sysQuando(s){
  if(!s || !s.ts) return "";
  var d = dayStr(new Date(s.ts)), g = dayGap(d);
  return (g === 0 ? t("cToday") : g === -1 ? t("back1") : fmtDayShort(d)) + " " + fmtTime(s.ts);
}
function sysEl(tag, cls, text){
  var e = document.createElement(tag);
  if(cls) e.className = cls;
  if(text !== undefined && text !== null) e.textContent = text;
  return e;
}
/* l'iconcina di un sistema, presa dal disegno */
function sysMini(d, st, size){
  var s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  s.setAttribute("viewBox", (d.miniVb || d.vb).join(" "));
  s.setAttribute("width", size);
  s.setAttribute("height", size);
  s.setAttribute("aria-hidden", "true");
  s.setAttribute("class", "sysmini");
  s.innerHTML = '<g class="sg' + (st ? " st-" + st : "") + '">' + d.art + '</g>';
  return s;
}

    '<ellipse cx="146" cy="500" rx="14" ry="7"/><ellipse cx="214" cy="500" rx="14" ry="7"/></g>';
  h += '<g class="sbs"><path d="M126 110 L118 206 L114 290" stroke-width="22"/><path d="M234 110 L242 206 L246 290" stroke-width="22"/>' +
    '<path d="M159 306 L156 400 L154 488" stroke-width="30"/><path d="M201 306 L204 400 L206 488" stroke-width="30"/></g>';

      '<circle class="sdot" cx="' + (L ? 97 : 263) + '" cy="' + d.ly + '" r="4.2"/>' +

/* i nomi lunghi non devono uscire dal disegno */
function sysNomi(svg){
  Array.prototype.forEach.call(svg.querySelectorAll(".slab"), function(g){
    var tx = g.querySelector("text");
    tx.textContent = sysTxt(g.getAttribute("data-sys"), 0);
    tx.style.fontSize = "";
    try{
      var w = tx.getComputedTextLength();
      if(w > 90) tx.style.fontSize = (13 * 90 / w).toFixed(2) + "px";
    }catch(e){}
  });
}

/* colori dello stato, chi e' aperto, chi e' collegato */
function sysPaint(fig, p){
  var sel = (sysAperto && sysAperto.pid === p.id) ? sysAperto.id : null;
  var rel = sel ? sysRels(sel).map(function(r){ return r.id; }) : [];
  fig.classList.toggle("open", !!sel);
  SYS_DEF.forEach(function(d){
    var s = sysGet(p, d.id);
    var cls = (s && s.status ? " st-" + s.status : "") +
      (d.id === sel ? " sel" : "") + (rel.indexOf(d.id) >= 0 ? " rel" : "");
    fig.querySelector('[data-g="' + d.id + '"]').setAttribute("class", "sg" + cls);
    fig.querySelector('[data-h="' + d.id + '"]').setAttribute("class", "halo" + cls);
    fig.querySelector('[data-l="' + d.id + '"]').setAttribute("class", "slead" + cls);
    fig.querySelector('[data-sys="' + d.id + '"]').setAttribute("class", "slab" + cls + (sysHaTesto(s) ? " has" : ""));
  });
  var lk = fig.querySelector(".syslinks"), h = "";
  if(sel){
    var a = sysDef(sel).c;
    rel.forEach(function(rid){
      var b = sysVicinoA(sysDef(rid), a);
      /* una curva leggera, non un righello */
      var mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2;
      var dx = b[0] - a[0], dy = b[1] - a[1], len = Math.sqrt(dx*dx + dy*dy) || 1;
      var k = Math.min(18, len * 0.14);
      var cx = mx - dy / len * k, cy = my + dx / len * k;
      h += '<path d="M' + a[0] + ' ' + a[1] + ' Q' + cx.toFixed(1) + ' ' + cy.toFixed(1) + ' ' + b[0] + ' ' + b[1] + '"/>' +
        '<circle cx="' + b[0] + '" cy="' + b[1] + '" r="3"/>';
    });
    h += '<circle cx="' + a[0] + '" cy="' + a[1] + '" r="3.4"/>';
  }
  lk.innerHTML = h;
}
function sysVicinoA(d, a){
  var best = d.hit[0], bd = Infinity;
  d.hit.forEach(function(q){
    var v = (q[0] - a[0]) * (q[0] - a[0]) + (q[1] - a[1]) * (q[1] - a[1]);
    if(v < bd){ bd = v; best = q; }
  });
  return [best[0], best[1]];
}
/* che sistema hai toccato: il piu' vicino, in proporzione alla sua grandezza */
function sysToccato(svg, x, y){
  var m = svg.getScreenCTM();
  if(!m) return null;
  var pt = svg.createSVGPoint();
  pt.x = x; pt.y = y;
  var q = pt.matrixTransform(m.inverse());
  var best = null, bd = 1.7;
  SYS_DEF.forEach(function(d){
    d.hit.forEach(function(hh){
      var dx = q.x - hh[0], dy = q.y - hh[1];
      var v = Math.sqrt(dx*dx + dy*dy) / hh[2];
      if(v < bd){ bd = v; best = d.id; }
    });
  });
  return best;
}

/* ------------------------------------------------------------- la sezione */
function secSys(host, p){
  var c = secCard(host, "sysTitle", null);
  var fig = sysEl("div", "sysfig");
  fig.innerHTML = sysFigMarkup();
  c.appendChild(fig);
  var svg = fig.querySelector("svg");
  if(!(sysAperto && sysAperto.pid === p.id && sysDef(sysAperto.id))) sysAperto = null;
  sysPaint(fig, p);

  svg.addEventListener("click", function(e){
    var lab = e.target.closest ? e.target.closest(".slab") : null;
    var id = lab ? lab.getAttribute("data-sys") : sysToccato(svg, e.clientX, e.clientY);
    if(id && !(sysAperto && sysAperto.id === id)) sysApri(fig, p, id, true);
    else if(sysAperto) sysChiudi();
  });

  var hint = sysEl("p", "labnote", t("sysHint"));
  c.appendChild(hint);
  sysLista(c, p, fig);

  /* con la scheda aperta lo spazio sotto la sezione c'e' subito,
     cosi' la pagina non perde il punto in cui eri */
  if(sysAperto){
    var sp0 = sysEl("div", "sysspacer");
    sp0.setAttribute("aria-hidden", "true");
    sp0.style.height = Math.round(Math.min(window.innerHeight * 0.46, 440) + 16) + "px";
    host.appendChild(sp0);
  }
  /* i nomi si misurano alla fine, quando la sezione e' tutta al suo posto */
  sysNomi(svg);
  if(sysAperto) sysApri(fig, p, sysAperto.id, false);
}

/* sotto il disegno: quello che hai segnato, da leggere tutto insieme */
function sysLista(c, p, fig){
  var rango = { bad:0, watch:1, "":2, ok:3 };
  var usati = SYS_DEF.filter(function(d){ return sysUsato(sysGet(p, d.id)); });
  if(!usati.length) return;
  usati.sort(function(a, b){
    var sa = sysGet(p, a.id).status || "", sb = sysGet(p, b.id).status || "";
    if(rango[sa] !== rango[sb]) return rango[sa] - rango[sb];
    return SYS_DEF.indexOf(a) - SYS_DEF.indexOf(b);
  });
  var box = sysEl("div", "sysrows");
  usati.forEach(function(d){
    var s = sysGet(p, d.id);
    var row = sysEl("div", "sysrow" + (s.status ? " st-" + s.status : ""));
    row.setAttribute("role", "button");
    row.tabIndex = 0;
    var ic = sysEl("span", "ri");
    ic.appendChild(sysMini(d, s.status, 24));
    row.appendChild(ic);
    var body = sysEl("div", "rb");
    var top = sysEl("div", "sr-top");
    top.appendChild(sysEl("span", "sr-name", sysTxt(d.id, 1)));
    if(s.status) top.appendChild(sysEl("span", "sr-st st-" + s.status, sysStWord(s.status)));
    var quando = sysQuando(s);
    if(hasPhotos(s)) quando = (quando ? quando + " · " : "") + s.photos.length + " " + t("sysPhotos");
    if(quando) top.appendChild(sysEl("span", "sr-when", quando));
    body.appendChild(top);
    if(sysHaTesto(s)){
      var tx = sysEl("div", "sr-tx");
      tx.appendChild(textWithMorals(s.text, s.tasks, s.morals));
      body.appendChild(tx);
    }
    row.appendChild(body);
    row.onclick = function(){ sysVaiA(fig, p, d.id); };
    row.addEventListener("keydown", function(e){ if(e.key === "Enter"){ e.preventDefault(); sysVaiA(fig, p, d.id); } });
    box.appendChild(row);
  });
  c.appendChild(box);
}
/* dalla lista: apro la scheda, e il disegno scorre fino alla parte giusta */
function sysVaiA(fig, p, id){ sysApri(fig, p, id, true); }

/* la scheda che si ingrandisce sopra il disegno */
function sysApri(fig, p, id, anim){
  var vecchia = fig.querySelector(".syscard");
  if(vecchia){
    stopDictation();
    if(sysAperto && sysAperto.pid === p.id) sysConverti(p, sysAperto.id);
    vecchia.remove();
  }
  sysAperto = { pid:p.id, id:id };
  sysPaint(fig, p);

  var d = sysDef(id);
  var card = sysEl("div", "syscard");
  card.setAttribute("role", "dialog");
  card.setAttribute("aria-label", sysTxt(id, 1));

  /* intestazione */
  var head = sysEl("div", "sc-head");
  var ic = sysEl("span", "sc-ic");
  var tt = sysEl("div", "sc-tt");
  var titolo = sysEl("div", "sc-title", sysTxt(id, 1));
  var sotto = sysEl("div", "sc-sub");
  tt.appendChild(titolo); tt.appendChild(sotto);
  var x = sysEl("button", "iconbtn sc-x");
  x.setAttribute("aria-label", t("close"));
  x.appendChild(svgIcon("x", 18, 2));
  x.onclick = function(e){ e.stopPropagation(); sysChiudi(); };
  head.appendChild(ic); head.appendChild(tt); head.appendChild(x);
  card.appendChild(head);

  /* lo stato: un tocco lo mette, un altro tocco sullo stesso lo toglie */
  var seg = sysEl("div", "sc-st");
  var bottoni = {};
  ["ok", "watch", "bad"].forEach(function(st){
    var b = sysEl("button", "st-" + st, sysStWord(st));
    b.onclick = function(){
      var s = sysEnsure(p, id);
      sysTouch(s);
      s.status = (s.status === st) ? "" : st;
      save();
      aggiorna();
    };
    bottoni[st] = b;
    seg.appendChild(b);
  });
  card.appendChild(seg);

  /* lo spazio per scrivere: si salva mentre scrivi */
  var s0 = sysGet(p, id);
  var ta = sysEl("textarea", "sysnote");
  ta.placeholder = sysTxt(id, 2);
  ta.value = s0 ? (s0.text || "") : "";
  ta.setAttribute("enterkeyhint", "enter");
  ta.rows = 3;
  function scrivi(){
    var s = sysGet(p, id);
    if(!s && !ta.value) return;
    s = sysEnsure(p, id);
    if(s.text !== ta.value){
      sysTouch(s);
      s.text = ta.value;
      save();
      sottotitolo();
      var lab = fig.querySelector('[data-sys="' + id + '"]');
      if(lab) lab.classList.toggle("has", sysHaTesto(s));
    }
    autoGrow(ta);
  }
  ta.addEventListener("input", scrivi);
  ta.addEventListener("blur", function(){
    var r = sysConverti(p, id);
    if(r && (r.compiti || r.morali)) ta.value = sysGet(p, id).text;
  });
  card.appendChild(ta);

  var fotoBox = sysEl("div");
  function disegnaFoto(){
    fotoBox.textContent = "";
    var s = sysGet(p, id);
    if(hasPhotos(s)) fotoBox.appendChild(photoRow(s, function(){ disegnaFoto(); aggiorna(); }, { add:false }));
  }

  var tools = sysEl("div", "sc-tools");
  var mic = sysEl("button", "mic-sm");
  mic.appendChild(svgIcon("mic", 15));
  mic.setAttribute("aria-label", t("listening"));
  mic.onclick = function(){ dictateInto(ta, mic, scrivi); };
  var cam = sysEl("button", "mic-sm");
  cam.appendChild(svgIcon("camera", 15));
  cam.setAttribute("aria-label", t("photoAdd"));
  cam.title = t("photoAdd");
  cam.onclick = function(){
    var s = sysEnsure(p, id);
    addPhotoTo(s, function(){ sysTouch(s); save(); disegnaFoto(); aggiorna(); });
  };
  tools.appendChild(mic); tools.appendChild(cam);
  card.appendChild(tools);
  card.appendChild(fotoBox);
  disegnaFoto();

  /* i sistemi collegati, con il loro stato e quello che ci hai scritto */
  var rel = sysRels(id);
  if(rel.length){
    card.appendChild(sysEl("div", "sc-lab", t("sysRel")));
    rel.forEach(function(r){
      var rd = sysDef(r.id), rs = sysGet(p, r.id);
      var row = sysEl("button", "sc-rel");
      var ri = sysEl("span", "ri");
      ri.appendChild(sysMini(rd, rs && rs.status, 22));
      var rb = sysEl("span", "rb");
      var rn = sysEl("span", "rn");
      rn.appendChild(sysEl("span", "", sysTxt(r.id, 1)));
      if(rs && rs.status) rn.appendChild(sysEl("span", "rs st-" + rs.status, sysStWord(rs.status)));
      rb.appendChild(rn);
      if(sysHaTesto(rs)) rb.appendChild(sysEl("span", "rp", rs.text.trim().split("\n")[0]));
      rb.appendChild(sysEl("span", "rw", r.why));
      row.appendChild(ri); row.appendChild(rb);
      row.appendChild(sysEl("span", "rc", "›"));
      row.onclick = function(){ sysApri(fig, p, r.id, true); };
      card.appendChild(row);
    });
  }

  /* com'era nei giorni prima */
  var hist = (s0 && s0.hist) ? s0.hist.slice().reverse() : [];
  if(hist.length){
    var hb = sysEl("button", "sc-histbtn", t("sysHist") + " · " + hist.length);
    var hl = sysEl("div", "sc-hist");
    hl.hidden = true;
    hist.forEach(function(v){
      var hr = sysEl("div", "sc-hrow");
      var hd = sysEl("div", "hd", fmtDayShort(v.day));
      if(v.status) hd.appendChild(sysEl("span", "rs st-" + v.status, sysStWord(v.status)));
      hr.appendChild(hd);
      if(v.text && v.text.trim()) hr.appendChild(sysEl("div", "ht", v.text));
      hl.appendChild(hr);
    });
    hb.onclick = function(){ hl.hidden = !hl.hidden; };
    card.appendChild(hb);
    card.appendChild(hl);
  }

  function aggiorna(){
    var s = sysGet(p, id);
    var st = s && s.status ? s.status : "";
    card.className = card.className.replace(/\s*st-\w+/g, "") + (st ? " st-" + st : "");
    ["ok", "watch", "bad"].forEach(function(k){ bottoni[k].classList.toggle("on", st === k); });
    ic.textContent = "";
    ic.appendChild(sysMini(d, st, 30));
    sottotitolo();
    sysPaint(fig, p);
  }
  function sottotitolo(){
    var s = sysGet(p, id);
    var st = s && s.status ? s.status : "";
    var bits = [];
    if(st) bits.push(sysStWord(st));
    bits.push(s && s.ts ? t("sysUpd") + " " + sysQuando(s) : t("sysNew"));
    sotto.textContent = bits.join(" · ");
    sotto.className = "sc-sub" + (st ? " st-" + st : "");
  }
  aggiorna();

  fig.appendChild(card);
  autoGrow(ta);
  sysTieniFermo(card, ta);
  sysPosiziona(fig, card, d, anim);
}

/* La scheda sta ferma in basso sullo schermo e scorre per conto suo; il
   disegno resta dietro e scorre con la pagina. Sotto la sezione lascio uno
   spazio alto quanto la scheda, cosi' anche le gambe possono salire sopra di
   lei. Aprendola, porto la parte toccata nello spazio libero sopra la scheda. */
function sysPosiziona(fig, card, d, anim){
  var sec = $("pdSec");
  var sp = sec.querySelector(".sysspacer");
  if(!sp){ sp = sysEl("div", "sysspacer"); sp.setAttribute("aria-hidden", "true"); sec.appendChild(sp); }
  var r = card.getBoundingClientRect();
  var mh = parseFloat(window.getComputedStyle(card).maxHeight);
  sp.style.height = Math.round((isNaN(mh) ? r.height : Math.max(mh, r.height)) + 16) + "px";
  if(!anim) return;

  var head = document.querySelector("#patDetail .pdet-head");
  var alto = (head ? head.getBoundingClientRect().bottom : 0) + 12;
  var basso = r.top - 12;
  var gr = fig.querySelector('[data-g="' + d.id + '"]').getBoundingClientRect();
  var delta = 0;
  if(gr.top < alto || gr.bottom > basso){
    delta = (gr.top + gr.bottom) / 2 - (alto + basso) / 2;
    var y = window.pageYOffset;
    var max = document.documentElement.scrollHeight - window.innerHeight;
    delta = Math.max(-y, Math.min(delta, max - y));
  }
  /* si apre partendo da dove sara' la parte toccata a fine scorrimento */
  var gx = (gr.left + gr.right) / 2, gy = (gr.top + gr.bottom) / 2 - delta;
  card.style.transformOrigin = Math.round(gx - r.left) + "px " + Math.round(gy - r.top) + "px";
  card.classList.add("anim");
  if(Math.abs(delta) > 2){
    try{ window.scrollBy({ top:delta, left:0, behavior:"smooth" }); }
    catch(e){ window.scrollBy(0, delta); }
  }
}

/* Il dito sulla scheda muove solo la scheda. Quando la scheda non ha piu'
   niente da scorrere in quella direzione (o e' corta e non scorre affatto),
   lo sfondo resta fermo lo stesso. */
function sysTieniFermo(card, ta){
  var y0 = 0;
  function puoScorrere(el, giu){
    if(el.scrollHeight <= el.clientHeight + 1) return false;
    return giu ? el.scrollTop + el.clientHeight < el.scrollHeight - 1 : el.scrollTop > 0;
  }
  function lascia(target, giu){
    /* mentre scrivi, il campo di testo fa come vuole lui */
    if(document.activeElement === ta && target === ta) return true;
    var campo = target && target.closest ? target.closest("textarea") : null;
    return (campo && puoScorrere(campo, giu)) || puoScorrere(card, giu);
  }
  card.addEventListener("touchstart", function(e){
    if(e.touches.length) y0 = e.touches[0].clientY;
  }, { passive:true });
  card.addEventListener("touchmove", function(e){
    if(!e.touches.length) return;
    var y = e.touches[0].clientY, giu = y < y0;
    y0 = y;
    if(!lascia(e.target, giu) && e.cancelable) e.preventDefault();
  }, { passive:false });
  card.addEventListener("wheel", function(e){
    if(!lascia(e.target, e.deltaY > 0) && e.cancelable) e.preventDefault();
  }, { passive:false });
}

/* le frasi fra asterischi diventano compiti, quelle con M: morali */
function sysConverti(p, id){
  var s = sysGet(p, id);
  if(!s || !s.text) return null;
  var r = convertiTutto(s, "text", p, { pid:p.id });
  if(r.compiti || r.morali) avvisaTutto(r);
  return r;
}

/* chiude la scheda aperta; torna true se c'era qualcosa da chiudere */
function sysChiudi(){
  if(!sysAperto) return false;
  var ap = sysAperto;
  var p = patById(ap.pid);
  stopDictation();
  if(p) sysConverti(p, ap.id);
  sysAperto = null;
  var fig = document.querySelector("#pdSec .sysfig");
  var card = fig && fig.querySelector(".syscard");
  if(fig && p) sysPaint(fig, p);
  if(card){
    card.classList.remove("anim");
    card.classList.add("out");
    setTimeout(function(){ if(!sysAperto) renderPat(); }, 150);
  } else {
    renderPat();
  }
  return true;
}
/* lasciando la sezione senza chiudere la scheda: gli asterischi diventano
   comunque compiti, e il microfono si spegne */
function sysLascia(){
  if(!sysAperto) return;
  var ap = sysAperto;
  sysAperto = null;
  var p = patById(ap.pid);
  if(recTarget && recTarget.classList && recTarget.classList.contains("sysnote")) stopDictation();
  if(p) sysConverti(p, ap.id);
}
/* mentre scrivi in una scheda, il ridisegno automatico aspetta */
function sysScrive(){
  var a = document.activeElement;
  return !!(sysAperto && a && a.classList && a.classList.contains("sysnote"));
}
document.addEventListener("keydown", function(e){
  if(e.key === "Escape" && sysAperto && !document.querySelector(".scrim, .viewer")) sysChiudi();
});

/* per il riassunto da copiare: sempre in italiano, come il resto del riassunto */
function sysPerRiassunto(p){
  var out = [];
  SYS_DEF.forEach(function(d){
    var s = sysGet(p, d.id);
    if(!s || !(s.status || sysHaTesto(s))) return;
    var st = s.status === "ok" ? "in ordine" : s.status === "watch" ? "da seguire" : s.status === "bad" ? "problema" : "";
    var tag = [st, s.day ? fmtDayShort(s.day) : ""].filter(Boolean).join(", ");
    out.push("- " + SYS_TXT.it[d.id][1] + (tag ? " [" + tag + "]" : "") +
      (sysHaTesto(s) ? ": " + s.text.trim().replace(/\s*\n\s*/g, " / ") : ""));
  });
  return out;
}

var sview = { id:null, q:"", y:0 };

function scnData(){
  if(!S.scenari || typeof S.scenari !== "object") S.scenari = {};
  var d = S.scenari;
  if(!Array.isArray(d.models)) d.models = [];
  if(!d.vals || typeof d.vals !== "object") d.vals = {};
  return d;
}
function scnParseItem(line, old){
  var parts = String(line).split("|");
  var k = parts[0].trim(), ph = parts.slice(1).join("|").trim();
  if(!k) return null;
  /* stessa parola chiave = stessa riga: il valore scritto non si perde */
  var same = (old || []).filter(function(x){ return x.k.toLowerCase() === k.toLowerCase(); })[0];
  return { id: same ? same.id : uid(), k:k, ph:ph };
}
function scnSeed(){
  var d = scnData();
  if(d.seeded) return;
  SCN_BASE.forEach(function(b){
    d.models.push({ id:uid(), cat:b.cat, title:b.title, sub:b.sub, call:b.call,
      items:b.items.map(function(l){ return scnParseItem(l); }) });
  });
  d.seeded = true;
  save();
}
function scnById(id){ return scnData().models.filter(function(m){ return m.id === id; })[0] || null; }
function scnVals(m){
  var d = scnData();
  var v = d.vals[m.id];
  if(!v || typeof v !== "object") v = d.vals[m.id] = { tag:"", items:{} };
  if(!v.items) v.items = {};
  return v;
}
function scnCount(m){
  var v = (scnData().vals[m.id] || {}).items || {}, n = 0, used = false;
  m.items.forEach(function(it){
    var x = v[it.id];
    if(x && x.ok) n++;
    if(x && (x.ok || (x.v || "").trim())) used = true;
  });
  return { done:n, tot:m.items.length, used:used || !!((scnData().vals[m.id] || {}).tag || "").trim() };
}

function renderScn(){
  scnData();
  $("modeScnName").textContent = t("mScn");
  if(sview.id && scnById(sview.id)) renderScnPage();
  else { sview.id = null; renderScnHome(); }
}

/* ------------------------------------------------------------- le tessere */
function renderScnHome(){
  var root = $("scnRoot");
  root.textContent = "";
  var stick = document.createElement("div"); stick.className = "scnstick";
  var head = document.createElement("header"); head.className = "pathead";
  var ti = document.createElement("div"); ti.className = "ptitle";
  var tt = document.createElement("span"); tt.textContent = t("scnTitle");
  var nn = document.createElement("span"); nn.className = "n"; nn.textContent = String(scnData().models.length);
  ti.appendChild(tt); ti.appendChild(nn);
  var nb = document.createElement("button"); nb.className = "newbtn"; nb.textContent = "+";
  nb.setAttribute("aria-label", t("scnNew"));
  nb.onclick = function(){ openScnSheet(null); };
  head.appendChild(ti); head.appendChild(nb);
  stick.appendChild(head);

  var fr = document.createElement("div"); fr.className = "patfilter";
  var sw = document.createElement("div"); sw.className = "searchwrap";
  var q = document.createElement("input"); q.placeholder = t("scnSearch"); q.autocomplete = "off";
  q.value = sview.q;
  var sx = document.createElement("button"); sx.className = "sx"; sx.hidden = !sview.q;
  sx.setAttribute("aria-label", t("del")); sx.appendChild(svgIcon("x", 15));
  sw.appendChild(q); sw.appendChild(sx); fr.appendChild(sw);
  stick.appendChild(fr);
  root.appendChild(stick);

  var grid = document.createElement("div"); grid.className = "scntiles";
  root.appendChild(grid);

  function fill(){
    grid.textContent = "";
    var qq = sview.q.trim().toLowerCase();
    var list = scnData().models.filter(function(m){
      if(!qq) return true;
      var hay = [m.title, m.sub, m.call, scnCatName(m.cat)].concat(m.items.map(function(i){ return i.k; }))
        .join(" ").toLowerCase();
      return hay.indexOf(qq) >= 0;
    });
    list.forEach(function(m){ grid.appendChild(scnTile(m)); });
    if(!list.length){
      var e = document.createElement("p"); e.className = "emptysm"; e.textContent = t("scnEmpty");
      e.style.gridColumn = "1 / -1";
      grid.appendChild(e);
    }
    if(!qq){
      var add = document.createElement("button"); add.className = "scntile add";
      var pl = document.createElement("span"); pl.className = "plus"; pl.textContent = "+";
      var lb = document.createElement("span"); lb.textContent = t("scnNew");
      add.appendChild(pl); add.appendChild(lb);
      add.onclick = function(){ openScnSheet(null); };
      grid.appendChild(add);
    }
  }
  q.addEventListener("input", function(){ sview.q = q.value; sx.hidden = !q.value; fill(); });
  sx.onclick = function(){ sview.q = ""; q.value = ""; sx.hidden = true; fill(); q.focus(); };
  fill();
}

function scnTile(m){
  var b = document.createElement("button"); b.className = "scntile";
  b.style.setProperty("--cc", scnCatVar(m.cat));
  var c = scnCount(m);
  if(c.used) b.classList.add("going");
  var k = document.createElement("span"); k.className = "k"; k.textContent = scnCatName(m.cat);
  var tt = document.createElement("span"); tt.className = "t"; tt.textContent = m.title;
  b.appendChild(k); b.appendChild(tt);
  if(m.sub){ var s = document.createElement("span"); s.className = "s"; s.textContent = m.sub; b.appendChild(s); }
  if(c.used){
    var pr = document.createElement("span"); pr.className = "pr";
    var tag = (scnVals(m).tag || "").trim();
    pr.textContent = c.done + "/" + c.tot + (tag ? " · " + tag : "");
    b.appendChild(pr);
  }
  b.onclick = function(){ scnApri(m.id); };
  return b;
}

function scnApri(id){
  sview.y = window.scrollY;
  sview.id = id;
  renderScnPage();
  window.scrollTo(0, 0);
}
function scnChiudi(){
  var a = document.activeElement; if(a && a.blur) a.blur();
  sview.id = null;
  renderScnHome();
  var y = sview.y;
  requestAnimationFrame(function(){ window.scrollTo(0, y); });
}

/* ------------------------------------------------------------- la pagina */
function renderScnPage(){
  var m = scnById(sview.id);
  if(!m){ sview.id = null; renderScnHome(); return; }
  var V = scnVals(m);
  var root = $("scnRoot");
  root.textContent = "";
  root.style.setProperty("--cc", scnCatVar(m.cat));

  var head = document.createElement("header"); head.className = "pdet-head scnhead";
  var top = document.createElement("div"); top.className = "pdet-top";
  var back = document.createElement("button"); back.className = "iconbtn"; back.innerHTML = "&#8249;";
  back.setAttribute("aria-label", t("scnTitle"));
  back.onclick = scnChiudi;
  var id = document.createElement("div"); id.className = "pdet-id";
  var sk = document.createElement("div"); sk.className = "sk"; sk.textContent = scnCatName(m.cat);
  var st = document.createElement("div"); st.className = "st"; st.textContent = m.title;
  id.appendChild(sk); id.appendChild(st);
  var ed = document.createElement("button"); ed.className = "iconbtn";
  ed.setAttribute("aria-label", t("scnEdit")); ed.appendChild(svgIcon("gear", 18));
  ed.onclick = function(){ openScnSheet(m); };
  top.appendChild(back); top.appendChild(id); top.appendChild(ed);
  head.appendChild(top);

  var bar = document.createElement("div"); bar.className = "scnbar";
  var tag = document.createElement("input"); tag.className = "scntag"; tag.placeholder = t("scnTag");
  tag.autocomplete = "off"; tag.value = V.tag || "";
  tag.addEventListener("input", function(){ V.tag = tag.value; salvaPresto(); });
  var rs = document.createElement("button"); rs.className = "ghostsm"; rs.textContent = t("scnReset");
  rs.onclick = function(){ scnRicomincia(m); };
  var cnt = document.createElement("span"); cnt.className = "cnt";
  bar.appendChild(tag); bar.appendChild(rs); bar.appendChild(cnt);
  head.appendChild(bar);
  root.appendChild(head);

  if((m.call || "").trim()){
    var call = document.createElement("div"); call.className = "scncall";
    var cb = document.createElement("b"); cb.textContent = t("scnCall") + " ";
    call.appendChild(cb); call.appendChild(document.createTextNode(m.call));
    root.appendChild(call);
  }

  var rows = document.createElement("div"); rows.className = "scnrows";
  m.items.forEach(function(it){ rows.appendChild(scnRow(m, it, V, conta)); });
  root.appendChild(rows);
  conta();

  function conta(){
    var c = scnCount(m);
    cnt.textContent = c.done + "/" + c.tot;
  }
}

var scnSaveT = null;
function salvaPresto(){
  clearTimeout(scnSaveT);
  scnSaveT = setTimeout(save, 250);
}

function scnRow(m, it, V, conta){
  var x = V.items[it.id] || { v:"", ok:false, ts:0, man:false };
  var row = document.createElement("div"); row.className = "scnrow" + (x.ok ? " ok" : "");
  var chk = document.createElement("button"); chk.className = "scnchk";
  chk.setAttribute("aria-label", it.k); chk.setAttribute("aria-pressed", x.ok ? "true" : "false");
  chk.appendChild(svgIcon("check", 17, 2.4));
  var k = document.createElement("div"); k.className = "scnk"; k.textContent = it.k;
  var ts = document.createElement("span"); ts.className = "ts";
  k.appendChild(ts);
  var v = document.createElement("textarea"); v.className = "scnv"; v.rows = 1;
  v.placeholder = it.ph || t("scnVal"); v.value = x.v || "";
  v.setAttribute("aria-label", it.k);

  function tieni(){ V.items[it.id] = x; }
  function ora(){ ts.textContent = x.ts ? fmtTime(x.ts) : ""; }
  function cresci(){ v.style.height = "auto"; v.style.height = v.scrollHeight + "px"; }
  function spunta(on){
    x.ok = on; row.classList.toggle("ok", on);
    chk.setAttribute("aria-pressed", on ? "true" : "false");
    conta();
  }
  function tocco(){
    x.man = true; spunta(!x.ok);
    if(x.ok && !x.ts) x.ts = Date.now();
    ora(); tieni(); save();
    if(S.settings.vibrate && navigator.vibrate) try{ navigator.vibrate(8); }catch(e){}
  }
  chk.onclick = tocco;
  k.onclick = tocco;
  v.addEventListener("input", function(){
    x.v = v.value;
    x.ts = Date.now();
    /* il primo valore spunta la casella, finche' non la tocchi tu */
    if(!x.man) spunta(!!v.value.trim());
    ora(); cresci(); tieni(); salvaPresto();
  });
  v.addEventListener("blur", function(){ save(); });
  ora();
  row.appendChild(chk); row.appendChild(k); row.appendChild(v);
  requestAnimationFrame(cresci);
  return row;
}

function scnRicomincia(m){
  var d = scnData();
  var prima = d.vals[m.id];
  d.vals[m.id] = { tag:"", items:{} };
  save(); renderScnPage();
  showToast(t("scnResetDone"), t("undo"), function(){
    d.vals[m.id] = prima || { tag:"", items:{} };
    save(); renderScn();
  });
}

/* ------------------------------------------------------------- nuovo / modifica */
function openScnSheet(m){
  var nuovo = !m;
  var cat = m ? m.cat : "alt";
  openSheet(function(sheet, close){
    var h = document.createElement("h2"); h.textContent = nuovo ? t("scnNew") : t("scnEdit");
    sheet.appendChild(h);

    sheet.appendChild(labelEl(t("scnName")));
    var nm = document.createElement("input"); nm.className = "scnin"; nm.value = m ? m.title : "";
    sheet.appendChild(nm);

    sheet.appendChild(labelEl(t("scnCat")));
    var chips = document.createElement("div"); chips.className = "catchips";
    SCN_CAT.forEach(function(c){
      var b = document.createElement("button"); b.className = "catchip" + (c.id === cat ? " on" : "");
      b.style.setProperty("--cc", scnCatVar(c.id));
      b.textContent = c[S.settings.ui] || c.it;
      b.onclick = function(){
        cat = c.id;
        Array.prototype.forEach.call(chips.children, function(z){ z.classList.remove("on"); });
        b.classList.add("on");
      };
      chips.appendChild(b);
    });
    sheet.appendChild(chips);

    sheet.appendChild(labelEl(t("scnItems")));
    var ta = document.createElement("textarea"); ta.className = "pastearea"; ta.style.minHeight = "170px";
    ta.placeholder = t("scnItemsPh");
    ta.value = m ? m.items.map(function(i){ return i.k + (i.ph ? " | " + i.ph : ""); }).join("\n") : "";
    sheet.appendChild(ta);
    var nt = document.createElement("p"); nt.className = "labnote"; nt.textContent = t("scnItemsNote");
    sheet.appendChild(nt);

    sheet.appendChild(labelEl(t("scnSub")));
    var sb = document.createElement("input"); sb.className = "scnin"; sb.value = m ? (m.sub || "") : "";
    sheet.appendChild(sb);

    sheet.appendChild(labelEl(t("scnCallF")));
    var cl = document.createElement("input"); cl.className = "scnin"; cl.value = m ? (m.call || "") : "";
    sheet.appendChild(cl);

    var acts = document.createElement("div"); acts.className = "sheet-actions";
    var ok = document.createElement("button"); ok.className = "btn"; ok.style.background = "var(--accent)";
    ok.textContent = t("saveBtn");
    ok.onclick = function(){
      var title = nm.value.trim();
      if(!title){ showToast(t("scnNeedName")); nm.focus(); return; }
      var items = ta.value.split("\n").map(function(l){ return scnParseItem(l, m ? m.items : []); })
        .filter(Boolean);
      if(!items.length){ showToast(t("scnNeedItems")); ta.focus(); return; }
      if(nuovo){
        m = { id:uid(), cat:cat, title:title, sub:sb.value.trim(), call:cl.value.trim(), items:items };
        scnData().models.push(m);
      } else {
        m.cat = cat; m.title = title; m.sub = sb.value.trim(); m.call = cl.value.trim(); m.items = items;
      }
      save(); close();
      if(nuovo) scnApri(m.id); else renderScn();
    };
    var cn = document.createElement("button"); cn.className = "btn btn-ghost";
    cn.textContent = t("cancel"); cn.onclick = close;
    acts.appendChild(ok); acts.appendChild(cn);
    if(!nuovo){
      var del = document.createElement("button"); del.className = "btn btn-ghost";
      del.style.cssText = "color:var(--alert); border-color:var(--alert); margin-left:auto";
      del.textContent = t("scnDel");
      del.onclick = function(){ close(); scnElimina(m); };
      acts.appendChild(del);
    }
    sheet.appendChild(acts);
    if(nuovo) setTimeout(function(){ nm.focus(); }, 80);
  });
}

function scnElimina(m){
  var d = scnData();
  var idx = d.models.indexOf(m);
  if(idx < 0) return;
  var vals = d.vals[m.id];
  d.models.splice(idx, 1);
  delete d.vals[m.id];
  sview.id = null;
  save(); renderScnHome();
  showToast(t("scnDeleted"), t("undo"), function(){
    d.models.splice(Math.min(idx, d.models.length), 0, m);
    if(vals) d.vals[m.id] = vals;
    save(); renderScn();
  });
}

function initScn(){
  scnSeed();
  $("modeScn").onclick = function(){
    /* un secondo tocco sul tasto riporta alle tessere */
    if(mode === "scn" && sview.id){ scnChiudi(); return; }
    setMode("scn");
  };
  $("modeScnName").textContent = t("mScn");
}

/* ---------------------------------------------------------------- boot */
$("composeMic").appendChild(svgIcon("mic", 21));
$("settingsBtn").appendChild(svgIcon("gear", 19));
if(!load()){ seedDemo(); save(); }
view.day = todayStr(); view._wasToday = true;
if(!SR){ $("micNote").textContent = ""; }
render();
setInterval(tick, 10000);
tick();
initPat();
armaIndietro();
registraOffline();
})();
