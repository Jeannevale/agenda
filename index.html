<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0E6D7E"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="mobile-web-app-capable" content="yes"></head><body>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" id="gfonts" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<title>Agenda di turno</title>
<style>
:root{
  --bg:#E9EEEE;
  --surface:#FFFFFF;
  --surface-2:#F4F7F7;
  --ink:#12252A;
  --ink-2:#4A6068;
  --ink-3:#7D9198;
  --line:#D4DEDF;
  --line-strong:#B9C7C9;
  --accent:#0E6D7E;
  --accent-soft:#DBEDF0;
  --rail-todo:#2E4A54;
  --rail-todo-soft:#E4EAEB;
  --rail-result:#A8690F;
  --rail-result-soft:#F8EBD8;
  --rail-done:#457458;
  --rail-done-soft:#E1EDE5;
  --alert:#BE3A21;
  --alert-soft:#FAE2DC;
  --wish:#4E8F6A;
  --wish-soft:#E8F4EC;
  --shadow:0 1px 2px rgba(18,37,42,.06), 0 8px 24px -16px rgba(18,37,42,.35);
  --r:10px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D1517; --surface:#152123; --surface-2:#1C2B2E; --ink:#E7EFEF; --ink-2:#A6BCC0;
    --ink-3:#78908F; --line:#28393C; --line-strong:#3A4E52; --accent:#54C4D6; --accent-soft:#123840;
    --rail-todo:#93ABB2; --rail-todo-soft:#1E2C2F; --rail-result:#DFA54B; --rail-result-soft:#33280F;
    --rail-done:#7DB88E; --rail-done-soft:#182B1F; --alert:#FF6E4E; --alert-soft:#3A1A12;
    --wish:#79C49A; --wish-soft:#15241B;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.8);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1517; --surface:#152123; --surface-2:#1C2B2E; --ink:#E7EFEF; --ink-2:#A6BCC0;
  --ink-3:#78908F; --line:#28393C; --line-strong:#3A4E52; --accent:#54C4D6; --accent-soft:#123840;
  --rail-todo:#93ABB2; --rail-todo-soft:#1E2C2F; --rail-result:#DFA54B; --rail-result-soft:#33280F;
  --rail-done:#7DB88E; --rail-done-soft:#182B1F; --alert:#FF6E4E; --alert-soft:#3A1A12;
    --wish:#79C49A; --wish-soft:#15241B;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.8);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:16px; line-height:1.45;
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior-y:contain;
}
button,input,textarea,select{font:inherit; color:inherit}
button{cursor:pointer; background:none; border:none}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:6px}
.mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace; font-variant-numeric:tabular-nums}

.shell{max-width:620px; margin:0 auto; min-height:100dvh; display:flex; flex-direction:column;
  background:var(--bg); padding-inline:16px}

/* ---------- top bar ---------- */
.topbar{position:sticky; top:0; z-index:20; background:var(--bg);
  padding-block:10px 8px; display:flex; align-items:center; gap:8px;
  border-bottom:1px solid var(--line)}
.daynav{display:flex; align-items:center; gap:2px; flex:1; min-width:0}
.daylabel{display:flex; flex-direction:column; line-height:1.1; padding-inline:4px; min-width:0}
.dayname{font-family:"IBM Plex Sans Condensed","IBM Plex Sans",sans-serif; font-weight:600;
  font-size:19px; letter-spacing:.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.daydate{font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--ink-3); letter-spacing:.02em}
.iconbtn{width:34px; height:34px; display:grid; place-items:center; border-radius:8px;
  color:var(--ink-2); font-size:20px; line-height:1}
.iconbtn:hover{background:var(--surface-2)}
.iconbtn:disabled{opacity:.3; cursor:default}
.chip-today{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.06em;
  text-transform:uppercase; padding:6px 9px; border:1px solid var(--line-strong);
  border-radius:999px; color:var(--ink-2)}
.chip-today[hidden]{display:none}

/* ---------- alert banner ---------- */
.banner{display:flex; align-items:center; gap:10px; margin-top:10px;
  background:var(--alert-soft); border-left:3px solid var(--alert);
  border-radius:0 8px 8px 0; padding:9px 12px; color:var(--ink)}
.banner .pip{width:9px; height:9px; border-radius:50%; background:var(--alert); flex:none;
  animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1; transform:scale(1)} 50%{opacity:.35; transform:scale(.75)}}
.banner b{font-weight:600}
.banner button{margin-left:auto; font-size:13px; font-weight:600; color:var(--alert);
  text-decoration:underline; text-underline-offset:3px}

/* ---------- rails ---------- */
.rails{display:flex; gap:6px; margin-top:12px}
.rail-tab{flex:1; display:flex; flex-direction:column; align-items:flex-start; gap:2px;
  padding:8px 10px 9px; border-radius:9px; background:var(--surface-2);
  border:1px solid transparent; position:relative; text-align:left}
.rail-tab .rail-name{font-family:"IBM Plex Sans Condensed","IBM Plex Sans",sans-serif;
  font-weight:600; font-size:13.5px; letter-spacing:.02em; color:var(--ink-2); white-space:nowrap}
.rail-tab .rail-count{font-family:"IBM Plex Mono",monospace; font-size:17px; line-height:1;
  color:var(--ink-3); font-variant-numeric:tabular-nums}
.rail-tab.is-active{background:var(--surface); border-color:var(--line-strong); box-shadow:var(--shadow)}
.rail-tab.is-active .rail-name,.rail-tab.is-active .rail-count{color:var(--ink)}
.rail-tab[data-rail="todo"].is-active{border-bottom:2px solid var(--rail-todo)}
.rail-tab[data-rail="result"].is-active{border-bottom:2px solid var(--rail-result)}
.rail-tab[data-rail="done"].is-active{border-bottom:2px solid var(--rail-done)}
.rail-tab .dot{position:absolute; top:7px; right:8px; width:7px; height:7px; border-radius:50%;
  background:var(--alert)}
.rail-hint{font-size:12.5px; color:var(--ink-3); margin:9px 2px 2px}

/* ---------- list ---------- */
.list{flex:1; display:flex; flex-direction:column; gap:8px; padding-block:8px 132px}
.empty{padding:26px 4px; color:var(--ink-3); font-size:14px}
.demo-note{display:flex; align-items:center; gap:10px; flex-wrap:wrap; font-size:12.5px;
  color:var(--ink-3); background:var(--surface-2); border-radius:8px; padding:8px 11px}
.demo-note button{font-size:12.5px; font-weight:600; color:var(--accent);
  text-decoration:underline; text-underline-offset:3px}

.swipe{position:relative; border-radius:var(--r); overflow:hidden; background:var(--accent-soft)}
.swipe-behind{position:absolute; inset:0; display:flex; align-items:center; justify-content:flex-end;
  padding-right:16px; gap:6px; color:var(--accent); font-size:12px; font-weight:600;
  font-family:"IBM Plex Sans Condensed","IBM Plex Sans",sans-serif; letter-spacing:.04em;
  text-transform:uppercase; pointer-events:none}
.item{position:relative; background:var(--surface); border:1px solid var(--line);
  border-left:3px solid var(--rail-todo); border-radius:var(--r); padding:11px 12px 11px 13px;
  display:flex; gap:11px; align-items:flex-start; touch-action:pan-y; will-change:transform}
.item.stage-result{border-left-color:var(--rail-result)}
.item.stage-done{border-left-color:var(--rail-done); background:var(--surface-2)}
.item.is-firing{border-left-color:var(--alert); background:var(--alert-soft)}
.item.is-urgent .txt{font-weight:600}
/* le cose senza fretta: verdino, in fondo alla lista */
.item.is-wish{background:var(--wish-soft); border-left-color:var(--wish)}
.item.stage-done.is-wish{background:var(--surface-2); border-left-color:var(--rail-done)}
.wishchip{display:inline-flex; align-items:center; justify-content:center;
  padding:2px 7px; border-radius:5px; background:var(--wish); color:#fff}

.check{flex:none; width:26px; height:26px; margin-top:1px; border-radius:7px;
  border:1.5px solid var(--line-strong); background:var(--surface); display:grid; place-items:center;
  color:transparent; font-size:15px; transition:background .12s ease, border-color .12s ease}
.check:hover{border-color:var(--rail-todo)}
.check.checked{background:var(--rail-done); border-color:var(--rail-done); color:#fff}
.item.stage-done .check{background:var(--rail-done); border-color:var(--rail-done); color:#fff}

.body{flex:1; min-width:0}
.txt{font-size:15.5px; line-height:1.35; overflow-wrap:anywhere; white-space:pre-wrap;
  cursor:text; touch-action:manipulation; -webkit-user-select:none; user-select:none}
.edit-box{display:flex; flex-direction:column; gap:8px}
.edit-text{width:100%; min-height:62px; padding:9px 10px; border:1.5px solid var(--accent);
  border-radius:8px; background:var(--surface); color:var(--ink); font-size:15.5px; line-height:1.35;
  resize:vertical}
.edit-row{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.edit-row .edit-actions{margin-left:auto}
.edit-row .taginput{width:84px}
.edit-actions{margin-left:auto; display:flex; gap:8px}
.iconbtn.ok{background:var(--accent); color:#fff}
.iconbtn.ok:hover{background:var(--accent)}
.item.stage-done .txt{color:var(--ink-2)}
.meta{display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-top:7px}
.tagchip{font-family:"IBM Plex Mono",monospace; font-size:11.5px; padding:2px 7px; border-radius:5px;
  background:var(--rail-todo-soft); color:var(--ink-2); letter-spacing:.02em}
.tagchip.chi{background:var(--accent-soft); color:var(--accent); font-weight:500}
.bang{font-family:"IBM Plex Sans Condensed","IBM Plex Sans",sans-serif; font-weight:600; font-size:12px;
  letter-spacing:.06em; padding:2px 7px; border-radius:5px; background:var(--alert-soft);
  color:var(--alert); text-transform:uppercase}
.origin{font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--ink-3)}
.demo-chip{font-family:"IBM Plex Mono",monospace; font-size:10.5px; color:var(--ink-3);
  border:1px dashed var(--line-strong); border-radius:5px; padding:1px 6px}
.alarmchip{display:inline-flex; align-items:center; gap:5px; font-family:"IBM Plex Mono",monospace;
  font-size:11.5px; padding:2px 8px; border-radius:999px; background:var(--accent-soft);
  color:var(--accent)}
.alarmchip.late{background:var(--alert); color:#fff}
.seenbtn{font-size:11px; font-weight:600; text-decoration:underline; text-underline-offset:2px;
  color:inherit; font-family:"IBM Plex Sans",sans-serif}
.rowacts{display:flex; flex-direction:column; gap:4px; flex:none; margin:-2px -4px 0 0}
.rowacts .iconbtn{width:30px; height:30px; font-size:15px; color:var(--ink-3)}
.rowacts .iconbtn:hover{color:var(--ink); background:var(--surface-2)}

/* comment editor */
.result-editor{margin-top:10px; border-top:1px dashed var(--line); padding-top:9px}
.result-editor textarea{width:100%; min-height:56px; resize:vertical; padding:9px 10px;
  border:1px solid var(--line); border-radius:8px; background:var(--surface-2); color:var(--ink);
  font-size:14.5px; line-height:1.4}
.result-editor textarea::placeholder{color:var(--ink-3)}
.ed-actions{display:flex; gap:8px; align-items:center; margin-top:8px}
.btn{font-family:"IBM Plex Sans Condensed","IBM Plex Sans",sans-serif; font-weight:600;
  font-size:13.5px; letter-spacing:.02em; padding:8px 13px; border-radius:8px;
  background:var(--rail-done); color:#fff}
.btn:disabled{opacity:.4; cursor:default}
.btn-ghost{background:none; border:1px solid var(--line-strong); color:var(--ink-2)}
.mic-sm{width:34px; height:34px; border-radius:8px; border:1px solid var(--line-strong);
  display:grid; place-items:center; font-size:15px; color:var(--ink-2); flex:none}
.mic-sm.rec{background:var(--alert); border-color:var(--alert); color:#fff; animation:pulse 1.1s infinite}
.comment-read{margin-top:8px; font-size:14px; color:var(--ink-2); background:var(--surface);
  border:1px solid var(--line); border-radius:8px; padding:8px 10px; white-space:pre-wrap;
  overflow-wrap:anywhere}
.done-time{font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--ink-3)}

/* ---------- compose ---------- */
.compose{position:fixed; left:0; right:0; bottom:0; z-index:25; background:var(--bg);
  border-top:1px solid var(--line); padding:9px 16px calc(9px + env(safe-area-inset-bottom))}
.compose-in{max-width:620px; margin:0 auto; display:flex; flex-direction:column; gap:7px}
.crow{display:flex; gap:8px; align-items:flex-end}
.crow textarea{flex:1; min-height:44px; max-height:140px; resize:none; padding:11px 12px;
  border:1px solid var(--line-strong); border-radius:10px; background:var(--surface); color:var(--ink);
  font-size:15.5px; line-height:1.35}
.crow textarea::placeholder{color:var(--ink-3)}
.mic{width:44px; height:44px; flex:none; border-radius:10px; border:1px solid var(--line-strong);
  background:var(--surface); display:grid; place-items:center; font-size:19px; color:var(--ink-2)}
.mic.rec{background:var(--alert); border-color:var(--alert); color:#fff; animation:pulse 1.1s infinite}
.crow2{display:flex; gap:8px; align-items:center}
.taginput{width:88px; flex:none; padding:8px 10px; border:1px solid var(--line); border-radius:8px;
  background:var(--surface); font-family:"IBM Plex Mono",monospace; font-size:13.5px}
.urgbtn{width:38px; height:36px; flex:none; border:1px solid var(--line); border-radius:8px;
  background:var(--surface); font-weight:700; color:var(--ink-3); display:grid; place-items:center}
.urgbtn.on{background:var(--alert-soft); border-color:var(--alert); color:var(--alert)}
.wishbtn{width:38px; height:36px; flex:none; border:1px solid var(--line); border-radius:8px;
  background:var(--surface); color:var(--ink-3); display:grid; place-items:center}
.wishbtn.on{background:var(--wish-soft); border-color:var(--wish); color:var(--wish)}
.unlink{display:inline-flex; align-items:center; gap:6px; flex:none; padding:7px 9px;
  border:1px solid var(--accent); border-radius:8px; background:var(--accent-soft);
  color:var(--accent); font-family:"IBM Plex Mono",monospace; font-size:12.5px;
  max-width:130px; overflow:hidden; white-space:nowrap}
.unlink .ux{font-size:15px; line-height:1; opacity:.75}
.unlink:hover .ux{opacity:1}
.addbtn{margin-left:auto; padding:9px 18px; border-radius:8px; background:var(--accent); color:#fff;
  font-family:"IBM Plex Sans Condensed","IBM Plex Sans",sans-serif; font-weight:600; font-size:14px;
  letter-spacing:.02em}
.addbtn:disabled{opacity:.4}
.mic-note{font-size:12px; color:var(--ink-3); min-height:0}

/* ---------- sheets ---------- */
.scrim{position:fixed; inset:0; background:rgba(10,20,22,.5); z-index:40; display:grid;
  align-items:end; justify-items:center}
.sheet{width:100%; max-width:620px; background:var(--bg); border-radius:16px 16px 0 0;
  padding:16px 16px calc(20px + env(safe-area-inset-bottom)); max-height:88dvh; overflow-y:auto;
  box-shadow:0 -8px 40px rgba(0,0,0,.3)}
.sheet h2{font-family:"IBM Plex Sans Condensed","IBM Plex Sans",sans-serif; font-size:16px;
  letter-spacing:.03em; text-transform:uppercase; color:var(--ink-2); margin:0 0 4px}
.sheet .sub{font-size:14px; color:var(--ink-3); margin:0 0 14px; overflow-wrap:anywhere}
.grabber{width:38px; height:4px; border-radius:2px; background:var(--line-strong); margin:0 auto 14px}
.quickrow{display:flex; flex-wrap:wrap; gap:8px}
.qchip{padding:9px 14px; border-radius:999px; border:1px solid var(--line-strong);
  background:var(--surface); font-family:"IBM Plex Mono",monospace; font-size:14px; color:var(--ink)}
.qchip:hover{border-color:var(--accent); color:var(--accent)}
.fieldrow{display:flex; gap:8px; align-items:center; margin-top:14px}
.fieldrow input[type=time]{flex:1; padding:10px; border:1px solid var(--line-strong); border-radius:8px;
  background:var(--surface); font-family:"IBM Plex Mono",monospace; font-size:15px}
.sheet-label{font-family:"IBM Plex Sans Condensed","IBM Plex Sans",sans-serif; font-size:12.5px;
  letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3); margin:18px 0 7px}
.sheet-actions{display:flex; gap:8px; flex-wrap:wrap; margin-top:18px}
.seg{display:flex; gap:6px}
.seg button{flex:1; padding:9px; border-radius:8px; border:1px solid var(--line-strong);
  background:var(--surface); font-size:14px; color:var(--ink-2)}
.seg button.on{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600}
.switchrow{display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:11px 0; border-bottom:1px solid var(--line)}
.switchrow span{font-size:14.5px}
.sw{width:46px; height:27px; border-radius:999px; background:var(--line-strong); position:relative;
  flex:none; transition:background .15s ease}
.sw::after{content:""; position:absolute; top:3px; left:3px; width:21px; height:21px; border-radius:50%;
  background:#fff; transition:transform .15s ease}
.sw.on{background:var(--accent)}
.sw.on::after{transform:translateX(19px)}
.backup{width:100%; min-height:90px; padding:10px; border:1px solid var(--line); border-radius:8px;
  background:var(--surface-2); font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--ink-2);
  resize:vertical}
.foot-note{font-size:12px; color:var(--ink-3); margin-top:16px; line-height:1.5}

/* ---------- toast ---------- */
.toast{position:fixed; left:50%; transform:translateX(-50%); bottom:120px; z-index:60;
  background:var(--ink); color:var(--bg); padding:10px 14px; border-radius:10px; font-size:14px;
  display:flex; align-items:center; gap:14px; box-shadow:var(--shadow); max-width:90vw}
.toast button{color:var(--accent); font-weight:600; text-decoration:underline; text-underline-offset:3px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .toast button{color:#8ad7e5}}
:root[data-theme="dark"] .toast button{color:#8ad7e5}
@media (prefers-reduced-motion:reduce){*{animation:none !important; transition:none !important}}

/* ================= modalità: Turno / Pazienti ================= */
#modebar{position:fixed; top:0; left:0; right:0; z-index:30; background:var(--bg);
  border-bottom:1px solid var(--line); padding:7px 16px calc(7px);
  display:flex; justify-content:center}
.modeseg{display:flex; gap:4px; width:100%; max-width:620px; background:var(--surface-2);
  border:1px solid var(--line); border-radius:10px; padding:3px}
.modeseg button{flex:1; padding:7px 10px; border-radius:7px; font-size:13.5px; color:var(--ink-2);
  font-family:"IBM Plex Sans Condensed","IBM Plex Sans",sans-serif; font-weight:600;
  letter-spacing:.02em; display:flex; align-items:center; justify-content:center; gap:7px}
.modeseg button.on{background:var(--surface); color:var(--ink); box-shadow:var(--shadow)}
.modeseg .mcount{font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--ink-3)}
.modeseg button.on .mcount{color:var(--accent)}

/* ================= quaderno ================= */
.notehead{position:sticky; top:var(--mb); z-index:20; background:var(--bg);
  padding-block:10px 8px; display:flex; align-items:center; gap:10px;
  border-bottom:1px solid var(--line)}
/* titolo e ricerca restano insieme in alto mentre scorri */
.notestick{position:sticky; top:var(--mb); z-index:20; background:var(--bg);
  border-bottom:1px solid var(--line); padding-bottom:10px}
.notestick .notehead{position:static; border-bottom:none; padding-bottom:4px}
.notefind{display:flex; gap:6px; align-items:center}
.notefind input{flex:1; padding:9px 11px; border:1px solid var(--line); border-radius:8px;
  background:var(--surface); font-size:14.5px}
.nf-count{flex:none; min-width:40px; text-align:center; font-size:12.5px; color:var(--ink-3)}
.nf-count.zero{color:var(--alert)}
.nf-step{flex:none; width:36px; height:36px; border-radius:8px; border:1px solid var(--line-strong);
  display:grid; place-items:center; font-size:18px; line-height:1; color:var(--ink-2)}
/* le parole trovate: evidenziate senza toccare il testo salvato */
::highlight(nota-trovato){background-color:rgba(255,196,0,.38); color:inherit}
::highlight(nota-attuale){background-color:rgba(255,140,0,.85); color:#000}
.notehead .ptitle{flex:1; min-width:0; font-family:"IBM Plex Sans Condensed","IBM Plex Sans",sans-serif;
  font-weight:600; font-size:19px}
.tbtn{flex:none; padding:8px 14px; border-radius:8px; border:1px solid var(--line-strong);
  background:var(--surface); color:var(--ink-2); font-size:13.5px; font-weight:600;
  font-family:"IBM Plex Sans Condensed","IBM Plex Sans",sans-serif; letter-spacing:.02em}
.tbtn:hover{border-color:var(--accent); color:var(--accent)}
.notesaved{font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--ink-3);
  flex:none; width:44px; text-align:right}
/* si scrive qui dentro, e si vede subito come viene */
.notearea{width:100%; min-height:62dvh; margin-top:14px; margin-bottom:40px; padding:14px;
  border:1px solid var(--line); border-radius:var(--r); background:var(--surface);
  color:var(--ink); font-size:15.5px; line-height:1.55; overflow-wrap:anywhere;
  -webkit-user-select:text; user-select:text}
.notearea:focus{outline:none; border-color:var(--line-strong)}
/* mentre scrivi nel foglio, sotto c'e' tanto spazio quanto la tastiera */
body.kb-scrive{padding-bottom:var(--kb,0px)}
.notearea > div{min-height:1.55em}
.notearea .md-h{font-family:"IBM Plex Sans Condensed","IBM Plex Sans",sans-serif;
  font-weight:600; font-size:20px; line-height:1.3; color:var(--ink);
  margin:16px 0 4px; min-height:1.3em}
.notearea > .md-h:first-child{margin-top:0}
.notearea .nb-li{padding-left:15px; text-indent:-15px}
.notearea.vuoto > div:first-child::before{content:attr(data-ph); color:var(--ink-3)}

/* ================= lucchetto ================= */
.lockpane{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:16px; padding:40px 8px 120px; text-align:center}
.lockpane h2{font-family:"IBM Plex Sans Condensed","IBM Plex Sans",sans-serif; font-size:17px;
  letter-spacing:.03em; text-transform:uppercase; color:var(--ink-2); margin:0}
.lockpane p{font-size:13.5px; color:var(--ink-3); margin:0; max-width:34ch; line-height:1.5}
.pinbox{display:flex; gap:8px; align-items:center}
.pinbox input{width:132px; padding:11px 12px; border:1px solid var(--line-strong); border-radius:10px;
  background:var(--surface); font-family:"IBM Plex Mono",monospace; font-size:20px; letter-spacing:.3em;
  text-align:center}

/* ================= lista pazienti ================= */
.pathead{position:sticky; top:46px; z-index:20; background:var(--bg); padding-block:10px 8px;
  display:flex; align-items:center; gap:8px; border-bottom:1px solid var(--line)}
.pathead .ptitle{font-family:"IBM Plex Sans Condensed","IBM Plex Sans",sans-serif; font-weight:600;
  font-size:19px; flex:1; min-width:0; display:flex; align-items:baseline; gap:8px}
.pathead .ptitle .n{font-family:"IBM Plex Mono",monospace; font-size:12px; color:var(--ink-3)}
.newbtn{padding:8px 14px; border-radius:8px; background:var(--accent); color:#fff; flex:none;
  font-family:"IBM Plex Sans Condensed","IBM Plex Sans",sans-serif; font-weight:600; font-size:13.5px}
.patfilter{display:flex; gap:8px; align-items:center; margin-top:10px}
.patfilter input{flex:1; padding:9px 11px; border:1px solid var(--line); border-radius:8px;
  background:var(--surface); font-size:14.5px}
.ghostsm{padding:8px 11px; border:1px solid var(--line-strong); border-radius:8px; font-size:12.5px;
  color:var(--ink-2); flex:none; white-space:nowrap}
.ghostsm.on{background:var(--accent-soft); border-color:var(--accent); color:var(--accent)}

.patlist{flex:1; display:flex; flex-direction:column; gap:8px; padding-block:10px 132px}
.patcard{background:var(--surface); border:1px solid var(--line); border-left:3px solid var(--accent);
  border-radius:var(--r); padding:11px 12px; display:flex; gap:11px; align-items:flex-start;
  text-align:left; width:100%; touch-action:pan-y}
/* la scheda che stai spostando: quella vera fa da spazio vuoto, la copia segue il dito */
.patcard.placeholder{opacity:.22; filter:grayscale(1); border-style:dashed}
.patcard.ghost{position:fixed; z-index:70; margin:0; pointer-events:none; opacity:.97;
  border-left-color:var(--accent); transform:scale(1.02);
  box-shadow:0 14px 34px -10px rgba(18,37,42,.5)}
.patcard:hover{border-color:var(--line-strong)}
.patcard.off{border-left-color:var(--line-strong); background:var(--surface-2); opacity:.75}
.patcard.warn{border-left-color:var(--alert)}
.patcard .pc-main{flex:1; min-width:0}
.patcard .pc-alias{font-family:"IBM Plex Mono",monospace; font-size:16px; font-weight:500;
  letter-spacing:.01em; overflow-wrap:anywhere}
.patcard .pc-dx{font-size:13.5px; color:var(--ink-2); margin-top:3px; line-height:1.35;
  overflow-wrap:anywhere}
.patcard .pc-chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:7px}
.patcard .chev{flex:none; color:var(--ink-3); font-size:20px; line-height:1; margin-top:2px}
.minichip{font-family:"IBM Plex Mono",monospace; font-size:11px; padding:2px 7px; border-radius:5px;
  background:var(--surface-2); color:var(--ink-2); border:1px solid var(--line)}
.minichip.todo{background:var(--rail-todo-soft); border-color:transparent}
.minichip.res{background:var(--rail-result-soft); border-color:transparent; color:var(--rail-result)}
.minichip.bad{background:var(--alert-soft); border-color:transparent; color:var(--alert)}
.minichip.ok{background:var(--rail-done-soft); border-color:transparent; color:var(--rail-done)}

/* ================= calendario ================= */
.daylabel{cursor:pointer; text-align:left; background:none; border:none; padding-inline:4px}
.daylabel .dayname{text-decoration:underline; text-decoration-style:dotted;
  text-decoration-color:var(--line-strong); text-underline-offset:4px}
.daylabel:hover .dayname{text-decoration-color:var(--accent); color:var(--accent)}
.daydate .ahead{color:var(--accent)}
.calhead{display:flex; align-items:center; gap:6px; margin-bottom:12px}
.calmonth{flex:1; text-align:center; font-family:"IBM Plex Sans Condensed","IBM Plex Sans",sans-serif;
  font-weight:600; font-size:16px; letter-spacing:.02em; text-transform:capitalize}
.caldow{display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:4px; margin-bottom:4px}
.caldow span{text-align:center; font-family:"IBM Plex Mono",monospace; font-size:11px;
  color:var(--ink-3); text-transform:uppercase; min-width:0; overflow:hidden}
.calgrid{display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:4px}
.calcell{min-width:0; height:46px; padding:0; border-radius:9px; background:var(--surface);
  border:1px solid var(--line); font-family:"IBM Plex Mono",monospace; font-size:14px; color:var(--ink)}
.calcell .cin{display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:2px; width:100%; height:100%}
.calcell:hover{border-color:var(--accent)}
.calcell.out{opacity:.35; background:none; border-color:transparent}
.calcell.today{border-color:var(--accent); color:var(--accent); font-weight:500}
.calcell.sel{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600}
.calcell .cnum{display:block; line-height:1}
.calcell .cdot{display:block; flex:none; width:5px; height:5px; border-radius:50%;
  background:var(--rail-todo)}
.calcell.today .cdot{background:var(--accent)}
.calcell.sel .cdot{background:#fff}
.calcell .cdot-off{background:transparent}
.callegend{font-size:12px; color:var(--ink-3); margin-top:12px; line-height:1.5}

/* scelta del giorno per un compito nuovo */
#composeDay{display:flex; align-items:center; flex:none}
.daypick{display:flex; align-items:center; gap:6px; flex:none}
.crow2 .mic-sm{width:36px; height:36px}
@media (max-width:400px){ .crow2 .taginput{width:60px} .crow2 .mic-note{display:none} }
@media (max-width:400px){
  .crow2{gap:6px}
  .crow2 .urgbtn,.crow2 .wishbtn{width:34px; height:34px}
  .crow2 .mic-sm{width:34px; height:34px}
  .crow2 .addbtn{padding:9px 13px}
}
@media (max-width:340px){ .crow2 .taginput{width:48px} .crow2 .addbtn{padding:9px 10px} }
.daypick .mic-sm.on{background:var(--accent-soft); border-color:var(--accent); color:var(--accent)}
.daypick-lab{font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--accent);
  white-space:nowrap}
.daypick-lab.off{display:none}

/* frasi diventate compito */
.mktask{display:inline; font:inherit; padding:1px 5px; margin:0; border:none; text-align:left;
  background:var(--accent-soft); color:var(--accent); border-radius:5px;
  box-decoration-break:clone; -webkit-box-decoration-break:clone}
.mktask.done{background:var(--rail-done-soft); color:var(--rail-done);
  text-decoration:line-through; text-decoration-color:var(--rail-done)}
.mktask.gone{background:var(--surface-2); color:var(--ink-3)}

/* foto a schermo intero */
.viewer{position:fixed; inset:0; z-index:80; background:rgba(8,14,16,.975);
  display:flex; align-items:center; justify-content:center; overflow:auto;
  -webkit-overflow-scrolling:touch}
.viewer img{max-width:100%; max-height:100dvh; object-fit:contain; display:block;
  cursor:zoom-in; margin:auto}
.viewer.zoom{align-items:flex-start; justify-content:flex-start}
.viewer.zoom img{max-width:none; max-height:none; width:250%; height:auto; cursor:zoom-out;
  margin:0}
.viewer .vclose{position:fixed; top:calc(12px + env(safe-area-inset-top)); right:12px;
  width:40px; height:40px; border-radius:50%; background:rgba(255,255,255,.18); color:#fff;
  display:grid; place-items:center; z-index:2}
.viewer .vclose:hover{background:rgba(255,255,255,.3)}
.viewer .vname{position:fixed; left:14px; bottom:calc(14px + env(safe-area-inset-bottom));
  color:rgba(255,255,255,.7); font-family:"IBM Plex Mono",monospace; font-size:11.5px;
  max-width:68vw; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; pointer-events:none}

/* ================= foto nei commenti ================= */
.photorow{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:9px}
.photothumb{position:relative; width:58px; height:58px; border-radius:8px; overflow:hidden;
  border:1px solid var(--line); background:var(--surface-2); flex:none}
.photothumb img{width:100%; height:100%; object-fit:cover; display:block; cursor:zoom-in}
.photothumb .px{position:absolute; top:2px; right:2px; width:20px; height:20px; border-radius:50%;
  background:rgba(10,20,22,.6); color:#fff; display:grid; place-items:center;
  font-size:13px; line-height:1; padding:0}
.photoadd{width:58px; height:58px; border-radius:8px; border:1px dashed var(--line-strong);
  display:grid; place-items:center; color:var(--ink-3); flex:none; background:none}
.photoadd:hover{border-color:var(--accent); color:var(--accent)}
.srcbtn{display:flex; align-items:center; gap:13px; width:100%; text-align:left; padding:13px 14px;
  border:1px solid var(--line); border-radius:10px; background:var(--surface); margin-top:10px;
  font-size:15px; color:var(--ink)}
.srcbtn:hover{border-color:var(--accent)}
.srcbtn .si{width:38px; height:38px; border-radius:9px; background:var(--accent-soft);
  color:var(--accent); display:grid; place-items:center; flex:none}

/* campo data: niente selettore del telefono, niente OK */
.datefield{width:100%; display:flex; align-items:center; gap:8px; padding:10px 11px;
  border:1px solid var(--line-strong); border-radius:8px; background:var(--surface);
  color:var(--ink); font-size:15px; text-align:left}
.datefield span:first-child{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis;
  white-space:nowrap}
.datefield .dfic{color:var(--ink-3); font-size:12px; flex:none}
.datefield.vuoto span:first-child{color:var(--ink-3)}
.datefield:hover{border-color:var(--accent)}

/* ================= checklist ================= */
.chkbox{border:1px solid var(--line); border-left:3px solid var(--accent); border-radius:9px;
  padding:10px 11px; margin-top:9px; background:var(--surface)}
.chkhead{display:flex; align-items:center; gap:9px; padding-bottom:7px;
  border-bottom:1px solid var(--line); margin-bottom:4px}
.chkname{flex:1; min-width:0; font-family:"IBM Plex Sans Condensed","IBM Plex Sans",sans-serif;
  font-weight:600; font-size:14.5px; letter-spacing:.01em; overflow-wrap:anywhere}
.chkcount{font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--ink-3);
  background:var(--surface-2); border-radius:5px; padding:2px 7px; flex:none}
.chkcount.full{background:var(--rail-done-soft); color:var(--rail-done)}
.chkitem{display:flex; align-items:flex-start; gap:10px; width:100%; text-align:left;
  padding:8px 0; border-bottom:1px solid var(--line)}
.chkitem:last-of-type{border-bottom:none}
.chkmark{flex:none; width:22px; height:22px; margin-top:1px; border-radius:6px;
  border:1.5px solid var(--line-strong); background:var(--surface); display:grid; place-items:center;
  color:#fff; transition:background .12s ease, border-color .12s ease}
.chkitem.on .chkmark{background:var(--rail-done); border-color:var(--rail-done)}
.chkitem:hover .chkmark{border-color:var(--rail-todo)}
.chktext{flex:1; min-width:0; font-size:14.5px; line-height:1.35; overflow-wrap:anywhere}
.chkitem.on .chktext{color:var(--ink-3); text-decoration:line-through;
  text-decoration-color:var(--line-strong)}
.chkcomment{width:100%; min-height:40px; max-height:150px; margin-top:8px; padding:8px 10px;
  border:1px solid var(--line); border-radius:8px; background:var(--surface-2); color:var(--ink);
  font-size:14px; line-height:1.4; resize:none}
.chkcomment::placeholder{color:var(--ink-3)}
.tplrow{display:flex; align-items:center; gap:10px; width:100%; text-align:left;
  padding:11px 12px; margin-top:8px; border:1px solid var(--line); border-radius:9px;
  background:var(--surface)}
.tplrow:hover{border-color:var(--accent)}
.tplname{flex:1; min-width:0; font-size:14.5px; overflow-wrap:anywhere}
.tpln{font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--ink-3); flex:none}

/* ================= scheda paziente ================= */
.pdet-head{position:sticky; top:46px; z-index:20; background:var(--bg); padding-block:8px;
  border-bottom:1px solid var(--line)}
.pdet-top{display:flex; align-items:flex-start; gap:6px}
.pdet-id{flex:1; min-width:0}
.pdet-alias{font-family:"IBM Plex Mono",monospace; font-size:19px; font-weight:500;
  display:flex; align-items:baseline; gap:8px; flex-wrap:wrap}
.pdet-dx{font-size:13px; color:var(--ink-2); margin-top:3px; line-height:1.35; overflow-wrap:anywhere}
.pdet-day{font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--ink-3); margin-top:2px}
.ptabs{display:flex; gap:6px; margin-top:10px; overflow-x:auto; scrollbar-width:none;
  -ms-overflow-style:none; padding-bottom:2px}
.ptabs::-webkit-scrollbar{display:none}
.ptab{flex:none; padding:7px 12px; border-radius:999px; border:1px solid var(--line);
  background:var(--surface-2); font-size:13px; color:var(--ink-2); white-space:nowrap;
  font-family:"IBM Plex Sans Condensed","IBM Plex Sans",sans-serif; font-weight:600; letter-spacing:.02em;
  display:flex; align-items:center; gap:6px}
.ptab.on{background:var(--accent); border-color:var(--accent); color:#fff}
.ptab .tn{font-family:"IBM Plex Mono",monospace; font-size:11px; opacity:.8}
.ptab .warndot{width:6px; height:6px; border-radius:50%; background:var(--alert)}
.ptab.on .warndot{background:#fff}

.psec{flex:1; display:flex; flex-direction:column; gap:10px; padding-block:12px 132px}
.seccard{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:12px}
.seccard h3{font-family:"IBM Plex Sans Condensed","IBM Plex Sans",sans-serif; font-size:12.5px;
  letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3); margin:0 0 9px;
  display:flex; align-items:center; gap:8px}
.seccard h3{flex-wrap:wrap}
.seccard h3 .hact{margin-left:auto; font-size:12.5px; color:var(--accent); font-weight:600;
  text-transform:none; letter-spacing:0; text-decoration:underline; text-underline-offset:3px;
  white-space:nowrap}
.emptysm{font-size:13.5px; color:var(--ink-3); padding:4px 0}

/* terapia */
.medrow{display:flex; gap:10px; align-items:flex-start; padding:8px 0; border-top:1px solid var(--line)}
.medrow:first-of-type{border-top:none}
.medrow.stopped{opacity:.5}
.medrow .mname{flex:1; min-width:0; font-size:14.5px; overflow-wrap:anywhere}
.medrow .mname .mnote{display:block; font-size:12.5px; color:var(--ink-3); margin-top:2px}
.medrow .mdose{font-family:"IBM Plex Mono",monospace; font-size:13px; color:var(--ink-2);
  white-space:nowrap; flex:none}
.medrow .mx{flex:none; width:28px; height:28px; display:grid; place-items:center; border-radius:7px;
  color:var(--ink-3)}
.medrow .mx:hover{background:var(--surface-2); color:var(--ink)}

/* laboratorio */
.labwrap{overflow-x:auto; margin:0 -12px; padding:0 12px}
table.labtab{border-collapse:collapse; width:100%; min-width:max-content}
table.labtab th,table.labtab td{padding:5px 8px; text-align:right; white-space:nowrap;
  border-bottom:1px solid var(--line); font-family:"IBM Plex Mono",monospace; font-size:12.5px}
table.labtab th{font-size:11px; color:var(--ink-3); font-weight:500; letter-spacing:.04em}
table.labtab th.pname,table.labtab td.pname{text-align:left; font-family:"IBM Plex Sans",sans-serif;
  font-size:13px; position:sticky; left:0; background:var(--surface); z-index:1; padding-left:0}
table.labtab td.pname{color:var(--ink)}
table.labtab td.unit{color:var(--ink-3); font-size:11px; text-align:left}
table.labtab tr.grouprow td{background:var(--surface-2); color:var(--ink-2); font-size:11px;
  letter-spacing:.06em; text-transform:uppercase; text-align:left; font-family:"IBM Plex Sans Condensed",sans-serif;
  font-weight:600; padding-top:8px}
table.labtab td.val.hi{color:var(--alert); font-weight:500}
table.labtab td.val.lo{color:var(--accent); font-weight:500}
table.labtab td.val.last{background:var(--surface-2)}
table.labtab td.ref{color:var(--ink-3); font-size:11px}
.arrow{font-size:10px; margin-left:2px}
.spark{display:block}
.labnote{font-size:11.5px; color:var(--ink-3); margin-top:9px; line-height:1.45}

/* griglia inserimento valori */
.labgrid{display:grid; grid-template-columns:1fr auto; gap:6px 10px; align-items:center}
.labgrid .lg-name{font-size:14px}
.labgrid .lg-name small{color:var(--ink-3); font-family:"IBM Plex Mono",monospace; font-size:11px;
  margin-left:6px}
.labgrid input{width:96px; padding:7px 9px; border:1px solid var(--line); border-radius:7px;
  background:var(--surface); font-family:"IBM Plex Mono",monospace; font-size:14px; text-align:right}
.labgrid input:focus{border-color:var(--accent)}
.lg-group{grid-column:1/-1; font-family:"IBM Plex Sans Condensed",sans-serif; font-weight:600;
  font-size:11.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3);
  margin-top:12px; border-bottom:1px solid var(--line); padding-bottom:4px}
.freerow{display:flex; gap:6px; margin-top:6px}
.freerow input.fn{flex:1; min-width:0; text-align:left}

/* note e documenti */
.noteitem{border-top:1px solid var(--line); padding:9px 0; display:flex; gap:10px;
  align-items:flex-start}
.noteitem:first-of-type{border-top:none}
.noteitem .nbody{flex:1; min-width:0}
.noteitem .ntime{font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--ink-3)}
.noteitem .ntext{font-size:14.5px; white-space:pre-wrap; overflow-wrap:anywhere; margin-top:2px;
  cursor:text; touch-action:manipulation; -webkit-user-select:none; user-select:none}
.filecard{display:flex; gap:10px; align-items:center; border:1px solid var(--line); border-radius:8px;
  padding:8px 10px; margin-top:7px; background:var(--surface-2)}
.filecard .fmeta{flex:1; min-width:0}
.filecard .fname{font-size:13.5px; overflow-wrap:anywhere}
.filecard .fsub{font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--ink-3)}
.filecard img{width:46px; height:46px; object-fit:cover; border-radius:6px; flex:none}
.pdficon{width:46px; height:46px; border-radius:6px; flex:none; display:grid; place-items:center;
  background:var(--alert-soft); color:var(--alert); font-family:"IBM Plex Mono",monospace;
  font-size:10px; font-weight:500}
.warnbox{display:flex; gap:9px; background:var(--alert-soft); border-left:3px solid var(--alert);
  border-radius:0 8px 8px 0; padding:9px 11px; font-size:12.5px; line-height:1.45; color:var(--ink)}

/* riassunto */
.sumbox{width:100%; min-height:260px; padding:11px; border:1px solid var(--line); border-radius:8px;
  background:var(--surface-2); font-family:"IBM Plex Mono",monospace; font-size:11.5px; line-height:1.5;
  color:var(--ink); resize:vertical; white-space:pre}
.bigbtn{width:100%; padding:12px; border-radius:9px; background:var(--accent); color:#fff;
  font-family:"IBM Plex Sans Condensed","IBM Plex Sans",sans-serif; font-weight:600; font-size:15px;
  letter-spacing:.02em; display:flex; align-items:center; justify-content:center; gap:9px}
.btnrow{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px}
.btnrow .btn{flex:1; min-width:120px; justify-content:center; display:flex}

/* proposte */
.propitem{border:1px solid var(--line); border-left:3px solid var(--rail-result); border-radius:8px;
  padding:10px 11px; margin-top:8px; background:var(--surface)}
.propitem.none{border-left-color:var(--line-strong); background:var(--surface-2)}
.propitem .ptime{font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--ink-3)}
.propitem .ptext{font-size:14.5px; white-space:pre-wrap; overflow-wrap:anywhere; margin-top:4px}
.propitem .pacts{display:flex; gap:8px; flex-wrap:wrap; margin-top:9px}
.propitem .pacts button{font-size:12.5px; font-weight:600; color:var(--accent);
  text-decoration:underline; text-underline-offset:3px}
.propitem .pacts button.del{color:var(--ink-3)}
.pastearea{width:100%; min-height:92px; padding:10px; border:1px solid var(--line); border-radius:8px;
  background:var(--surface-2); font-size:14px; line-height:1.45; color:var(--ink); resize:vertical}

/* redazione immagine */
.redwrap{position:relative; width:100%; background:var(--ink); border-radius:8px; overflow:hidden;
  touch-action:none}
.redwrap canvas{display:block; width:100%; height:auto}

/* righe di inserimento dei valori: nome, numero, unita' */
.entryrow{display:flex; gap:6px; align-items:center; margin-top:8px}
.entryrow input{padding:8px 9px; border:1px solid var(--line); border-radius:7px;
  background:var(--surface); color:var(--ink); font-size:14px; min-width:0}
.entryrow input:focus{border-color:var(--accent)}
.entryrow .e-name{flex:1 1 auto}
.entryrow .e-val{width:78px; flex:none; text-align:right;
  font-family:"IBM Plex Mono",monospace}
.entryrow .e-unit{width:72px; flex:none; font-family:"IBM Plex Mono",monospace; font-size:12.5px}
.entryhint{font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--ink-3);
  margin:3px 0 0 2px; min-height:13px}
.chiprow{display:flex; flex-wrap:wrap; gap:6px; margin-top:2px}
.namechip{padding:6px 11px; border-radius:999px; border:1px solid var(--line-strong);
  background:var(--surface); font-size:13px; color:var(--ink-2)}
.namechip:hover{border-color:var(--accent); color:var(--accent)}
.namechip.mine{background:var(--accent-soft); border-color:transparent; color:var(--accent)}
table.labtab td.pname .namebtn{font:inherit; color:var(--ink); text-align:left; padding:0;
  text-decoration:underline; text-decoration-style:dotted; text-underline-offset:3px;
  text-decoration-color:var(--line-strong)}
table.labtab td.pname .namebtn:hover{text-decoration-color:var(--accent); color:var(--accent)}
.myval{display:flex; gap:6px; align-items:center; padding:8px 0; border-top:1px solid var(--line)}
.myval:first-of-type{border-top:none}
.myval .mv-name{flex:1; min-width:0; font-size:14px; overflow-wrap:anywhere}
.myval input{padding:6px 8px; border:1px solid var(--line); border-radius:6px;
  background:var(--surface); color:var(--ink); font-family:"IBM Plex Mono",monospace;
  font-size:12.5px; text-align:right}
.myval .mv-u{width:60px; text-align:left}
.myval .mv-n{width:58px}
@media (max-width:400px){
  .entryrow .e-unit{width:64px}
  .entryrow .e-val{width:66px}
  .myval .mv-u,.myval .mv-n{width:48px}
}

/* ================= elenchi di proposte (Impostazioni) ================= */
.sgnav{display:flex; flex-direction:column; border:1px solid var(--line); border-radius:9px;
  overflow:hidden; background:var(--surface)}
.sgnav button{display:flex; align-items:center; gap:10px; padding:11px 12px; text-align:left;
  border-top:1px solid var(--line); color:var(--ink); background:none; width:100%}
.sgnav button:first-child{border-top:none}
.sgnav button:hover{background:var(--surface-2)}
.sgnav .sg-t{flex:1; min-width:0}
.sgnav .sg-name{display:block; font-size:14.5px; font-weight:600}
.sgnav .sg-where{display:block; font-size:12px; color:var(--ink-3); margin-top:2px; line-height:1.35}
.sgnav .sg-n{flex:none; font-family:"IBM Plex Mono",monospace; font-size:12px; color:var(--ink-3)}
.sgnav .sg-chev{flex:none; color:var(--ink-3); font-size:20px; line-height:1}
.sglist{display:flex; flex-direction:column; gap:6px; margin-top:4px}
.sgitem{display:flex; gap:6px; align-items:center; background:var(--surface);
  border:1px solid var(--line); border-radius:8px; padding:4px 4px 4px 2px; touch-action:pan-y}
.sgitem.placeholder{opacity:.22; filter:grayscale(1); border-style:dashed}
.sgitem.ghost{position:fixed; z-index:70; margin:0; pointer-events:none; opacity:.97;
  transform:scale(1.02); box-shadow:0 14px 34px -10px rgba(18,37,42,.5)}
.sgitem .vgrip{width:28px; min-height:34px}
.sgitem input{flex:1; min-width:0; padding:7px 8px; border:1px solid transparent; border-radius:6px;
  background:transparent; color:var(--ink); font-size:15px}
.sgitem input:focus{border-color:var(--accent); background:var(--surface)}
.sgitem .mx{flex:none; width:32px; height:32px; display:grid; place-items:center; border-radius:7px;
  color:var(--ink-3)}
.sgitem .mx:hover{background:var(--surface-2); color:var(--alert)}
.sgadd{display:flex; gap:8px; margin-top:12px}
.sgadd input{flex:1; min-width:0; padding:10px 11px; border:1px solid var(--line-strong);
  border-radius:8px; background:var(--surface); color:var(--ink); font-size:15px}

/* ================= colleghi ================= */
/* il foglio di scrittura dentro una sezione: stesso quaderno, più basso */
.notearea.qsmall{min-height:32dvh; margin-top:0; margin-bottom:0; font-size:15px}
.seccard .notearea.qsmall{border-color:var(--line)}
.qhint{font-size:11.5px; color:var(--ink-3); margin:8px 0 0; line-height:1.45;
  display:flex; align-items:center; gap:8px}
.qhint .qsaved{font-family:"IBM Plex Mono",monospace; margin-left:auto; color:var(--accent)}

.evitem{border-top:1px solid var(--line); padding:10px 0; display:flex; gap:10px;
  align-items:flex-start}
.evitem:first-of-type{border-top:none}
.evitem .evbody{flex:1; min-width:0}
.evitem .evday{font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--accent)}
.evitem .evday .evago{color:var(--ink-3)}
.evitem .evtext{font-size:14.5px; white-space:pre-wrap; overflow-wrap:anywhere; margin-top:3px;
  cursor:text; touch-action:manipulation; -webkit-user-select:none; user-select:none}
.colcard .pc-alias{font-family:"IBM Plex Sans","IBM Plex Sans Condensed",sans-serif;
  font-weight:600; font-size:16px}

/* ================= Verlauf ================= */
.vbox{display:flex; gap:10px; align-items:flex-start; background:var(--surface);
  border:1px solid var(--line); border-left:3px solid var(--rail-todo);
  border-radius:9px; padding:10px 11px 10px 6px; touch-action:pan-y}
.vbox.placeholder{opacity:.22; filter:grayscale(1); border-style:dashed}
.vbox.ghost{position:fixed; z-index:70; margin:0; pointer-events:none; opacity:.97;
  transform:scale(1.02); box-shadow:0 14px 34px -10px rgba(18,37,42,.5)}
.vgrip{flex:none; width:26px; align-self:stretch; display:grid; place-items:center;
  color:var(--ink-3); border-radius:6px; cursor:grab; touch-action:none}
.vgrip:hover{background:var(--surface-2); color:var(--ink-2)}
.vbox .vbody{flex:1; min-width:0}
.vbox .vwhen{font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--ink-3);
  overflow-wrap:anywhere}
.vbox .vwhen[hidden]{display:none}
.verlwhen-in{width:100%; padding:9px 10px; border:1px solid var(--line-strong);
  border-radius:8px; background:var(--surface); color:var(--ink);
  font-family:"IBM Plex Mono",monospace; font-size:14px}
.edit-box .verlwhen-in{font-size:13px; padding:8px 10px}
.vbox .vtext{font-size:14.5px; line-height:1.45; white-space:pre-wrap; overflow-wrap:anywhere;
  margin-top:2px; cursor:text; touch-action:manipulation;
  -webkit-user-select:none; user-select:none}
/* caselle automatiche: partenza per l'intensiva e Wiederaufnahme */
.vbox.vk-icu{border-left-color:var(--icu); background:var(--icu-soft)}
.vbox.vk-back{border-left-color:var(--accent)}
.vkind{display:flex; flex-wrap:wrap; align-items:baseline; gap:2px 10px;
  touch-action:manipulation; -webkit-user-select:none; user-select:none}
.vkind .vk-t{font-family:"IBM Plex Sans Condensed","IBM Plex Sans",sans-serif; font-weight:600;
  font-size:15.5px; letter-spacing:.01em; color:var(--icu)}
.vbox.vk-back .vk-t{color:var(--accent)}
.vkind .vk-d{font-family:"IBM Plex Mono",monospace; font-size:12.5px; color:var(--ink-2)}

/* ================= morale ================= */
.moritem{background:var(--surface); border:1px solid var(--line);
  border-left:3px solid var(--rail-result); border-radius:var(--r);
  padding:11px 12px; display:flex; gap:10px; align-items:flex-start}
.moritem.flash{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
.moritem .mobody{flex:1; min-width:0}
.moritem .motext{font-size:15.5px; line-height:1.45; white-space:pre-wrap; overflow-wrap:anywhere;
  cursor:text; touch-action:manipulation; -webkit-user-select:none; user-select:none}
.mometa{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:8px}
.moday{font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--ink-3)}
.mochip{font-family:"IBM Plex Mono",monospace; font-size:11.5px; padding:2px 8px; border-radius:5px;
  background:var(--rail-result-soft); color:var(--rail-result); border:none}
.mochip:hover{text-decoration:underline; text-underline-offset:3px}
.mochip.off{background:var(--surface-2); color:var(--ink-3)}
/* le frasi diventate morale, dentro il testo dove le hai scritte */
.mkmoral{display:inline; font:inherit; padding:1px 5px; margin:0; border:none; text-align:left;
  background:var(--rail-result-soft); color:var(--rail-result); border-radius:5px;
  box-decoration-break:clone; -webkit-box-decoration-break:clone}
.mkmoral.gone{background:var(--surface-2); color:var(--ink-3)}

/* il braccio 2 vive sotto la barra fissa delle modalità */
:root{ --mb:56px; }
/* valori dettati */
.voicebox{margin-top:12px; padding:10px; border:1px solid var(--line); border-radius:10px;
  background:var(--surface)}
.voicemic{display:flex; align-items:center; justify-content:center; gap:8px; width:100%;
  padding:11px; border-radius:9px; background:var(--accent); color:#fff;
  font-family:"IBM Plex Sans Condensed","IBM Plex Sans",sans-serif; font-weight:600;
  font-size:15px; letter-spacing:.02em}
.voicemic.rec{background:var(--alert)}
.voiceta{min-height:58px; margin-top:8px}
.voicest{font-size:12.5px; color:var(--ink-2); margin-top:6px; min-height:0}
/* sezione terapia intensiva: a sinistra il titolo, a destra il testo */
.vbox.icuv{border-left-color:var(--icu)}
.icugrid{display:grid; grid-template-columns:min(118px, 42%) minmax(0, 1fr); gap:4px 10px;
  align-items:baseline; cursor:text; touch-action:manipulation;
  -webkit-user-select:none; user-select:none}
.icugrid .icut{font-family:"IBM Plex Sans Condensed","IBM Plex Sans",sans-serif; font-weight:600;
  font-size:14px; letter-spacing:.01em; color:var(--icu); overflow-wrap:break-word; line-height:1.35}
.icugrid .icux{font-size:14.5px; line-height:1.45; white-space:pre-wrap; overflow-wrap:anywhere}
.ptab.icutab{border-color:var(--icu); color:var(--icu)}
.ptab.icutab.on{background:var(--icu); border-color:var(--icu); color:#fff}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .ptab.icutab.on{ color:#1a1020; } }
:root[data-theme="dark"] .ptab.icutab.on{ color:#1a1020; }
.entryrow input.e-new{border-color:var(--rail-result); background:var(--rail-result-soft)}
/* nome nuovo dettato: un tocco corregge, due lo mettono nel vocabolario */
.entryrow input.e-name{touch-action:manipulation}
.entryrow input.e-name[readonly]{cursor:pointer; -webkit-user-select:none; user-select:none;
  -webkit-tap-highlight-color:transparent}
/* terapia intensiva */
:root{ --icu:#7A3E9D; --icu-soft:#F2E8F8; }
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){ --icu:#C9A0EC; --icu-soft:#2B1E36; } }
:root[data-theme="dark"]{ --icu:#C9A0EC; --icu-soft:#2B1E36; }
.patcard.icu{ border-left-color:var(--icu); background:var(--icu-soft); }
.minichip.icu{ background:var(--icu); border-color:transparent; color:#fff; }
.ghostsm.icubtn{ color:var(--icu); border-color:var(--icu); }
.ghostsm.icubtn.on{ background:var(--icu); border-color:var(--icu); color:#fff; }
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .minichip.icu,
  :root:not([data-theme="light"]) .ghostsm.icubtn.on{ color:#1a1020; } }
:root[data-theme="dark"] .minichip.icu, :root[data-theme="dark"] .ghostsm.icubtn.on{ color:#1a1020; }
/* colori delle schede scelti a mano: tenui, il testo resta nero e leggibile */
:root{ --crit:#C8641E; --crit-soft:#FDEEDF; --dim:#3A8DBF; --dim-soft:#EAF5FC; }
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --crit:#F2A35E; --crit-soft:#33230F; --dim:#7FC4EA; --dim-soft:#132936; } }
:root[data-theme="dark"]{ --crit:#F2A35E; --crit-soft:#33230F; --dim:#7FC4EA; --dim-soft:#132936; }
.patcard.col-crit{ border-left-color:var(--crit); background:var(--crit-soft); }
.patcard.col-dim{ border-left-color:var(--dim); background:var(--dim-soft); }
.minichip.crit{ background:transparent; border-color:var(--crit); color:var(--crit); }
.minichip.dim{ background:transparent; border-color:var(--dim); color:var(--dim); }
/* il pallino per cambiare colore, direttamente nella lista */
.patcard .pc-side{flex:none; display:flex; flex-direction:column; align-items:center; gap:10px}
.colordot{width:34px; height:34px; margin:-6px -6px 0 0; display:grid; place-items:center;
  border-radius:50%; touch-action:manipulation}
.colordot i{display:block; width:17px; height:17px; border-radius:50%;
  border:1.5px dashed var(--line-strong); background:transparent}
.colordot.c-crit i{border:none; background:var(--crit)}
.colordot.c-dim i{border:none; background:var(--dim)}
.colordot.c-icu i{border:none; background:var(--icu)}
.colordot:active{background:var(--surface-2)}
.colpick{display:flex; flex-direction:column; gap:8px; margin-top:6px}
.colpick button{display:flex; align-items:center; gap:12px; padding:12px 12px; border-radius:9px;
  border:1px solid var(--line); background:var(--surface); text-align:left; font-size:15px}
.colpick button.on{border-color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent)}
.colpick .cpsw{flex:none; width:22px; height:22px; border-radius:50%; border:1.5px dashed var(--line-strong)}
.colpick .cpsw.crit{border:none; background:var(--crit)}
.colpick .cpsw.dim{border:none; background:var(--dim)}
.colpick .cp-t{flex:1; min-width:0}
.colpick .cp-sub{display:block; font-size:12px; color:var(--ink-3); margin-top:1px}
#modebar{height:var(--mb)}
.shell{padding-top:var(--mb)}
.topbar{top:var(--mb)}
.pathead,.pdet-head{top:var(--mb)}
#morList{gap:9px}
.pathead .daynav{flex:1; min-width:0}
.pathead .newbtn{padding:8px 12px; font-size:17px; line-height:1}
@media (max-width:400px){ .pathead .daylabel .daydate .ahead{display:none} }
[hidden]{display:none !important}
/* intestazione e ricerca dei pazienti restano in alto mentre scorri la lista */
.patstick{position:sticky; top:var(--mb); z-index:21; background:var(--bg);
  padding-bottom:10px; border-bottom:1px solid var(--line)}
.patstick .pathead{position:static; border-bottom:none}
.patstick:not(:has(> :not([hidden]))){padding:0; border:none}
.searchwrap{position:relative; flex:1; min-width:0; display:flex}
.searchwrap input{flex:1; min-width:0; padding-right:40px !important}
.sx{position:absolute; right:4px; top:50%; transform:translateY(-50%);
  width:32px; height:32px; border-radius:50%; display:grid; place-items:center;
  color:var(--ink-3); background:var(--surface-2)}
.sx:hover{color:var(--ink)}
/* quattro tasti in alto: sugli schermi stretti si stringono invece di uscire */
.modeseg button{min-width:0}
.modeseg button > span:first-child{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
@media (max-width:400px){
  .modeseg button{font-size:12.5px; padding:7px 4px; gap:4px}
  .patcard .pc-alias{font-size:15px}
  .pdet-alias{font-size:17px}
}
@media (max-width:400px){
  .modeseg{padding:2px; gap:3px}
  .modeseg button{font-size:11.5px; padding:7px 3px; letter-spacing:0}
}
@media (max-width:350px){
  .modeseg button{font-size:10.5px; padding:7px 2px}
}
/* sei sezioni: i tasti restano larghi come prima (un quinto della barra),
   e la barra scorre per arrivare all'ultimo */
.modeseg{--mg:4px; gap:var(--mg); overflow-x:auto; scrollbar-width:none;
  -ms-overflow-style:none; scroll-snap-type:x proximity}
.modeseg::-webkit-scrollbar{display:none}
.modeseg button{flex:0 0 calc((100% - 4 * var(--mg)) / 5); scroll-snap-align:start}
@media (max-width:400px){ .modeseg{--mg:3px} }
/* Medis: la tua scheda dei farmaci, a tutto schermo sotto la barra */
#medShell{padding:0}
#medFrame{position:fixed; top:var(--mb); left:0; right:0; bottom:0; width:100%;
  height:calc(100dvh - var(--mb)); border:0; background:var(--bg); display:block}

/* ================= scenari: tessere come i Medis ================= */
:root{ --c-emo:#B0222B; --c-rit:#C0561B; --c-inf:#0B6B5F; --c-neu:#1D5CA6;
  --c-ren:#5B34B8; --c-met:#8A5200; --c-isc:#A3245E; --c-alt:#5A6B72; }
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){ --c-emo:#FF7A7F; --c-rit:#F29A62;
  --c-inf:#62D0BF; --c-neu:#86B6F2; --c-ren:#BCA2FF; --c-met:#F4B657; --c-isc:#F28AB8; --c-alt:#9FB1B7; } }
:root[data-theme="dark"]{ --c-emo:#FF7A7F; --c-rit:#F29A62; --c-inf:#62D0BF; --c-neu:#86B6F2;
  --c-ren:#BCA2FF; --c-met:#F4B657; --c-isc:#F28AB8; --c-alt:#9FB1B7; }
#scnRoot{padding-bottom:40px}
.scnstick{position:sticky; top:var(--mb); z-index:21; background:var(--bg);
  padding-bottom:10px; border-bottom:1px solid var(--line)}
.scnstick .pathead{position:static; border-bottom:none}
.scntiles{display:grid; grid-template-columns:repeat(auto-fill,minmax(min(150px,100%),1fr));
  gap:8px; margin-top:12px}
.scntile{text-align:left; background:var(--surface); border:1px solid var(--line); border-radius:10px;
  padding:10px 12px; display:flex; flex-direction:column; gap:3px; min-height:92px; position:relative;
  border-left:4px solid var(--line)}
.scntile:hover{border-color:var(--cc)}
.scntile.going{border-left-color:var(--cc); box-shadow:var(--shadow)}
.scntile .k{font-size:10.5px; text-transform:uppercase; letter-spacing:.07em; font-weight:700; color:var(--cc)}
.scntile .t{font-family:"IBM Plex Sans Condensed","IBM Plex Sans",sans-serif; font-weight:600;
  font-size:17px; line-height:1.15}
.scntile .s{font-size:12.5px; color:var(--ink-3); line-height:1.3}
.scntile .pr{margin-top:auto; padding-top:4px; font-family:"IBM Plex Mono",monospace; font-size:11.5px;
  color:var(--cc); font-weight:500}
.scntile.add{border-style:dashed; border-left-width:1px; align-items:center; justify-content:center;
  color:var(--accent); font-family:"IBM Plex Sans Condensed","IBM Plex Sans",sans-serif; font-weight:600;
  font-size:15px; background:transparent}
.scntile.add .plus{font-size:26px; line-height:1}
/* la pagina di uno scenario */
.scnhead .pdet-top{display:flex; align-items:center; gap:6px}
.scnhead .sk{font-size:10.5px; text-transform:uppercase; letter-spacing:.07em; font-weight:700; color:var(--cc)}
.scnhead .st{font-family:"IBM Plex Sans Condensed","IBM Plex Sans",sans-serif; font-weight:600;
  font-size:20px; line-height:1.15}
.scnbar{display:flex; gap:8px; align-items:center; margin-top:8px}
.scnbar .scntag{width:96px; flex:none; padding:8px 10px; border:1px solid var(--line); border-radius:8px;
  background:var(--surface); font-family:"IBM Plex Mono",monospace; font-size:13.5px}
.scnbar .cnt{margin-left:auto; font-family:"IBM Plex Mono",monospace; font-size:12px; color:var(--ink-3)}
.scncall{margin-top:12px; background:var(--alert-soft); color:var(--alert); border-radius:8px;
  padding:8px 11px; font-size:13.5px; line-height:1.4}
.scncall b{font-weight:600}

/* ================= sistemi: il disegno ================= */
:root{ --sysbody:#DCE8EA; }
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){ --sysbody:#20363A; } }
:root[data-theme="dark"]{ --sysbody:#20363A; }
.sysfig{position:relative; max-width:440px; margin:0 auto}
.sysvg{display:block; width:100%; height:auto; cursor:pointer; touch-action:manipulation;
  -webkit-user-select:none; user-select:none}
.sysvg .sb{fill:var(--sysbody); transition:opacity .2s ease}
.sysvg .sbs{stroke:var(--sysbody); fill:none; stroke-linecap:round; stroke-linejoin:round;
  transition:opacity .2s ease}
.sg{color:var(--ink-2); transition:opacity .2s ease}
.sg path,.sg circle,.sg rect,.sg ellipse{fill:none; stroke:currentColor; stroke-width:1.7;
  stroke-linecap:round; stroke-linejoin:round}
.sg .fl{fill:var(--surface); fill-opacity:.9}
.sg .hb{fill:var(--surface); stroke:none}
.sg .tb{stroke-width:3.2}
.sg .thin{stroke-width:1.2; opacity:.7}
.sg.st-ok{color:var(--rail-done)}
.sg.st-watch{color:var(--rail-result)}
.sg.st-bad{color:var(--alert)}
.sg.st-ok .fl,.sg.st-watch .fl,.sg.st-bad .fl{fill:currentColor; fill-opacity:.2}
.sysmini{display:block; flex:none}
.sysmini .sg path,.sysmini .sg circle,.sysmini .sg rect,.sysmini .sg ellipse{
  vector-effect:non-scaling-stroke; stroke-width:1.5}
.sysmini .sg .tb{stroke-width:2.4}
.halo *{fill:var(--accent); fill-opacity:0; stroke:none; transition:fill-opacity .2s ease}
.halo.st-bad *{fill:var(--alert); animation:sysPulse 1.8s ease-in-out infinite}
@keyframes sysPulse{0%,100%{fill-opacity:.04} 50%{fill-opacity:.2}}
.halo.sel *{fill:var(--accent); fill-opacity:.17; animation:none}
.slead line{stroke:var(--line-strong); stroke-width:1}
.slead circle{fill:var(--line-strong)}
.slead{transition:opacity .2s ease}
.slab{transition:opacity .2s ease}
.slab .shit{fill:transparent}
.slab text{font-family:"IBM Plex Sans Condensed","IBM Plex Sans",sans-serif; font-weight:600;
  font-size:13px; letter-spacing:.01em; fill:var(--ink-3)}
.slab.has text{fill:var(--ink)}
.slab.sel text{fill:var(--accent)}
.slab .sdot{fill:var(--surface); stroke:var(--line-strong); stroke-width:1.4}
.slab.st-ok .sdot{fill:var(--rail-done); stroke:var(--rail-done)}
.slab.st-watch .sdot{fill:var(--rail-result); stroke:var(--rail-result)}
.slab.st-bad .sdot{fill:var(--alert); stroke:var(--alert)}
.sysfig.open .sb,.sysfig.open .sbs{opacity:.55}
.sysfig.open .sg:not(.sel):not(.rel),.sysfig.open .slab:not(.sel):not(.rel){opacity:.3}
.sysfig.open .slead:not(.sel):not(.rel){opacity:.18}
.syslinks path{fill:none; stroke:var(--accent); stroke-width:2; stroke-dasharray:5 5;
  stroke-linecap:round; animation:sysDash 1.1s linear infinite}
.syslinks circle{fill:var(--accent)}
@keyframes sysDash{to{stroke-dashoffset:-20}}

<script>
(function(){
"use strict";

/* i caratteri arrivano quando arrivano: l'app si disegna subito, senza aspettarli */
(function(){
  var l = document.getElementById("gfonts");
  if(!l) return;
  function on(){ l.media = "all"; }
  if(l.sheet) on(); else l.addEventListener("load", on);
})();

/* ------------------------------------------------- tasto indietro del telefono
   Non chiude l'app: fa un passo indietro dentro l'app (la foto aperta, il
   foglio aperto, dalla scheda alla lista). Cosi' l'app resta in memoria e si
   riapre subito, come dalla lista delle app aperte.
   Chrome salta le voci della cronologia create senza un tocco: per questo le
   preparo a ogni tocco, fino a tre di scorta. */
/* l'app resta salvata sul telefono: si apre subito anche senza rete. Quando
   ne esce una versione nuova, arriva da sola e te lo dice. */
var avvisoNuova = false;
function registraOffline(){
  if(!("serviceWorker" in navigator) || (location.protocol !== "https:" && location.hostname !== "localhost")) return;
  navigator.serviceWorker.addEventListener("message", function(e){
    if(e.data === "agenda-nuova" && !avvisoNuova){
      avvisoNuova = true;
      showToast(t("updReady"), t("updNow"), function(){ location.reload(); });
    }
  });
  try{ navigator.serviceWorker.startMessages(); }catch(e){}
  navigator.serviceWorker.register("sw.js").catch(function(){});
  /* se nel frattempo e' arrivata una versione nuova, il lavoratore me lo dice */
  navigator.serviceWorker.ready.then(function(){
    if(navigator.serviceWorker.controller) navigator.serviceWorker.controller.postMessage("agenda-ciao");
  }).catch(function(){});
}
var indietroScorta = 0;
function indietroInterno(){
  var v = document.querySelector(".viewer");
  if(v){ var vx = v.querySelector(".vclose"); if(vx) vx.click(); else v.remove(); return; }
  var sc = document.querySelectorAll(".scrim");
  if(sc.length){
    try{ stopDictation(); }catch(e){}
    sc[sc.length - 1].remove();
    return;
  }
  if(mode === "pat" && pview.id && sysAperto){ sysChiudi(); return; }
  if(mode === "pat" && pview.id){ $("patBack").click(); return; }
  if(mode === "col" && cview.id){ $("colBack").click(); return; }
  if(mode === "scn" && sview.id){ scnChiudi(); return; }
}
function armaIndietro(){
  if(!window.history || !history.pushState) return;
  try{ history.replaceState({ agenda:0 }, ""); }catch(e){ return; }
  function prepara(){
    if(indietroScorta >= 3) return;
    try{
      indietroScorta++;
      history.pushState({ agenda:indietroScorta }, "");
    }catch(e){}
  }

function todayStr(){ return dayStr(new Date()); }
function dayStr(d){
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function parseDay(s){ var p = s.split("-"); return new Date(+p[0], +p[1]-1, +p[2]); }
function shiftDay(s, n){ var d = parseDay(s); d.setDate(d.getDate()+n); return dayStr(d); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function load(){
  try{
    var raw = localStorage.getItem(KEY);
    if(raw){
      var o = JSON.parse(raw);
      if(o && Array.isArray(o.items)){
        S.items = o.items;
        if(Array.isArray(o.patients)) S.patients = o.patients;
        if(Array.isArray(o.colleagues)) S.colleagues = o.colleagues;
        if(Array.isArray(o.morals)) S.morals = o.morals;
        if(typeof o.notebook === "string") S.notebook = o.notebook;
        if(o.scenari && typeof o.scenari === "object") S.scenari = o.scenari;
        if(o.settings) S.settings = Object.assign(S.settings, o.settings);
        return true;
      }
    }
  }catch(e){}
  return false;
}

/* ---------------------------------------------------------------- selectors */
function doneDay(it){ return it.done ? dayStr(new Date(it.done)) : null; }
function isToday(){ return view.day === todayStr(); }
/* giorni di distanza da oggi: positivo = futuro, negativo = passato */
function dayGap(s){
  return Math.round((parseDay(s) - parseDay(todayStr())) / 86400000);
}
function isFuture(){ return dayGap(view.day) > 0; }
function gapWords(n){
  if(n === 1) return t("ahead1");
  if(n === -1) return t("back1");
  return (n > 0 ? t("aheadN") : t("backN")).replace("N", String(Math.abs(n)));
}

function itemsFor(rail){
  var d = view.day, today = todayStr(), out;
  if(rail === "done"){
    out = S.items.filter(function(i){ return i.stage === "done" && (doneDay(i) === d || i.day === d); });
    out.sort(function(a,b){ return (b.done||0) - (a.done||0); });
    return out;
  }
  if(d === today){
    out = S.items.filter(function(i){ return i.stage === rail && i.day <= today; });
  }else{
    out = S.items.filter(function(i){ return i.stage === rail && i.day === d; });
  }
  out.sort(function(a,b){
    var af = fired(a) ? 0 : 1, bf = fired(b) ? 0 : 1;
    if(af !== bf) return af - bf;
    /* le cose senza fretta stanno sempre in fondo, qualunque altra cosa succeda */
    var aw = a.wish ? 1 : 0, bw = b.wish ? 1 : 0;
    if(aw !== bw) return aw - bw;
    var au = a.urgent ? 0 : 1, bu = b.urgent ? 0 : 1;
    if(au !== bu) return au - bu;
    var aa = a.alarm || Infinity, ba = b.alarm || Infinity;
    if(aa !== ba) return aa - ba;
    return (a.created||0) - (b.created||0);
  });
  return out;
}
function fired(i){ return !!(i.alarm && i.alarmFired && i.stage !== "done"); }
function firedItems(){ return S.items.filter(fired); }

/* ---------------------------------------------------------------- format */
function fmtTime(ts){
  var d = new Date(ts);
  return String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
}
function fmtShortDay(s){
  return parseDay(s).toLocaleDateString(t("locale"), { day:"numeric", month:"short" });
}
function fmtOffset(min){
  if(min < 60) return min + " " + t("minutes");
  var h = min/60;
  return (h % 1 === 0 ? h : h.toFixed(1)) + " " + t("hours");
}

function paintDayLabel(nomeEl, dataEl, oggiBtn){
  var d = parseDay(view.day);
  nomeEl.textContent = d.toLocaleDateString(t("locale"), { weekday:"long" });
  dataEl.textContent = "";
  dataEl.append(document.createTextNode(
    d.toLocaleDateString(t("locale"), { day:"2-digit", month:"short", year:"numeric" })));
  var gap = dayGap(view.day);
  if(gap !== 0){
    var sp = document.createElement("span");
    sp.className = gap > 0 ? "ahead" : "";
    sp.textContent = "  ·  " + gapWords(gap);
    dataEl.appendChild(sp);
  }
  if(oggiBtn){ oggiBtn.hidden = isToday(); oggiBtn.textContent = t("today"); }
}

function renderChrome(){
  paintDayLabel($("dayName"), $("dayDate"), $("todayBtn"));
  $("nextDay").disabled = false;

  var counts = { todo:itemsFor("todo").length, result:itemsFor("result").length, done:itemsFor("done").length };
  var names = { todo:t("rTodo"), result:t("rResult"), done:t("rDone") };
  Array.prototype.forEach.call(document.querySelectorAll(".rail-tab"), function(b){
    var r = b.dataset.rail;
    b.classList.toggle("is-active", r === view.rail);
    b.querySelector(".rail-name").textContent = names[r];
    b.querySelector(".rail-count").textContent = counts[r];
    var old = b.querySelector(".dot"); if(old) old.remove();
    var hasFired = itemsFor(r).some(fired);
    if(hasFired && r !== view.rail){
      var dot = document.createElement("span"); dot.className = "dot"; b.appendChild(dot);
    }
  });
  $("railHint").textContent = (view.rail === "todo" && isFuture()) ? t("hFuture")
    : view.rail === "todo" ? t("hTodo") : view.rail === "result" ? t("hResult") : t("hDone");

  if(typeof composePick !== "undefined" && composePick) composePick.set(view.day);
  $("composeText").placeholder = isFuture()
    ? t("composeFuture") + parseDay(view.day).toLocaleDateString(t("locale"), { day:"numeric", month:"long" }) + "…"
    : t("composePh");
  $("composeTag").placeholder = t("tagPh");
  $("addBtn").textContent = t("add");
  $("settingsBtn").setAttribute("aria-label", t("settings"));

  var f = firedItems();
  bannerEl.hidden = f.length === 0;
  if(f.length){
    bannerText.innerHTML = "<b>" + f.length + "</b> " + (f.length === 1 ? t("bannerOne") : t("bannerMany"));
    $("bannerGo").textContent = t("go");
  }
  updateBadge(f.length);
}

function rowNode(it, opts){
  opts = opts || {};
  var wrap = document.createElement("div");
  wrap.className = "swipe";
  var behind = document.createElement("div");
  behind.className = "swipe-behind";
  behind.appendChild(svgIcon("bell", 15, 1.9));

  wrap.appendChild(behind);

  var row = document.createElement("div");
  row.className = "item stage-" + it.stage + (it.urgent ? " is-urgent" : "")
    + (it.wish ? " is-wish" : "") + (fired(it) ? " is-firing" : "");
  row.dataset.id = it.id;

  /* checkbox */
  var cb = document.createElement("button");
  cb.className = "check" + (it.stage === "done" ? " checked" : "");
  cb.appendChild(svgIcon("check", 16, 2.4));
  cb.setAttribute("aria-label", "ok");
  if(it.stage === "todo"){
    cb.onclick = function(){ toResult(it); };
  }else if(it.stage === "result"){
    cb.onclick = function(){ focusComment(it.id); };
  }else{
    cb.onclick = function(){ reopen(it); };
  }
  row.appendChild(cb);

  /* body */
  var body = document.createElement("div");
  body.className = "body";
  var txt = document.createElement("div");
  txt.className = "txt";
  txt.textContent = opts.togli ? togliNome(it.text, opts.togli) : it.text;
  txt.title = t("editHint");
  txt.addEventListener("dblclick", function(e){ e.preventDefault(); startEdit(it, txt); });
  attachLongPress(txt, function(){ startEdit(it, txt); });
  body.appendChild(txt);

  var meta = document.createElement("div");
  meta.className = "meta";
  if(!opts.senzaChi) chipDiChi(it).forEach(function(c){ meta.appendChild(c); });
  if(it.urgent && it.stage !== "done"){ meta.appendChild(chip("bang", "!")); }
  if(it.wish && it.stage !== "done"){
    /* solo il cuore: la scritta la sai gia' */
    var wc = document.createElement("span"); wc.className = "wishchip";
    wc.appendChild(svgIcon("heart", 13, 2));
    wc.title = t("wish");
    wc.setAttribute("aria-label", t("wish"));
    meta.appendChild(wc);
  }
  if(it.day !== view.day){
    meta.appendChild(chip("origin mono", t("from") + " " + fmtShortDay(it.day)));
  }
  if(it.demo){ meta.appendChild(chip("demo-chip", t("demoChip"))); }
  if(it.alarm && it.stage !== "done"){
    var ac = document.createElement("span");
    ac.className = "alarmchip" + (fired(it) ? " late" : "");
    ac.appendChild(svgIcon("clock", 13, 1.9));
    ac.appendChild(document.createTextNode(fmtTime(it.alarm) + (fired(it) ? " · " + t("overdue") : "")));
    if(fired(it)){
      var sb = document.createElement("button");
      sb.className = "seenbtn"; sb.textContent = t("seen");
      sb.onclick = function(e){ e.stopPropagation(); clearAlarm(it); };
      ac.appendChild(sb);
    }
    meta.appendChild(ac);
  }
  if(it.stage === "done" && it.done){
    meta.appendChild(chip("done-time mono", "✓ " + fmtTime(it.done)));
  }
  if(meta.childNodes.length) body.appendChild(meta);

  if(it.stage === "result"){ body.appendChild(editorNode(it)); }
  if(it.stage === "done" && it.comment){
    var c = document.createElement("div");
    c.className = "comment-read";
    c.textContent = it.comment;
    body.appendChild(c);
  }
  if(it.stage === "done" && hasPhotos(it)){
    body.appendChild(photoRow(it, null, { add:false, del:false }));
  }
  row.appendChild(body);

  /* right actions */
  var acts = document.createElement("div");
  acts.className = "rowacts";
  if(it.stage !== "done"){
    var bell = document.createElement("button");
    bell.className = "iconbtn"; bell.appendChild(svgIcon("bell", 17));
    bell.setAttribute("aria-label", t("alarm"));
    bell.onclick = function(){ openAlarmSheet(it); };
    acts.appendChild(bell);
  }
  var del = document.createElement("button");
  del.className = "iconbtn"; del.appendChild(svgIcon("trash", 17));
  del.setAttribute("aria-label", t("del"));
  del.onclick = function(){ removeItem(it); };
  acts.appendChild(del);
  row.appendChild(acts);

  if(it.stage !== "done") attachSwipe(row, it);
  wrap.appendChild(row);
  return wrap;
}

/* Tenere premuto il testo apre la modifica, come il doppio tocco. */
function attachLongPress(el, fn){
  var timer = null, sx = 0, sy = 0;
  function cancel(){ clearTimeout(timer); timer = null; }
  el.addEventListener("pointerdown", function(e){
    sx = e.clientX; sy = e.clientY;
    cancel();
    timer = setTimeout(function(){ timer = null; fn(); }, 480);
  });
  el.addEventListener("pointermove", function(e){
    if(timer && (Math.abs(e.clientX - sx) > 8 || Math.abs(e.clientY - sy) > 8)) cancel();
  });
  el.addEventListener("pointerup", cancel);
  el.addEventListener("pointercancel", cancel);
  el.addEventListener("contextmenu", function(e){ e.preventDefault(); });
}

function startEdit(it, txtEl){
  if(editingId) return;
  editingId = it.id;

  var box = document.createElement("div");
  box.className = "edit-box";

  var ta = document.createElement("textarea");
  ta.className = "edit-text"; ta.id = "ed-" + it.id; ta.value = it.text;
  ta.setAttribute("enterkeyhint", "enter");

  var row = document.createElement("div"); row.className = "edit-row";
  var tag = document.createElement("input");
  tag.className = "taginput"; tag.id = "edtag-" + it.id;
  tag.value = it.tag || ""; tag.placeholder = t("tagPh"); tag.autocomplete = "off";
  /* su un compito di un paziente o di un collega l'etichetta la decide la scheda */
  var suoDiQualcuno = (it.pid && patById(it.pid)) || (it.cid && colById(it.cid));
  if(!suoDiQualcuno) row.appendChild(tag);

  /* se il compito e' agganciato a un paziente o a un collega, qui si vede e si stacca */
  var legato = (it.pid && patById(it.pid)) || (it.cid && colById(it.cid));
  if(legato){
    var lc = document.createElement("button");
    lc.className = "unlink";
    lc.appendChild(document.createTextNode(legato.alias || legato.name || ""));
    var lx = document.createElement("span"); lx.className = "ux"; lx.textContent = "×";
    lc.appendChild(lx);
    lc.title = t("unlinkHint");
    lc.onclick = function(){

    if(!it.pid && !it.cid && !it.slegato){
      var chi = trovaPaziente(it.text);
      if(chi) it.pid = chi.id;
    }

    it.urgent = segni.urgente();
    it.wish = segni.senzaFretta();
    editingId = null; save(); render(); showToast(t("edited"));
  }
  ta.addEventListener("keydown", function(e){
    if(e.key === "Enter" && (e.ctrlKey || e.metaKey)){ e.preventDefault(); commit(); }
    if(e.key === "Escape"){ e.preventDefault(); cancel(); }
  });

  txtEl.parentNode.replaceChild(box, txtEl);
  var metaEl = box.parentNode.querySelector(".meta");   /* stanza e "!" sono già nei campi qui sopra */
  if(metaEl) metaEl.hidden = true;
