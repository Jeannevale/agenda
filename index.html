/* --------------------------------------------------------------- quaderno
   Il foglio su cui si scrive e si vede subito come viene: il tasto "Titolo"
   rende grande e in grassetto la riga dove sta il cursore, senza passare da
   nessuna anteprima.
   Sotto resta salvato testo semplice (una riga per riga, "# " davanti ai
   titoli): così il backup resta leggibile e non entra mai HTML nell'app.
   Lo usa il braccio Note e lo usano le sezioni Fachlich e Personale di ogni
   collega: stesso foglio, salvato in posti diversi. */

/* ogni riga e' un blocco; un blocco vuoto ha un <br> dentro per avere altezza */
function setBlockText(blk, s){
  blk.textContent = "";
  if(s) blk.appendChild(document.createTextNode(s));
  else blk.appendChild(document.createElement("br"));
}
function quadernoBlocks(ed){
  return Array.prototype.filter.call(ed.children, function(n){ return n.nodeType === 1; });
}
/* il blocco in cui si trova il cursore, dentro questo foglio */
function quadernoCurrent(ed){
  var sel = window.getSelection();
  if(!sel || !sel.rangeCount) return null;
  var n = sel.getRangeAt(0).startContainer;
  while(n && n.parentNode !== ed) n = n.parentNode;
  return (n && n.nodeType === 1) ? n : null;
}
function caretOffset(blk){
  var sel = window.getSelection();
  if(!sel || !sel.rangeCount) return blk.textContent.length;
  var r = sel.getRangeAt(0).cloneRange();
  var pre = document.createRange();
  pre.selectNodeContents(blk);
  try{ pre.setEnd(r.startContainer, r.startOffset); }catch(e){ return blk.textContent.length; }
  return pre.toString().length;
}
function caretTo(blk, dove){
  var r = document.createRange();
  r.selectNodeContents(blk);
  r.collapse(dove !== "fine");
  var sel = window.getSelection();
  sel.removeAllRanges(); sel.addRange(r);
}

/* il browser a volte lascia testo nudo o <br> sciolti: qui si rimette in righe */
function quadernoNormalizza(ed){
  Array.prototype.slice.call(ed.childNodes).forEach(function(n){
    if(n.nodeType === 3 && n.textContent.trim()){
      var d = document.createElement("div");
      ed.insertBefore(d, n);
      d.appendChild(n);
    } else if(n.nodeType === 3 || (n.nodeType === 1 && n.tagName === "BR")){
      if(n.nodeType === 3 && !n.textContent.trim()) ed.removeChild(n);
    }
  });
  if(!ed.children.length){
    var vuoto = document.createElement("div");
    setBlockText(vuoto, "");
    ed.appendChild(vuoto);
  }
}
/* dal foglio al testo semplice */
function quadernoTesto(ed){
  quadernoNormalizza(ed);
  return quadernoBlocks(ed).map(function(n){
    var testo = n.textContent.replace(/ /g, " ");
    return n.classList.contains("md-h") ? ("# " + testo).replace(/\s+$/, "") : testo;
  }).join("\n");
}
/* dal testo semplice al foglio */
function quadernoRiempi(ed, testo, placeholder){
  if(placeholder !== undefined) ed._ph = placeholder;
  ed.textContent = "";
  String(testo || "").split("\n").forEach(function(r){
    var d = document.createElement("div");
    if(/^#{1,3}\s/.test(r)){ d.className = "md-h"; setBlockText(d, r.replace(/^#{1,3}\s/, "")); }
    else setBlockText(d, r);
    ed.appendChild(d);
  });
  quadernoNormalizza(ed);
  quadernoRighe(ed);
}
/* le righe che cominciano con "- " prendono il rientro da elenco */
function quadernoRighe(ed){
  var vuoto = true;
  quadernoBlocks(ed).forEach(function(n){
    n.classList.toggle("nb-li", /^[-•]\s/.test(n.textContent));
    if(n.textContent.trim()) vuoto = false;
  });
  ed.classList.toggle("vuoto", vuoto);
  var primo = ed.firstElementChild;
  if(primo && ed._ph) primo.setAttribute("data-ph", ed._ph);
}

/* il tasto Titolo: la riga del cursore diventa grande, o torna normale */
function quadernoTitolo(ed){
  var blk = quadernoCurrent(ed) || ed.lastElementChild;
  if(!blk) return;
  blk.classList.toggle("md-h");
  caretTo(blk, "fine");
  if(ed._salva) ed._salva();
  ed.focus();
}
/* la dettatura scrive in fondo alla riga dove sta il cursore */
function quadernoDetta(ed, btn){
  var blk = quadernoCurrent(ed) || ed.lastElementChild;
  if(!blk) return;
  caretTo(blk, "fine");
  dictateInto(blk, btn, function(){ if(ed._salva) ed._salva(); cursoreInVistaPresto(ed); });
}

/* La riga dove scrivi deve restare sopra la tastiera. Su Android la tastiera
   copre la pagina senza accorciarla, e quando vado a capo a mano il browser
   non scorre da solo: qui misuro dove sta il cursore e quanto spazio lascia
   la tastiera, e faccio scorrere la pagina quel tanto che serve. */
function altezzaTastiera(){
  var vv = window.visualViewport;
  if(!vv) return 0;
  return Math.max(0, Math.round(window.innerHeight - vv.height - vv.offsetTop));
}
/* sotto il foglio aggiungo tanto spazio quanto la tastiera: senza, l'ultima
   riga non potrebbe mai salire sopra la tastiera perche' la pagina finisce */
function spazioTastiera(){
  var kb = document.body.classList.contains("kb-scrive") ? altezzaTastiera() : 0;
  document.documentElement.style.setProperty("--kb", kb + "px");
}
function rettCursore(ed){
  var sel = window.getSelection();
  if(!sel || !sel.rangeCount || !ed.contains(sel.anchorNode)) return null;
  var r = sel.getRangeAt(0).cloneRange();
  r.collapse(false);
  var rr = r.getClientRects();
  var rect = rr.length ? rr[rr.length - 1] : null;
  /* riga vuota: il cursore non ha misure, prendo la riga intera */
  if(!rect || (!rect.height && !rect.top)){
    var n = r.endContainer;
    if(n.nodeType === 3) n = n.parentNode;
    if(n === ed) n = ed.childNodes[r.endOffset] || ed.childNodes[r.endOffset - 1] || ed;
    if(n && n.nodeType !== 1) n = n.parentNode;
    rect = n ? n.getBoundingClientRect() : null;
  }
  return rect;
}
function cursoreInVista(ed){
  var rect = rettCursore(ed);
  if(!rect) return;
  var vv = window.visualViewport;
  var cimaVista = vv ? vv.offsetTop : 0;
  var fondoVista = vv ? vv.offsetTop + vv.height : window.innerHeight;
  var margine = 72;                         /* circa tre righe libere sotto il cursore */
  var testa = ed._testa && ed._testa();
  var cima = testa ? Math.max(cimaVista, testa.getBoundingClientRect().bottom) + 8
    : cimaVista + (parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--mb")) || 0) + 64;
  if(rect.bottom > fondoVista - margine){
    window.scrollBy(0, Math.round(rect.bottom - (fondoVista - margine)));
  } else if(rect.top < cima){
    window.scrollBy(0, Math.round(rect.top - cima));
  }
}
function cursoreInVistaPresto(ed){
  spazioTastiera();
  requestAnimationFrame(function(){ cursoreInVista(ed); });
}
(function(){
  var vv = window.visualViewport;
  if(!vv) return;
  var attesa = null;
  function quandoCambia(){
    spazioTastiera();
    var a = document.activeElement;
    if(!a || !a._collegato) return;
    clearTimeout(attesa);
    attesa = setTimeout(function(){ cursoreInVista(a); }, 60);
  }
  vv.addEventListener("resize", quandoCambia);
})();

/* Attacca il comportamento al foglio, una volta sola. onCambio riceve il testo
   già serializzato: chi chiama decide dove salvarlo. */
function quadernoCollega(ed, onCambio, placeholder){
  if(placeholder !== undefined) ed._ph = placeholder;
  ed._salva = function(){
    var testo = quadernoTesto(ed);
    quadernoRighe(ed);
    onCambio(testo);
  };
  if(ed._collegato) return;
  ed._collegato = true;

  ed.addEventListener("input", function(){ ed._salva(); cursoreInVistaPresto(ed); });
  ed.addEventListener("focus", function(){
    document.body.classList.add("kb-scrive");
    cursoreInVistaPresto(ed);
    /* la tastiera ci mette un attimo ad aprirsi */
    setTimeout(function(){ cursoreInVistaPresto(ed); }, 350);
  });
  ed.addEventListener("blur", function(){
    document.body.classList.remove("kb-scrive");
    spazioTastiera();
  });

  /* Invio: spezzo la riga a mano, così la riga nuova non eredita il titolo */
  ed.addEventListener("keydown", function(e){
    if(e.key !== "Enter" || e.shiftKey) return;
    var blk = quadernoCurrent(ed);
    if(!blk) return;
    e.preventDefault();
    var testo = blk.textContent, off = caretOffset(blk);
    setBlockText(blk, testo.slice(0, off));
    var nuovo = document.createElement("div");
    setBlockText(nuovo, testo.slice(off));
    ed.insertBefore(nuovo, blk.nextSibling);
    caretTo(nuovo, "inizio");
    ed._salva();
    cursoreInVistaPresto(ed);
    /* la riga qui sopra e' finita: chi ci tiene puo' farci qualcosa */
    ed.dispatchEvent(new CustomEvent("quaderno-acapo", { detail:blk }));
  });

  /* incollare porta dentro solo il testo, mai la formattazione di fuori */
  ed.addEventListener("paste", function(e){
    e.preventDefault();
    var testo = (e.clipboardData || window.clipboardData).getData("text/plain") || "";
    var righe = testo.split(/\r?\n/);
    var blk = quadernoCurrent(ed);
    if(!blk){ quadernoNormalizza(ed); blk = ed.lastElementChild; caretTo(blk, "fine"); }
    var resto = blk.textContent, off = caretOffset(blk);
    setBlockText(blk, resto.slice(0, off) + righe[0]);
    var dopo = blk;
    for(var i = 1; i < righe.length; i++){
      var d = document.createElement("div");
      setBlockText(d, righe[i]);
      ed.insertBefore(d, dopo.nextSibling);
      dopo = d;
    }
    setBlockText(dopo, dopo.textContent + resto.slice(off));
    caretTo(dopo, "fine");
    ed._salva();
    cursoreInVistaPresto(ed);
  });
}

/* ------------------------------------------------------------- braccio Note
   Un quaderno solo, per le cose imparate. */
function noteEd(){ return $("noteArea"); }

var noteTimer = null;
function segnalaSalvato(el){
  var hint = el || $("noteSaved");
  if(!hint) return;
  hint.textContent = t("noteSavedHint");
  clearTimeout(noteTimer);
  noteTimer = setTimeout(function(){ hint.textContent = ""; }, 1400);

/* Anche qui valgono i due segni: *così* fa un compito, "M:" fa una morale.
   Ma qui si scrive di continuo, quindi non si converte a ogni lettera: si
   aspetta che la riga sia finita — quando vai a capo, o quando esci dal foglio.
   Il segno sparisce e il testo resta com'e': nel quaderno non si evidenzia
   niente, perche' e' un foglio libero e dentro non entra mai HTML. */
function convertiRiga(testo){
  var busta = { testo:testo, tasks:[], morals:[] };
  var nT = convertiMarcati(busta, "testo", "tasks", null, addFreeTodo);
  var nM = convertiMorali(busta, "testo", "morals", {});
  return { testo:busta.testo, compiti:nT, morali:nM };
}
/* la riga appena chiusa con Invio */
function convertiBlocco(blk){
  var r = convertiRiga(blk.textContent);
  if(!r.compiti && !r.morali) return false;
  setBlockText(blk, r.testo);
  avvisaTutto({ compiti:r.compiti, morali:r.morali });
  return true;
}
/* tutto il quaderno, quando ne esci */
function convertiQuaderno(){
  var ed = noteEd();
  if(!ed || $("noteShell").hidden) return;
  var righe = String(S.notebook || "").split("\n");
  var tot = { compiti:0, morali:0 }, cambiato = false;
  var nuove = righe.map(function(riga){
    var cap = /^#{1,3}\s/.exec(riga);
    var corpo = cap ? riga.slice(cap[0].length) : riga;
    var r = convertiRiga(corpo);
    if(r.compiti || r.morali){
      cambiato = true;
      tot.compiti += r.compiti; tot.morali += r.morali;
    }
    return cap ? cap[0] + r.testo : r.testo;
  });
  if(!cambiato) return;
  S.notebook = nuove.join("\n");
  save();
  quadernoRiempi(ed, S.notebook, t("notePlaceholder"));
  render();
  avvisaTutto(tot);
}

/* ------------------------------------------------------ ricerca nelle note
   Cerca in tutte le righe senza badare a maiuscole e accenti ("cefalo"
   trova anche "Cefalosporine"). Le parole trovate si colorano senza toccare
   il testo: il colore non entra mai nel salvataggio. */
var notaCerca = { q:"", trovati:[], i:0 };
/* una lettera alla volta, cosi' le posizioni restano le stesse del testo */
function piega(s){
  var out = "";
  for(var k = 0; k < s.length; k++){
    var c = s[k];
    if(c === "\u00a0"){ out += " "; continue; }
    var b = c.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
    out += b ? b[0] : c;
  }
  return out;
}
/* tutti i punti del foglio dove compare la parola cercata */
function notaTrova(ed, q){
  var ago = piega(q.trim());
  var trovati = [];
  if(!ago) return trovati;
  quadernoBlocks(ed).forEach(function(blk){
    var pezzi = [], testo = "";
    var w = document.createTreeWalker(blk, NodeFilter.SHOW_TEXT);
    for(var n = w.nextNode(); n; n = w.nextNode()){
      pezzi.push({ n:n, da:testo.length });
      testo += n.nodeValue;
    }
    var pagliaio = piega(testo), dove = pagliaio.indexOf(ago);
    function punto(pos, fine){
      for(var j = pezzi.length - 1; j >= 0; j--){
        if(pos > pezzi[j].da || (!fine && pos === pezzi[j].da)) return { n:pezzi[j].n, o:pos - pezzi[j].da };
      }
      return { n:pezzi[0].n, o:0 };
    }
    while(dove !== -1){
      var a = punto(dove, false), b = punto(dove + ago.length, true);
      var r = document.createRange();
      r.setStart(a.n, a.o); r.setEnd(b.n, b.o);
      trovati.push(r);
      dove = pagliaio.indexOf(ago, dove + ago.length);
    }
  });
  return trovati;
}
function notaColora(){
  if(!window.CSS || !CSS.highlights || typeof Highlight === "undefined") return;
  CSS.highlights.delete("nota-trovato");
  CSS.highlights.delete("nota-attuale");
  var tutti = notaCerca.trovati;
  if(!tutti.length) return;
  CSS.highlights.set("nota-trovato", new Highlight(...tutti));
  CSS.highlights.set("nota-attuale", new Highlight(tutti[notaCerca.i]));
}
/* porta la parola trovata un po' sotto la ricerca, sopra la tastiera */
function notaMostra(){
  var r = notaCerca.trovati[notaCerca.i];
  if(!r) return;
  var rect = r.getBoundingClientRect();
  var vv = window.visualViewport;
  var fondo = vv ? vv.offsetTop + vv.height : window.innerHeight;
  var cima = $("noteTop").getBoundingClientRect().bottom;
  var meta = cima + Math.max(40, (fondo - cima) / 3);
  if(rect.top < cima + 8 || rect.bottom > fondo - 16) window.scrollBy(0, Math.round(rect.top - meta));
}
function notaContatore(){
  var q = notaCerca.q.trim(), n = notaCerca.trovati.length;
  var cnt = $("noteFindN");
  cnt.hidden = !q;
  cnt.textContent = n ? (notaCerca.i + 1) + "/" + n : "0";
  cnt.classList.toggle("zero", !!q && !n);
  $("noteFindUp").hidden = $("noteFindDown").hidden = n < 2;
  $("noteFindX").hidden = !notaCerca.q;
}
/* ricalcola; salta=true porta alla prima parola trovata */
function notaCercaAggiorna(salta){
  var ed = noteEd();
  if(!ed) return;
  var prima = notaCerca.trovati[notaCerca.i];
  notaCerca.trovati = notaTrova(ed, notaCerca.q);
  if(salta || notaCerca.i >= notaCerca.trovati.length) notaCerca.i = 0;
  notaContatore();
  notaColora();
  if(salta) notaMostra();
}
function notaPasso(d){
  var n = notaCerca.trovati.length;
  if(!n) return;
  notaCerca.i = (notaCerca.i + d + n) % n;
  notaContatore(); notaColora(); notaMostra();
}
function initNotaCerca(){
  var inp = $("noteFind");
  $("noteFindX").appendChild(svgIcon("x", 16, 2));
  inp.addEventListener("input", function(){
    notaCerca.q = inp.value;
    notaCercaAggiorna(true);
  });
  inp.addEventListener("keydown", function(e){
    if(e.key === "Enter"){ e.preventDefault(); notaPasso(e.shiftKey ? -1 : 1); }
    if(e.key === "Escape"){ inp.value = ""; notaCerca.q = ""; notaCercaAggiorna(false); }
  });
  inp.addEventListener("focus", function(){ document.body.classList.add("kb-scrive"); spazioTastiera(); });
  inp.addEventListener("blur", function(){ document.body.classList.remove("kb-scrive"); spazioTastiera(); });
  $("noteFindX").onclick = function(){
    inp.value = ""; notaCerca.q = "";
    notaCercaAggiorna(false);
    inp.focus();
  };
  $("noteFindUp").appendChild(svgIcon("su", 18, 2));
  $("noteFindDown").appendChild(svgIcon("giu", 18, 2));
  /* toccare frecce e X non deve chiudere la tastiera della ricerca */
  ["noteFindUp", "noteFindDown", "noteFindX"].forEach(function(id){
    $(id).addEventListener("pointerdown", function(e){ e.preventDefault(); });
  });
  $("noteFindUp").onclick = function(){ notaPasso(-1); };
  $("noteFindDown").onclick = function(){ notaPasso(1); };
  /* scrivendo nel foglio la ricerca resta aggiornata */
  noteEd().addEventListener("input", function(){ if(notaCerca.q) notaCercaAggiorna(false); });
}

function initNote(){
  var ed = noteEd();
  ed._testa = function(){ return $("noteTop"); };
  initNotaCerca();
  $("modeNote").onclick = function(){ setMode("note"); };
  $("noteH").onclick = function(){ quadernoTitolo(ed); };
  $("noteMic").appendChild(svgIcon("mic", 15));
  $("noteMic").onclick = function(){ quadernoDetta(ed, $("noteMic")); };
  quadernoCollega(ed, function(testo){
    S.notebook = testo; save(); segnalaSalvato();
  }, t("notePlaceholder"));
  ed.addEventListener("blur", function(){ setTimeout(convertiQuaderno, 60); });
  ed.addEventListener("quaderno-acapo", function(e){
    if(e.detail && convertiBlocco(e.detail)){
      S.notebook = quadernoTesto(ed); save(); render();
    }
  });
}

/* ------------------------------------------------------- foto nei commenti
   Ovunque ci sia un commento si puo' attaccare una foto: scattata sul momento
   oppure presa dalla galleria. Passa sempre dalla schermata per coprire i dati,
   e nell'app entra solo la versione coperta. */
function pickImage(fromCamera, cb){
  var inp = document.createElement("input");
  inp.type = "file";
  inp.accept = "image/*";
  if(fromCamera) inp.setAttribute("capture", "environment");
  inp.onchange = function(){
    var f = inp.files && inp.files[0];
    if(f) cb(f);
  };
  inp.click();
}
function openPhotoSourceSheet(cb){
  openSheet(function(sheet, close){
    var h = document.createElement("h2"); h.textContent = t("photoAdd");
    sheet.appendChild(h);
    [["camera", t("photoShoot"), t("photoShootSub"), true],
     ["image", t("photoPick"), t("photoPickSub"), false]].forEach(function(o){
      var b = document.createElement("button"); b.className = "srcbtn";
      var ic = document.createElement("span"); ic.className = "si";
      ic.appendChild(svgIcon(o[0], 20));
      var tx = document.createElement("span"); tx.style.minWidth = "0";
      var t1 = document.createElement("span"); t1.style.display = "block"; t1.textContent = o[1];
      var t2 = document.createElement("span");
      t2.style.cssText = "display:block; font-size:12.5px; color:var(--ink-3); margin-top:2px";
      t2.textContent = o[2];
      tx.appendChild(t1); tx.appendChild(t2);

    acts.appendChild(cn); sheet.appendChild(acts);
  });
}
function addPhotoTo(owner, after){
  openPhotoSourceSheet(function(f){
    openRedactSheet(f, function(key, name, size){
      owner.photos = owner.photos || [];
      owner.photos.push({ id:key, name:name, size:size, ts:Date.now() });
      save();
      if(after) after();
    });
  });
}
/* Un indirizzo per ogni immagine, riusato a ogni ridisegno: senza questa cache
   ogni render creerebbe un nuovo URL e la memoria crescerebbe a vuoto. */
var PHOTO_URLS = {};
function photoURL(id, cb){
  if(PHOTO_URLS[id]) return cb(PHOTO_URLS[id]);
  getBlob(id, function(b){
    if(!b) return cb(null);
    try{ PHOTO_URLS[id] = URL.createObjectURL(b); }catch(e){ return cb(null); }
    cb(PHOTO_URLS[id]);
  });
}
function dropPhotoURL(id){
  if(PHOTO_URLS[id]){ try{ URL.revokeObjectURL(PHOTO_URLS[id]); }catch(e){} delete PHOTO_URLS[id]; }
}

/* La foto a schermo intero. Tocco sull'immagine: ingrandisce e si scorre.
   Tocco fuori, tasto × o Esc: si chiude. */
function openPhoto(id, name){
  photoURL(id, function(u){
    if(!u) return;
    var v = document.createElement("div"); v.className = "viewer";
    var im = document.createElement("img");
    im.src = u; im.alt = name || "";
    im.onclick = function(e){ e.stopPropagation(); v.classList.toggle("zoom"); };
    v.appendChild(im);

    var x = document.createElement("button"); x.className = "vclose";
    x.setAttribute("aria-label", t("close"));
    x.appendChild(svgIcon("x", 19, 2));
    x.onclick = function(e){ e.stopPropagation(); chiudi(); };
    v.appendChild(x);

    if(name){
      var nm = document.createElement("div"); nm.className = "vname"; nm.textContent = name;
      v.appendChild(nm);
    }
    v.onclick = chiudi;
    document.body.appendChild(v);
    document.addEventListener("keydown", esc);

    function chiudi(){ v.remove(); document.removeEventListener("keydown", esc); }
    function esc(e){ if(e.key === "Escape") chiudi(); }
  });
}
/* la striscia di miniature; opts.add:false quando il tasto fotocamera sta gia' altrove,
   opts.del:false per la sola lettura */
function photoRow(owner, after, opts){
  opts = opts || {};
  var readOnly = opts.del === false;
  var row = document.createElement("div"); row.className = "photorow";
  (owner.photos || []).forEach(function(ph){
    var th = document.createElement("div"); th.className = "photothumb";
    var im = document.createElement("img");
    im.alt = "";
    photoURL(ph.id, function(u){ if(u) im.src = u; });
    im.onclick = function(){ openPhoto(ph.id, ph.name); };
    th.appendChild(im);
    if(!readOnly){
      var x = document.createElement("button"); x.className = "px"; x.textContent = "×";
      x.setAttribute("aria-label", t("del"));
      x.onclick = function(e){
        e.stopPropagation();
        dropPhotoURL(ph.id); delBlob(ph.id);
        owner.photos = (owner.photos || []).filter(function(z){ return z.id !== ph.id; });
        save(); if(after) after();
      };
      th.appendChild(x);
    }
    row.appendChild(th);
  });
  if(opts.add !== false){
    var add = document.createElement("button"); add.className = "photoadd";
    add.setAttribute("aria-label", t("photoAdd"));
    add.title = t("photoAdd");
    add.appendChild(svgIcon("camera", 19));
    add.onclick = function(){ addPhotoTo(owner, after); };
    row.appendChild(add);
  }
  return row;
}
function hasPhotos(o){ return !!(o && o.photos && o.photos.length); }

/* ------------------------------------------------------------- checklist
   I modelli stanno nell'app (S.settings.checklists), non nella scheda del
   paziente. Quando ne aggiungi uno a un paziente ne viene fatta una copia:
   se poi modifichi il modello, le checklist gia' aggiunte restano com'erano. */
function checkTpls(){ return S.settings.checklists || (S.settings.checklists = []); }

function secCheck(host, p){
  var c = secCard(host, "checkTitle", t("myTpl"), function(){ openTplsSheet(); });
  var list = p.checklists || [];
  if(!list.length){
    var e = document.createElement("p"); e.className = "emptysm";
    e.textContent = checkTpls().length ? t("checkEmpty") : t("checkNoTpl");
    c.appendChild(e);
  }
  list.forEach(function(cl){ c.appendChild(checkCard(p, cl)); });

  var acts = document.createElement("div"); acts.className = "btnrow";
  var mb = document.createElement("button"); mb.className = "btn btn-ghost";
  mb.textContent = t("checkAdd"); mb.onclick = function(){ openPickTplSheet(p); };
  acts.appendChild(mb);
  c.appendChild(acts);
}

function checkCard(p, cl){
  var box = document.createElement("div"); box.className = "chkbox";

  var head = document.createElement("div"); head.className = "chkhead";
  var nm = document.createElement("div"); nm.className = "chkname"; nm.textContent = cl.name;
  var done = cl.items.filter(function(i){ return i.done; }).length;
  var cnt = document.createElement("span");
  cnt.className = "chkcount" + (cl.items.length && done === cl.items.length ? " full" : "");
  cnt.textContent = done + "/" + cl.items.length;
  var x = document.createElement("button"); x.className = "mx";
  x.setAttribute("aria-label", t("del"));
  x.appendChild(svgIcon("trash", 15));
  x.onclick = function(){ removeChecklist(p, cl); };
  head.appendChild(nm); head.appendChild(cnt); head.appendChild(x);
  box.appendChild(head);

  cl.items.forEach(function(it){
    var row = document.createElement("button");
    row.className = "chkitem" + (it.done ? " on" : "");
    var mark = document.createElement("span"); mark.className = "chkmark";
    if(it.done) mark.appendChild(svgIcon("check", 14, 2.8));
    var tx = document.createElement("span"); tx.className = "chktext"; tx.textContent = it.text;
    row.appendChild(mark); row.appendChild(tx);
    row.onclick = function(){
      it.done = !it.done; it.at = it.done ? Date.now() : null;
      save(); renderPat();
    };
    box.appendChild(row);
  });

  var ta = document.createElement("textarea");
  ta.className = "chkcomment"; ta.placeholder = t("checkCommentPh");
  ta.value = cl.comment || "";
  ta.oninput = function(){ cl.comment = ta.value; save(); autoGrow(ta); };
  ta.addEventListener("blur", function(){
    var r = convertiTutto(cl, "comment", p, { pid:p.id });
    if(r.compiti || r.morali){ render(); renderPat(); avvisaTutto(r); }
  });
  box.appendChild(ta);
  box.appendChild(photoRow(cl, renderPat));
  setTimeout(function(){ autoGrow(ta); }, 0);
  return box;
}

function addChecklist(p, tp){
  p.checklists = p.checklists || [];
  p.checklists.push({
    id:uid(), tplId:tp.id, name:tp.name, added:Date.now(), comment:"",
    items:tp.items.map(function(txt){ return { text:txt, done:false, at:null }; })
  });
  save();
}
function removeChecklist(p, cl){
  var idx = (p.checklists || []).indexOf(cl);
  if(idx < 0) return;
  p.checklists.splice(idx, 1);
  save(); renderPat();
  showToast(t("checkRemoved"), t("undo"), function(){
    p.checklists.splice(Math.min(idx, p.checklists.length), 0, cl);
    save(); renderPat();
  });
}

/* scegliere quale checklist aggiungere a questo paziente */
function openPickTplSheet(p){
  openSheet(function(sheet, close){
    var h = document.createElement("h2"); h.textContent = t("checkAdd");
    sheet.appendChild(h);
    var tpls = checkTpls();
    if(!tpls.length){
      var e = document.createElement("p"); e.className = "sub"; e.textContent = t("checkNoTpl");
      sheet.appendChild(e);
    }
    tpls.slice().sort(function(a,b){ return a.name.localeCompare(b.name); }).forEach(function(tp){
      var b = document.createElement("button"); b.className = "tplrow";
      var nm = document.createElement("span"); nm.className = "tplname"; nm.textContent = tp.name;
      var n = document.createElement("span"); n.className = "tpln";
      n.textContent = tp.items.length + " " + t("checkNItems");
      b.appendChild(nm); b.appendChild(n);
      b.onclick = function(){ addChecklist(p, tp); close(); renderPat(); showToast(t("checkAdded")); };
      sheet.appendChild(b);
    });
    var nb = document.createElement("button");
    nb.style.cssText = "margin-top:14px; font-size:13px; color:var(--accent); font-weight:600;" +
      "text-decoration:underline; text-underline-offset:3px";
    nb.textContent = t("tplNew");
    nb.onclick = function(){ close(); openTplSheet(null, function(){ openPickTplSheet(p); }); };
    sheet.appendChild(nb);

    var acts = document.createElement("div"); acts.className = "sheet-actions";
    var cn = document.createElement("button"); cn.className = "btn btn-ghost";
    cn.textContent = t("cancel"); cn.onclick = close;
    acts.appendChild(cn); sheet.appendChild(acts);
  });
}

/* la raccolta dei modelli, valida per tutta l'app */
function openTplsSheet(){
  openSheet(function(sheet, close){
    var h = document.createElement("h2"); h.textContent = t("myTpl");
    sheet.appendChild(h);
    var sub = document.createElement("p"); sub.className = "sub"; sub.textContent = t("myTplNote");

      sheet.appendChild(e);

      var b = document.createElement("button"); b.className = "tplrow";
      var nm = document.createElement("span"); nm.className = "tplname"; nm.textContent = tp.name;

      b.onclick = function(){ close(); openTplSheet(tp, openTplsSheet); };
      sheet.appendChild(b);
    });
    var nb = document.createElement("button");
    nb.style.cssText = "margin-top:14px; font-size:13px; color:var(--accent); font-weight:600;" +
      "text-decoration:underline; text-underline-offset:3px";
    nb.textContent = t("tplNew");
    nb.onclick = function(){ close(); openTplSheet(null, openTplsSheet); };
    sheet.appendChild(nb);

    var acts = document.createElement("div"); acts.className = "sheet-actions";
    var cl = document.createElement("button"); cl.className = "btn"; cl.style.background = "var(--accent)";
    cl.textContent = t("close"); cl.onclick = function(){ close(); renderPat(); };
    acts.appendChild(cl); sheet.appendChild(acts);
  });
}

/* creare o modificare un modello: nome + una voce per riga */
function openTplSheet(tp, after){
  openSheet(function(sheet, close){
    var h = document.createElement("h2"); h.textContent = tp ? t("tplEdit") : t("tplNew");
    sheet.appendChild(h);
    var sub = document.createElement("p"); sub.className = "sub"; sub.textContent = t("tplNote");
    sheet.appendChild(sub);

    var fn = fieldEl(t("tplName"), t("tplNamePh"), tp ? tp.name : "");
    sheet.appendChild(fn.wrap);

    sheet.appendChild(labelEl(t("tplItems")));
    var ta = document.createElement("textarea");
    ta.className = "pastearea"; ta.style.minHeight = "170px";
    ta.placeholder = t("tplItemsPh");
    ta.value = tp ? tp.items.join("\n") : "";
    sheet.appendChild(ta);

    var err = document.createElement("p");
    err.style.cssText = "color:var(--alert); font-size:13px; margin:10px 0 0"; err.hidden = true;
    sheet.appendChild(err);

    var acts = document.createElement("div"); acts.className = "sheet-actions";
    var ok = document.createElement("button"); ok.className = "btn"; ok.style.background = "var(--accent)";
    ok.textContent = t("saveBtn");
    ok.onclick = function(){
      var name = fn.input.value.trim();
      var items = ta.value.split("\n").map(function(s){ return s.trim(); })
        .filter(function(s){ return s.length > 0; });
      if(!name){ err.textContent = t("tplNeedName"); err.hidden = false; fn.input.focus(); return; }
      if(!items.length){ err.textContent = t("tplNeedItems"); err.hidden = false; ta.focus(); return; }
      if(tp){ tp.name = name; tp.items = items; }
      else checkTpls().push({ id:uid(), name:name, items:items, created:Date.now() });
      save(); close(); renderPat();
      if(after) after();
    };
    acts.appendChild(ok);
    if(tp){
      var dl = document.createElement("button"); dl.className = "btn btn-ghost";
      dl.style.color = "var(--alert)"; dl.style.borderColor = "var(--alert)";
      dl.textContent = t("del");
      dl.onclick = function(){
        S.settings.checklists = checkTpls().filter(function(z){ return z.id !== tp.id; });
        save(); close(); renderPat();
        if(after) after();
      };
      acts.appendChild(dl);
    }
    var cn = document.createElement("button"); cn.className = "btn btn-ghost";
    cn.textContent = t("cancel");
    cn.onclick = function(){ close(); if(after) after(); };
    acts.appendChild(cn);
    sheet.appendChild(acts);
    setTimeout(function(){ if(!tp) fn.input.focus(); }, 80);
  });
}

function buildSummary(p){
  var L = [];
  var labs = sortedLabs(p);
  L.push("=== PAZIENTE " + (p.alias || "?") + (p.room ? "  ·  " + p.room : "") + " ===");
  if(p.dx) L.push(p.dx);
  if(p.surgeon) L.push("Operatore: " + p.surgeon);
  var op = daysSince(p.opDate);
  if(op !== null) L.push("Intervento " + fmtDayShort(p.opDate) + " — " + op + "° giorno post-op");
  L.push("");

  var sistemi = sysPerRiassunto(p);
  if(sistemi.length){
    L.push("-- SISTEMI (la mia valutazione) --");
    sistemi.forEach(function(r){ L.push(r); });
    L.push("");
  }

  var meds = (p.meds || []).filter(function(m){ return !m.stopped; });
  L.push("-- TERAPIA IN CORSO --");
  if(!meds.length) L.push("(nessun farmaco registrato)");
  meds.forEach(function(m){
    L.push("- " + m.name + (m.dose ? "  " + m.dose : "") + (m.note ? "   [" + m.note + "]" : ""));
  });
  var off = (p.meds || []).filter(function(m){ return m.stopped; });
  if(off.length){
    L.push("sospesi: " + off.map(function(m){ return m.name + " (" + fmtDayShort(m.stopped) + ")"; }).join(", "));
  }
  L.push("");

  L.push("-- VALORI --");
  if(!labs.length) L.push("(nessun valore registrato)");
  else {
    var cols = labs.slice(-5);
    var lnames = patLabNames(p);
    var w = 8;
    lnames.forEach(function(n){ if(n.length + 2 > w) w = n.length + 2; });
    if(w > 26) w = 26;
    var head = pad("", w) + pad("", 9);
    cols.forEach(function(l){ head += pad(fmtDayShort(l.day), 10); });
    L.push(head);
    var anyMark = false;
    lnames.forEach(function(name){
      var line = pad(name, w) + pad(labUnitOf(name), 9);
      cols.forEach(function(l){
        var v = labValue(l, name);
        if(!hasNum(v)){ line += pad(".", 10); return; }
        var mark = outOfRange(name, v);
        if(mark) anyMark = true;
        line += pad(fmtNum(v) + (mark > 0 ? " A" : mark < 0 ? " B" : ""), 10);
      });
      var rt = rangeText(name);
      if(rt) line += " " + rt;
      L.push(line);
    });
    if(anyMark) L.push("(A = sopra, B = sotto l" + "’" + "intervallo che ho impostato io)");
  }
  L.push("");

  var open = patOpenTodos(p.id);
  L.push("-- DA FARE, ANCORA APERTI --");
  if(!open.length) L.push("(niente)");
  open.forEach(function(i){
    L.push("- " + (i.urgent ? "[urgente] " : "") + i.text +
      (i.stage === "result" ? "  → in attesa dell'esito" : ""));
  });
  var recentDone = patTodos(p.id).filter(function(i){ return i.stage === "done" && i.comment; })
    .sort(function(a,b){ return (b.done||0) - (a.done||0); }).slice(0, 6);
  if(recentDone.length){
    L.push("");
    L.push("-- ESITI RECENTI --");
    recentDone.forEach(function(i){ L.push("- " + i.text + ": " + i.comment); });
  }
  L.push("");

  var notes = (p.notes || []).slice().sort(function(a,b){ return (b.ts||0) - (a.ts||0); }).slice(0, 10);
  L.push("-- NOTE --");
  if(!notes.length) L.push("(nessuna)");
  notes.forEach(function(n){ L.push(fmtDayShort(n.day) + " " + (n.time||"") + " — " + n.text); });

  L.push("");
  L.push("=== COSA TI CHIEDO ===");
  L.push(S.settings.askText || DEFAULT_ASK);
  return L.join("\n");

  function pad(s, n){
    s = String(s === undefined || s === null ? "" : s);
    while(s.length < n) s += " ";
    return s;
  }
}

var SUGG = {
  surg:{ name:"suggSurg", where:"suggSurgWhere" },
  icu:{ name:"suggIcu", where:"suggIcuWhere" }
};
/* l'elenco di partenza: per l'operatore i nomi già scritti nelle schede,
   per l'intensiva i titoli soliti nella lingua dell'interfaccia */
function suggDefault(kind){
  var out = [];
  function metti(s){
    s = String(s || "").trim();
    if(s && out.map(labKey).indexOf(labKey(s)) < 0) out.push(s);
  }
  if(kind === "surg") (S.patients || []).forEach(function(x){ metti(x.surgeon); });
  if(kind === "icu") t("icuSugg").split("|").forEach(metti);
  return out;
}
function suggList(kind){
  var s = S.settings.sugg || (S.settings.sugg = {});
  if(!Array.isArray(s[kind])){ s[kind] = suggDefault(kind); save(); }
  return s[kind];
}
/* una parola scritta a mano che non c'è ancora va in fondo all'elenco */
function suggRemember(kind, val){
  val = String(val || "").trim();
  if(!val) return;
  var l = suggList(kind);
  if(l.map(labKey).indexOf(labKey(val)) < 0){ l.push(val); save(); }
}

function openSuggSheet(kind){
  openSheet(function(sheet, close){
    var h = document.createElement("h2"); h.textContent = t(SUGG[kind].name);
    sheet.appendChild(h);
    var sub = document.createElement("p"); sub.className = "sub"; sub.textContent = t(SUGG[kind].where);
    sheet.appendChild(sub);
    var nt = document.createElement("p"); nt.className = "labnote";
    nt.style.margin = "0 0 10px"; nt.textContent = t("suggEditNote");
    sheet.appendChild(nt);

    var host = document.createElement("div"); host.className = "sglist";
    sheet.appendChild(host);
    var vuoto = document.createElement("p"); vuoto.className = "emptysm"; vuoto.textContent = t("suggEmpty");
    sheet.appendChild(vuoto);

    /* l'elenco salvato è sempre quello che si vede, nell'ordine in cui si vede */
    function salva(){
      var out = [];
      Array.prototype.forEach.call(host.querySelectorAll(".sgitem input"), function(i){
        var v = i.value.trim();
        if(v && out.map(labKey).indexOf(labKey(v)) < 0) out.push(v);
      });
      S.settings.sugg = S.settings.sugg || {};
      S.settings.sugg[kind] = out;
      save();
      vuoto.hidden = out.length > 0;
    }
    function riga(val){
      var r = document.createElement("div"); r.className = "sgitem";
      var g = document.createElement("button"); g.className = "vgrip";
      g.setAttribute("aria-label", t("suggMove"));
      g.appendChild(svgIcon("grip", 16, 1.9));
      var i = document.createElement("input");
      i.value = val; i.autocomplete = "off";
      var vecchio = val;
      i.onchange = function(){
        if(!i.value.trim()) i.value = vecchio;   /* vuoto: torna com'era, per togliere c'è il cestino */
        vecchio = i.value.trim();
        salva();
      };
      i.onkeydown = function(e){ if(e.key === "Enter"){ e.preventDefault(); i.blur(); } };
      var x = document.createElement("button"); x.className = "mx";
      x.setAttribute("aria-label", t("del"));
      x.appendChild(svgIcon("trash", 15));
      x.onclick = function(){
        var dopo = r.nextSibling;
        r.remove(); salva();
        showToast(t("deleted"), t("undo"), function(){
          if(dopo && dopo.parentNode === host) host.insertBefore(r, dopo); else host.appendChild(r);
          salva();
        });
      };
      r.appendChild(g); r.appendChild(i); r.appendChild(x);
      attachDragHandle(r, g, "sgitem", salva);
      return r;
    }
    function disegna(){
      host.textContent = "";
      suggList(kind).forEach(function(v){ host.appendChild(riga(v)); });
      vuoto.hidden = suggList(kind).length > 0;
    }
    disegna();

    var add = document.createElement("div"); add.className = "sgadd";
    var ai = document.createElement("input");
    ai.placeholder = t("suggAddPh"); ai.autocomplete = "off";
    var ab = document.createElement("button"); ab.className = "btn"; ab.style.background = "var(--accent)";
    ab.textContent = t("suggAdd");
    function aggiungi(){
      var v = ai.value.trim();
      if(!v){ ai.focus(); return; }
      if(suggList(kind).map(labKey).indexOf(labKey(v)) >= 0){ showToast(t("suggDup")); return; }
      host.appendChild(riga(v)); salva();
      ai.value = ""; ai.focus();
    }
    ab.onclick = aggiungi;
    ai.onkeydown = function(e){ if(e.key === "Enter"){ e.preventDefault(); aggiungi(); } };
    add.appendChild(ai); add.appendChild(ab);
    sheet.appendChild(add);

    var acts = document.createElement("div"); acts.className = "sheet-actions";
    var cl = document.createElement("button"); cl.className = "btn"; cl.style.background = "var(--accent)";
    cl.textContent = t("close");
    cl.onclick = function(){ close(); openSettings(); };
    var rs = document.createElement("button"); rs.className = "btn btn-ghost";
    rs.textContent = t("suggReset");
    rs.onclick = function(){
      var prima = suggList(kind).slice();
      S.settings.sugg[kind] = suggDefault(kind); save(); disegna();
      showToast(t("suggResetDone"), t("undo"), function(){
        S.settings.sugg[kind] = prima; save(); disegna();
      });
    };
    acts.appendChild(cl); acts.appendChild(rs);
    sheet.appendChild(acts);
  });
}

function openPatSheet(p){
  openSheet(function(sheet, close){
    var h = document.createElement("h2"); h.textContent = p ? t("editPat") : t("newPat");
    sheet.appendChild(h);
    var fA = fieldEl(t("fAlias"), t("fAliasPh"), p ? p.alias : "");
    var fR = fieldEl(t("fRoom"), t("roomPh"), p ? p.room : "");
    var fD = fieldEl(t("fDx"), t("fDxPh"), p ? p.dx : "");
    var fS = fieldEl(t("fSurg"), t("fSurgPh"), p ? p.surgeon : "");
    /* propone i nomi dell'elenco "Operatore" (si cambia dalle Impostazioni) */
    var surgList = document.createElement("datalist"); surgList.id = "surgNames";
    suggList("surg").forEach(function(n){
      var o = document.createElement("option"); o.value = n; surgList.appendChild(o);
    });
    fS.input.setAttribute("list", "surgNames");
    fS.wrap.appendChild(surgList);
    var fO = dateFieldEl(t("fOp"), p ? p.opDate : "", true);
    [fA, fR, fD, fS, fO].forEach(function(f){ sheet.appendChild(f.wrap); });

    var err = document.createElement("p");
    err.style.cssText = "color:var(--alert); font-size:13px; margin:10px 0 0"; err.hidden = true;
    sheet.appendChild(err);

    var acts = document.createElement("div"); acts.className = "sheet-actions";
    var ok = document.createElement("button"); ok.className = "btn"; ok.style.background = "var(--accent)";
    ok.textContent = t("saveBtn");
    /* salva i campi del foglio. Lo usano "Salva" e anche i tasti di passaggio
       (di nuovo in reparto, in terapia intensiva, dimetti, riammetti): quello
       che hai appena scritto — per esempio la stanza nuova — non va perso, e la
       scheda si sposta al suo posto nella lista. Restituisce false se manca il nome. */
    function salvaCampi(){
      var alias = fA.input.value.trim();
      if(!alias){ err.textContent = t("aliasNeeded"); err.hidden = false; fA.input.focus(); return false; }
      var creati = 0;
      if(p){
        var stanzaPrima = p.room || "";
        p.alias = alias; p.room = fR.input.value.trim(); p.dx = fD.input.value.trim();
        /* stanza cambiata: la scheda si sposta al suo posto nella lista */
        if(p.room !== stanzaPrima){
          var ix = patients().indexOf(p);
          if(ix >= 0){ patients().splice(ix, 1); inserisciPerStanza(p); }
        }
        if(fS.input.value.trim() !== (p.surgeon || "")) suggRemember("surg", fS.input.value);
        p.surgeon = fS.input.value.trim();
        p.opDate = fO.get() || null;
        creati = convertiMarcati(p, "dx", "dxTasks", p) + convertiMorali(p, "dx", "dxMorals", { pid:p.id });
      } else {
        var np = { id:uid(), alias:alias, room:fR.input.value.trim(), dx:fD.input.value.trim(),
          surgeon:fS.input.value.trim(), opDate:fO.get() || null, admDate:view.day, dischargedOn:null,
          created:Date.now(), meds:[], labs:[], notes:[], files:[], proposals:[], summary:null };
        suggRemember("surg", np.surgeon);
        inserisciPerStanza(np);
        pview.id = np.id; pview.tab = "sys";
        creati = convertiMarcati(np, "dx", "dxTasks", np) + convertiMorali(np, "dx", "dxMorals", { pid:np.id });
      }
      save();
      return { creati:creati };
    }
    ok.onclick = function(){
      var r = salvaCampi();
      if(!r) return;
      close(); render(); renderPat();
      avvisaCompiti(r.creati);
    };
    acts.appendChild(ok);
    if(p){
      var dc = document.createElement("button"); dc.className = "btn btn-ghost";
      dc.textContent = p.dischargedOn ? t("readmit") : t("discharge");
      dc.onclick = function(){
        var r = salvaCampi();
        if(!r) return;
        if(p.dischargedOn){
          p.dischargedOn = null; delete p.active;
          save(); close(); render(); renderPat(); showToast(t("readmitted"));
        } else {
          close(); dimetti(p);
        }
        if(r.creati) setTimeout(function(){ avvisaCompiti(r.creati); }, 3100);
      };
      acts.appendChild(dc);
      if(!p.dischargedOn){
        var ic = document.createElement("button"); ic.className = "btn btn-ghost";
        var aperta = !!icuAperta(p);
        ic.textContent = aperta ? t("icuBack") : t("icuSend");
        ic.style.color = "var(--icu)"; ic.style.borderColor = "var(--icu)";
        ic.onclick = function(){
          var r = salvaCampi();
          if(!r) return;
          close();
          if(aperta) riportaDaIcu(p); else mandaInIcu(p);
          if(r.creati) setTimeout(function(){ avvisaCompiti(r.creati); }, 3100);
        };
        acts.appendChild(ic);
      }
    }
    var cn = document.createElement("button"); cn.className = "btn btn-ghost";
    cn.textContent = t("cancel"); cn.onclick = close;
    acts.appendChild(cn);
    sheet.appendChild(acts);

    if(p){
      var dl = document.createElement("button");
      dl.className = "btn btn-ghost";
      dl.style.cssText = "width:100%; margin-top:18px; color:var(--alert); border-color:var(--alert);" +
        "display:flex; align-items:center; justify-content:center; gap:8px";
      dl.appendChild(svgIcon("trash", 16));
      dl.append(document.createTextNode(t("delPat")));
      dl.onclick = function(){ close(); confirmDeletePat(p); };
      sheet.appendChild(dl);
    }
    setTimeout(function(){ if(!p) fA.input.focus(); }, 80);
  });
}

/* Eliminare una scheda porta via anche i suoi compiti: lo dico prima,
   e per qualche secondo resta il tasto Annulla. */
/* Dimettere: un tocco e basta, sul giorno che stai guardando. Da quel giorno
   compreso il paziente resta visibile, dal giorno dopo sparisce dalla lista —
   ma resta per sempre nei giorni in cui c'e' stato.
   Niente conferma: nel messaggio in basso c'e' Annulla, che rimette tutto com'era. */
function dimetti(p){
  var prima = p.dischargedOn || null;
  var primaIcu = JSON.stringify(p.icuStays || []);
  var primaV = (p.verlauf || []).slice();
  var aperta = icuAperta(p);
  if(aperta){
    var g0 = view.day || todayStr();
    if(g0 <= aperta.from){ p.icuStays.splice(p.icuStays.indexOf(aperta), 1); togliEventiIcu(p, aperta); }
    else aperta.to = g0;
  }
  p.dischargedOn = view.day || todayStr();
  delete p.active;
  save();
  if(!patPresente(p, view.day)) pview.id = null;
  render(); renderPat();
  showToast(t("discharged") + " " + fmtDayShort(p.dischargedOn), t("undo"), function(){
    p.dischargedOn = prima;
    p.icuStays = JSON.parse(primaIcu);
    p.verlauf = primaV;
    save(); render(); renderPat();
  });
}

function confirmDeletePat(p){
  openSheet(function(sheet, close){
    var h = document.createElement("h2"); h.textContent = t("delPat");
    sheet.appendChild(h);
    var sub = document.createElement("p"); sub.className = "sub";
    sub.textContent = p.alias + (p.room ? " · " + p.room : "");
    sheet.appendChild(sub);

    var w = document.createElement("div"); w.className = "warnbox";
    w.textContent = t("delPatSure");
    sheet.appendChild(w);

    var n = [];
    if((p.labs || []).length) n.push((p.labs || []).length + " " + t("tLab").toLowerCase());
    if((p.meds || []).length) n.push((p.meds || []).length + " " + t("tTher").toLowerCase());
    if((p.notes || []).length + (p.files || []).length) n.push(((p.notes||[]).length + (p.files||[]).length) + " " + t("tNotes").toLowerCase());
    if(patTodos(p.id).length) n.push(patTodos(p.id).length + " " + t("tTodo").toLowerCase());
    if(sysCount(p)) n.push(sysCount(p) + " " + t("tSys").toLowerCase());
    if(n.length){
      var cnt = document.createElement("p"); cnt.className = "labnote";
      cnt.style.marginTop = "10px";
      cnt.textContent = n.join("  ·  ");
      sheet.appendChild(cnt);
    }

    var acts = document.createElement("div"); acts.className = "sheet-actions";
    var ok = document.createElement("button"); ok.className = "btn";
    ok.style.background = "var(--alert)"; ok.textContent = t("yes");
    ok.onclick = function(){ close(); deletePat(p); };
    var cn = document.createElement("button"); cn.className = "btn btn-ghost";
    cn.textContent = t("cancel"); cn.onclick = close;
    acts.appendChild(ok); acts.appendChild(cn);
    sheet.appendChild(acts);
  });
}
function deletePat(p){
  var pi = patients().indexOf(p);
  if(pi < 0) return;
  var mine = patTodos(p.id);
  var keep = { pat:p, idx:pi, items:mine.map(function(i){ return { item:i, idx:S.items.indexOf(i) }; }) };
  patients().splice(pi, 1);
  S.items = S.items.filter(function(i){ return i.pid !== p.id; });
  pview.id = null;
  save(); render(); renderPat();
  showToast(t("patDeleted"), t("undo"), function(){
    patients().splice(Math.min(keep.idx, patients().length), 0, keep.pat);
    keep.items.sort(function(a,b){ return a.idx - b.idx; }).forEach(function(e){
      S.items.splice(Math.min(e.idx, S.items.length), 0, e.item);
    });
    save(); render(); renderPat();
  });
}

/* ------------------------------------------------- pazienti del turno 29.09
   Schede riempite una volta sola dai dati del turno: terapia, laboratorio e
   note datate nei giorni in cui sono successe le cose. Nessun compito.
   Se una scheda con lo stesso pseudonimo c'e' gia' (punti e spazi non
   contano), i dati si aggiungono a quelli che ci sono, senza doppioni. */
var SEME_PAZIENTI = [];

function chiavePseudonimo(s){ return nomePulito(s).replace(/[^0-9a-z]/g, ""); }

function semePazienti(){
  if(S.settings.seedPaz2909) return;
  S.settings.seedPaz2909 = 1;

  SEME_PAZIENTI.forEach(function(sp){
    var k = chiavePseudonimo(sp.alias);
    var p = patients().filter(function(x){ return chiavePseudonimo(x.alias) === k; })[0];
    if(!p){
      p = { id:uid(), alias:sp.alias, room:"", dx:sp.dx || "", surgeon:sp.surgeon || "",
        opDate:sp.opDate || null, admDate:sp.admDate || todayStr(), dischargedOn:null,
        created:Date.now(), meds:[], labs:[], notes:[], files:[], proposals:[], summary:null };
      inserisciPerStanza(p);
    } else {
      if(!p.dx && sp.dx) p.dx = sp.dx;
      if(!p.opDate && sp.opDate) p.opDate = sp.opDate;
      if(sp.admDate && (!p.admDate || p.admDate > sp.admDate)) p.admDate = sp.admDate;
      p.meds = p.meds || []; p.labs = p.labs || []; p.notes = p.notes || [];
    }

    /* terapia: niente doppioni per nome */
    (sp.meds || []).forEach(function(m){
      var gia = p.meds.some(function(x){ return labKey(x.name) === labKey(m[0]); });
      if(gia) return;
      p.meds.push({ id:uid(), name:m[0], dose:m[1] || "", note:m[2] || "",
        since:sp.admDate || todayStr(), stopped:m[3] || null });
    });

    /* laboratorio: un prelievo per giorno e ora */
    (sp.labs || []).forEach(function(l){
      var gia = p.labs.some(function(x){ return x.day === l[0] && (x.time || "") === (l[1] || ""); });
      if(gia) return;
      var entries = l[2].map(function(e){
        var nome = nomeValore(e[0], e[2]);
        return { name:nome, value:e[1], unit:e[2] || "" };
      });
      p.labs.push({ id:uid(), day:l[0], time:l[1] || "", entries:entries,
        at:tsDi(l[0], l[1]) });
    });

    /* note: con la loro data, come se le avessi scritte quel giorno */
    (sp.notes || []).forEach(function(n){
      var gia = p.notes.some(function(x){ return x.text === n[2]; });
      if(gia) return;
      p.notes.push({ id:uid(), day:n[0], time:n[1] || "", ts:tsDi(n[0], n[1]),
        text:n[2], photos:[], tasks:[], morals:[] });
    });
  });
  save();

  /* Il nome entra nel vocabolario dei valori. Se lo usavi gia' con un'altra
     unita', la tua resta com'e' e questo valore prende l'unita' nel nome. */
  function nomeValore(nome, unita){
    var m = labMeta(nome);
    if(!m){ rememberLabName(nome, unita || ""); return nome; }
    if(!m.unit && unita){ m.unit = unita; m.used = (m.used || 0) + 1; return nome; }
    if(!unita || m.unit === unita){ m.used = (m.used || 0) + 1; return nome; }
    var altro = nome + " (" + unita + ")";
    if(!labMeta(altro)) rememberLabName(altro, unita);
    return altro;
  }
  function tsDi(day, time){
    var p = String(time || "12:00").split(":");
    var d = parseDay(day); d.setHours(+p[0] || 0, +p[1] || 0, 0, 0);
    return d.getTime();
  }
}

/* Tornare alla lista nel punto in cui l'avevi lasciata. Lo rifaccio anche al
   fotogramma dopo: se qualcosa (caratteri, miniature) allunga la pagina appena
   disegnata, la posizione resta giusta. */
function tornaA(y){
  window.scrollTo(0, y);
  if(window.requestAnimationFrame){
    requestAnimationFrame(function(){ window.scrollTo(0, y); });
  }
}

/* ------------------------------------------------------------- avvio braccio 2 */
function initPat(){
  S.patients = S.patients || [];
  S.settings.ranges = S.settings.ranges || {};

  /* Prima dell'ordine a mano la lista era ordinata per stanza: la fisso una volta
     sola come punto di partenza, cosi' niente salta al primo avvio. */
  /* compiti creati prima di questa correzione: tolgo i marcatori rimasti nel testo */
  S.items.forEach(function(it){
    if(it.text && findMarks(it.text).length) it.text = stripMarks(it.text);
  });

  /* prima la dimissione era un interruttore: la trasformo in una data,
     mettendola a ieri, cosi' chi era nascosto resta nascosto */
  patients().forEach(function(p){
    if(p.active === false && !p.dischargedOn) p.dischargedOn = shiftDay(todayStr(), -1);
    delete p.active;
  });

  /* una volta sola: le schede che ci sono gia' si mettono in ordine di stanza */
  if(!S.settings.patStanze){
    ordinaPerStanza();
    S.settings.patOrdered = true;
    S.settings.patStanze = 1;
    save();
  }

  /* una volta sola: il Verlauf passa da "nuove in fondo" a "nuove in cima".
     Capovolgo le liste esistenti, cosi' anche le voci vecchie hanno la piu'
     recente in alto e l'ordine scelto a mano resta, solo rovesciato. */
  if(!S.settings.verlTop){
    patients().forEach(function(p){ if(p.verlauf && p.verlauf.length > 1) p.verlauf.reverse(); });
    S.settings.verlTop = 1;
    save();
  }

  /* una volta sola: i passaggi in intensiva fatti prima di questa funzione
     ricevono anche loro le caselle nel Verlauf, al loro posto per data */
  if(!S.settings.icuVerl){
    patients().forEach(function(p){
      (p.icuStays || []).forEach(function(s){
        if(!s.id) s.id = uid();
        mettiPerData(p, verlEvento("icu", s, s.from, ""));
        if(s.to) mettiPerData(p, verlEvento("back", s, s.to, ""));
      });
    });
    S.settings.icuVerl = 1;
    save();
  }

  semePazienti();

  $("modeShift").onclick = function(){ setMode("shift"); };
  $("modePat").onclick = function(){ setMode("pat"); };
  $("patNewBtn").onclick = function(){ openPatSheet(null); };
  $("patPrevDay").onclick = function(){ view.day = shiftDay(view.day, -1); view._wasToday = isToday(); render(); };
  $("patNextDay").onclick = function(){ view.day = shiftDay(view.day, 1); view._wasToday = isToday(); render(); };
  $("patTodayBtn").onclick = function(){ view.day = todayStr(); view._wasToday = true; render(); };
  $("patDayBtn").onclick = openDaySheet;
  $("patBack").onclick = function(){
    pview.id = null; renderPat();
    tornaA(pview.listY || 0);
  };
  $("pdEdit").appendChild(svgIcon("gear", 18));
  $("pdEdit").onclick = function(){ openPatSheet(patById(pview.id)); };
  $("patSearchX").appendChild(svgIcon("x", 16, 2));
  $("patSearch").addEventListener("input", function(){
    pview.q = this.value;
    $("patSearchX").hidden = !this.value;
    /* i risultati si leggono dall'inizio, anche se eri a meta' lista */
    window.scrollTo(0, 0);
    renderPatList();
  });
  /* la X svuota la ricerca in un colpo solo e lascia il cursore nel campo */
  $("patSearchX").onclick = function(){
    $("patSearch").value = ""; pview.q = "";
    $("patSearchX").hidden = true;
    renderPatList();
    $("patSearch").focus();
  };
  $("patShowOff").onclick = function(){ pview.showIcu = !pview.showIcu; renderPatList(); };
  $("patSortCol").onclick = function(){ S.settings.patByColor = !S.settings.patByColor; save(); renderPatList(); };
  $("pinOk").onclick = tryPin;
  $("pinInput").addEventListener("keydown", function(e){ if(e.key === "Enter") tryPin(); });

  function tryPin(){
    if($("pinInput").value === S.settings.pin){
      pview.unlocked = true; $("lockErr").hidden = true; gatePat();
    } else {
      $("lockErr").textContent = t("pinWrong"); $("lockErr").hidden = false;
      $("pinInput").value = "";
    }
  }

  /* render() deve aggiornare anche il braccio pazienti, senza toccare il codice
     dei tre binari: in modalità pazienti la lista del turno resta vuota così
     non si duplicano gli id delle voci. */
  var _render = render;
  render = function(){
    if(mode === "pat"){ renderChrome(); listEl.textContent = ""; renderPat(); }
    else if(mode === "mor"){ renderChrome(); listEl.textContent = ""; renderMor(); }
    else if(mode === "col"){
      renderChrome(); listEl.textContent = "";
      /* se il cursore e' dentro un foglio di scrittura non lo ridisegno:
         perderesti il punto in cui stavi scrivendo */
      var a = document.activeElement;
      if(!(a && a.classList && a.classList.contains("notearea"))) renderCol();
    }
    else _render();
  };

  initNote();
  initCol();
  initMor();
  initScn();
  var ultimo = S.settings.lastMode;
  setMode(["pat","note","col","mor","med","scn"].indexOf(ultimo) >= 0 ? ultimo : "shift");
}

/* ------------------------------------------------- modificare una nota scritta
   Come per i compiti: doppio tocco (o tieni premuto) sul testo e si apre il
   riquadro per correggerlo. Vale per le note di un paziente e per gli eventi
   di un collega — dove si puo' cambiare anche il giorno.
   Gli asterischi continuano a funzionare: se ne aggiungi mentre correggi,
   nascono i compiti nel turno. */
var modificaAperta = false;

function modificaTesto(txEl, testo, opts){
  if(modificaAperta || editingId) return;
  modificaAperta = true;

  var box = document.createElement("div"); box.className = "edit-box";
  var ta = document.createElement("textarea");
  ta.className = "edit-text"; ta.value = testo || "";
  ta.setAttribute("enterkeyhint", "enter");
  box.appendChild(ta);

  /* per un evento si corregge anche la data */
  var campoData = null;
  if(opts.data !== undefined){
    campoData = dateFieldEl("", opts.data || todayStr(), false);
    box.appendChild(campoData.wrap);
  }
  /* per il Verlauf invece e' testo libero: una data, un periodo, quello che vuoi */
  var campoLibero = null;
  if(opts.libero !== undefined){
    campoLibero = document.createElement("input");
    campoLibero.type = "text"; campoLibero.value = opts.libero || "";
    campoLibero.placeholder = opts.liberoPh || "";
    campoLibero.autocomplete = "off";
    campoLibero.className = "verlwhen-in";
    if(opts.liberoPrima) box.insertBefore(campoLibero, ta);
    else box.appendChild(campoLibero);
  }

  var row = document.createElement("div"); row.className = "edit-row";
  var mic = document.createElement("button"); mic.className = "mic-sm";
  mic.appendChild(svgIcon("mic", 15));
  mic.setAttribute("aria-label", t("listening"));
  mic.onclick = function(){ dictateInto(ta, mic); };
  row.appendChild(mic);

  /* opts.foto = la voce a cui appartengono le foto: in modifica si possono
     aggiungere (fotocamera o galleria) anche a una voce gia' salvata.
     Le foto aggiunte qui si tolgono di nuovo se annulli la modifica. */
  var fotoNuove = [];
  var strisciaFoto = null;
  if(opts.foto){
    strisciaFoto = document.createElement("div");
    box.insertBefore(strisciaFoto, box.firstChild.nextSibling);
    var disegnaFoto = function(){
      strisciaFoto.textContent = "";
      if(hasPhotos(opts.foto)) strisciaFoto.appendChild(photoRow(opts.foto, disegnaFoto, { add:false }));
    };
    disegnaFoto();
    var cam = document.createElement("button"); cam.className = "mic-sm";
    cam.appendChild(svgIcon("camera", 15));
    cam.setAttribute("aria-label", t("photoAdd"));
    cam.title = t("photoAdd");
    cam.onclick = function(){
      var prima = (opts.foto.photos || []).map(function(z){ return z.id; });
      addPhotoTo(opts.foto, function(){
        (opts.foto.photos || []).forEach(function(z){
          if(prima.indexOf(z.id) < 0) fotoNuove.push(z.id);
        });
        disegnaFoto();
      });
    };
    row.appendChild(cam);
  }

  var acts = document.createElement("div"); acts.className = "edit-actions";
  var no = document.createElement("button");
  no.className = "iconbtn"; no.appendChild(svgIcon("x", 17));
  no.setAttribute("aria-label", t("cancel"));
  no.onclick = annulla;
  var si = document.createElement("button");
  si.className = "iconbtn ok"; si.appendChild(svgIcon("check", 17, 2.2));
  si.setAttribute("aria-label", t("saveBtn"));
  si.onclick = conferma;
  acts.appendChild(no); acts.appendChild(si);
  row.appendChild(acts);
  box.appendChild(row);

  ta.addEventListener("keydown", function(e){
    if(e.key === "Enter" && (e.ctrlKey || e.metaKey)){ e.preventDefault(); conferma(); }
    if(e.key === "Escape"){ e.preventDefault(); annulla(); }
  });
  ta.addEventListener("input", function(){ autoGrow(ta); });

  txEl.parentNode.replaceChild(box, txEl);
  ta.focus();
  ta.setSelectionRange(ta.value.length, ta.value.length);
  autoGrow(ta);

  function chiudi(){ modificaAperta = false; stopDictation(); }
  function annulla(){
    chiudi();
    if(opts.foto && fotoNuove.length){
      fotoNuove.forEach(function(id){ dropPhotoURL(id); delBlob(id); });
      opts.foto.photos = (opts.foto.photos || []).filter(function(z){ return fotoNuove.indexOf(z.id) < 0; });
      save();
    }
    opts.annulla();
  }
  function conferma(){
    var v = ta.value.trim();
    if(!v && !opts.vuotoOk && !(opts.foto && hasPhotos(opts.foto))){ ta.focus(); return; }
    chiudi();
    opts.salva(v, campoData ? campoData.get() : (campoLibero ? campoLibero.value.trim() : null));
  }
}

/* ------------------------------------------------------------- Verlauf
   Il decorso del paziente: voci di testo che si aggiungono col +, come le
   note, ma che si possono riordinare trascinandole — come le schede nella
   lista dei pazienti. Qui il trascinamento parte dalla maniglia a sinistra,
   così il doppio tocco sul testo resta libero per correggere. */

/* Trascinamento con maniglia: nessuna attesa, si parte appena premi la presa. */
function attachDragHandle(card, handle, cls, salva){
  var ghost = null, active = false, grabDy = 0;

  handle.addEventListener("pointerdown", function(e){
    if(e.button) return;
    e.preventDefault();
    begin(e.clientY);
  });

  function begin(y){
    var r = card.getBoundingClientRect();
    grabDy = y - r.top;
    ghost = card.cloneNode(true);
    ghost.classList.add("ghost");
    ghost.style.width = r.width + "px";
    ghost.style.left = r.left + "px";
    ghost.style.top = (y - grabDy) + "px";
    document.body.appendChild(ghost);
    card.classList.add("placeholder");
    active = true;
    document.addEventListener("pointermove", onMove);
    document.addEventListener("pointerup", fine);
    document.addEventListener("pointercancel", fine);
    document.addEventListener("touchmove", stopScroll, { passive:false });
    if(S.settings.vibrate && navigator.vibrate){ try{ navigator.vibrate(18); }catch(e){} }
  }
  function onMove(e){ if(active) sposta(e.clientY); }
  function stopScroll(e){ if(active && e.cancelable) e.preventDefault(); }
  function sposta(y){
    ghost.style.top = (y - grabDy) + "px";
    var host = card.parentNode;
    if(!host) return;
    var sibs = Array.prototype.filter.call(host.children, function(n){
      return n !== card && n.classList && n.classList.contains(cls);
    });
    for(var i = 0; i < sibs.length; i++){
      var r = sibs[i].getBoundingClientRect();
      if(y < r.top + r.height / 2){ host.insertBefore(card, sibs[i]); return; }
    }
    if(sibs.length) host.insertBefore(card, sibs[sibs.length-1].nextSibling);
  }
  function fine(){
    document.removeEventListener("pointermove", onMove);
    document.removeEventListener("pointerup", fine);
    document.removeEventListener("pointercancel", fine);
    document.removeEventListener("touchmove", stopScroll);
    if(!active) return;
    active = false;
    if(ghost){ ghost.remove(); ghost = null; }
    card.classList.remove("placeholder");
    salva(card.parentNode);
  }
}

function verlauf(p){ return p.verlauf || (p.verlauf = []); }
/* L'etichetta in cima alla voce: testo libero. Le voci vecchie, scritte quando
   la data era automatica, continuano a mostrare la loro. */
function verlQuando(v){
  if(v.quando !== undefined && v.quando !== null) return v.quando;
  return (fmtDayShort(v.day) + " " + (v.time || "")).trim();
}

/* l'ordine sullo schermo diventa l'ordine salvato */
function salvaOrdineVerlauf(p, host){
  if(!host) return;
  var ids = Array.prototype.map.call(host.querySelectorAll(".vbox"),
    function(n){ return n.dataset.id; });
  var resto = {};
  verlauf(p).forEach(function(v){ resto[v.id] = v; });
  var nuovo = [];
  ids.forEach(function(id){ if(resto[id]){ nuovo.push(resto[id]); delete resto[id]; } });
  verlauf(p).forEach(function(v){ if(resto[v.id]) nuovo.push(v); });
  p.verlauf = nuovo;
  save();
}

function secVerlauf(host, p){
  var c = secCard(host, "verlTitle", t("verlAdd"), function(){ openVerlSheet(p); });
  var lista = verlauf(p);
  if(!lista.length){
    var e = document.createElement("p"); e.className = "emptysm"; e.textContent = t("verlEmpty");
    c.appendChild(e);
    var n0 = document.createElement("p"); n0.className = "labnote"; n0.textContent = t("verlNote");
    c.appendChild(n0);
    return;
  }

  var holder = document.createElement("div");
  holder.style.cssText = "display:flex; flex-direction:column; gap:9px; margin-top:2px";
  lista.forEach(function(v){ holder.appendChild(verlCard(p, v)); });
  c.appendChild(holder);

  var nota = document.createElement("p"); nota.className = "labnote";
  nota.textContent = lista.length > 1 ? t("verlDragHint") : t("verlNote");
  c.appendChild(nota);
}

function verlCard(p, v){
  var box = document.createElement("div");
  box.className = "vbox";
  box.dataset.id = v.id;

  /* la presa per trascinare */
  var grip = document.createElement("button");
  grip.className = "vgrip";
  grip.setAttribute("aria-label", t("verlMove"));
  grip.title = t("verlMove");
  grip.appendChild(svgIcon("grip", 16, 1.9));
  box.appendChild(grip);

  var body = document.createElement("div"); body.className = "vbody";
  /* casella automatica dell'intensiva: titolo + giorno, il testo e' facoltativo */
  var head = null;
  if(v.kind){
    box.classList.add(v.kind === "icu" ? "vk-icu" : "vk-back");
    head = document.createElement("div"); head.className = "vkind";

    kt.textContent = t(v.kind === "icu" ? "verlIcu" : "verlBack");
    var kd = document.createElement("span"); kd.className = "vk-d";
    kd.textContent = fmtDayFull(v.day);
    head.appendChild(kt); head.appendChild(kd);
  }
  var quando = document.createElement("div"); quando.className = "vwhen";
  quando.textContent = v.kind ? "" : verlQuando(v);
  quando.hidden = !quando.textContent;
  var tx = document.createElement("div"); tx.className = "vtext";
  tx.appendChild(textWithMorals(v.text, v.tasks, v.morals));
  if(!v.text && !v.kind) tx.style.minHeight = "22px";
  /* in modifica le miniature stanno dentro il riquadro di modifica */
  var fr = hasPhotos(v) ? photoRow(v, renderPat, { add:false }) : null;
  function apri(){
    if(fr && !modificaAperta && !editingId) fr.hidden = true;
    var o = {
      foto: v,
      annulla: renderPat,
      salva: function(nuovo, quandoNuovo){
        v.text = nuovo;
        if(!v.kind) v.quando = quandoNuovo || "";
        var r = convertiTutto(v, "text", p, { pid:p.id });
        save(); render(); renderPat();
        avvisaTutto(r);
      }
    };
    if(!v.kind){ o.libero = verlQuando(v); o.liberoPh = t("verlWhenPh"); }
    modificaTesto(tx, v.text, o);
  }
  attaccaModifica(tx, apri);
  if(head){ attaccaModifica(head, apri); body.appendChild(head); }
  body.appendChild(quando); body.appendChild(tx);
  if(fr) body.appendChild(fr);
  box.appendChild(body);

  var x = document.createElement("button"); x.className = "mx";
  x.setAttribute("aria-label", t("del"));
  x.appendChild(svgIcon("trash", 15));
  x.onclick = function(){ eliminaVerl(p, v); };
  box.appendChild(x);

  attachDragHandle(box, grip, "vbox", function(hostEl){ salvaOrdineVerlauf(p, hostEl); });
  return box;
}

function eliminaVerl(p, v){
  var idx = verlauf(p).indexOf(v);
  if(idx < 0) return;
  p.verlauf.splice(idx, 1);
  save(); renderPat();
  showToast(t("deleted"), t("undo"), function(){
    p.verlauf.splice(Math.min(idx, p.verlauf.length), 0, v);
    save(); renderPat();
  });
}

/* ------------------------------------------------------------- Intensiva
   Come il Verlauf, ma ogni voce ha due parti: a sinistra un titolo
   (Emodinamica, Ventilazione...), a destra il testo. */
function icuVoci(p){ return p.icu || (p.icu = []); }
function salvaOrdineIcu(p, host){
  if(!host) return;
  var ids = Array.prototype.map.call(host.querySelectorAll(".vbox"), function(n){ return n.dataset.id; });
  var resto = {};
  icuVoci(p).forEach(function(v){ resto[v.id] = v; });
  var nuovo = [];
  ids.forEach(function(id){ if(resto[id]){ nuovo.push(resto[id]); delete resto[id]; } });
  icuVoci(p).forEach(function(v){ if(resto[v.id]) nuovo.push(v); });
  p.icu = nuovo;
  save();
}
function secIcu(host, p){
  var c = secCard(host, "icuSecTitle", t("verlAdd"), function(){ openIcuSheet(p); });
  var lista = icuVoci(p);
  if(!lista.length){
    var e = document.createElement("p"); e.className = "emptysm"; e.textContent = t("icuSecEmpty");
    c.appendChild(e);
    return;
  }
  var holder = document.createElement("div");
  holder.style.cssText = "display:flex; flex-direction:column; gap:9px; margin-top:2px";
  lista.forEach(function(v){ holder.appendChild(icuCard(p, v)); });
  c.appendChild(holder);
  var nota = document.createElement("p"); nota.className = "labnote";
  nota.textContent = t("icuNote");
  c.appendChild(nota);
}
function icuCard(p, v){

  var tx = document.createElement("div"); tx.className = "icux";
  tx.appendChild(textWithMorals(v.text || "", v.tasks, v.morals));
  grid.appendChild(tt); grid.appendChild(tx);
  attaccaModifica(grid, function(){
    modificaTesto(grid, v.text || "", {

  var x = document.createElement("button"); x.className = "mx";
  x.setAttribute("aria-label", t("del"));

  x.onclick = function(){
    var idx = icuVoci(p).indexOf(v);
    if(idx < 0) return;
    p.icu.splice(idx, 1);
    save(); renderPat();
    showToast(t("deleted"), t("undo"), function(){
      p.icu.splice(Math.min(idx, p.icu.length), 0, v);
      save(); renderPat();
    });
  };
  box.appendChild(x);
  attachDragHandle(box, grip, "vbox", function(hostEl){ salvaOrdineIcu(p, hostEl); });
  return box;
}

/* ------------------------------------------------------------- stato */
var cview = { id:null, tab:"fach", q:"" };

function colleagues(){ return S.colleagues || (S.colleagues = []); }
function colById(id){ return colleagues().filter(function(c){ return c.id === id; })[0] || null; }
function colEvents(c){ return c.events || (c.events = []); }
function colTodos(cid){ return S.items.filter(function(i){ return i.cid === cid; }); }
function colOpenTodos(cid){ return colTodos(cid).filter(function(i){ return i.stage !== "done"; }); }

/* un compito legato a un collega: nel turno porta il suo nome come etichetta */
function addColTodo(c, text, urgent, day, wish){
  var it = {
    id:uid(), text:stripMoral(stripMarks(text)), tag:(c.name || ""), urgent:!!urgent, stage:"todo",
    wish:!!wish, day:day || todayStr(), created:Date.now(), comment:"", alarm:null, alarmFired:false,
    lastOffset:null, cid:c.id
  };
  S.items.unshift(it);
  save();
  return it;
}

/* "oggi", "ieri", "3 giorni fa", "fra 2 giorni" */
function quandoWords(iso){
  if(!iso) return "";
  var g = dayGap(iso);
  return g === 0 ? t("cToday") : gapWords(g);
}

/* ------------------------------------------------------------- render */
function renderCol(){
  $("modeColName").textContent = t("mCol");
  if(cview.id && colById(cview.id)) renderColDetail();
  else { cview.id = null; renderColList(); }
}

function renderColList(){
  $("colDetail").hidden = true;
  $("colListHead").hidden = false;
  $("colFilterRow").hidden = false;
  $("colList").hidden = false;
  $("colListTitle").textContent = t("colleagues");
  $("colSearch").placeholder = t("colSearch");

  var q = cview.q.trim().toLowerCase();
  var shown = q ? colleagues().filter(function(c){
    return ((c.name||"") + " " + (c.role||"")).toLowerCase().indexOf(q) >= 0;
  }) : colleagues();
  $("colListN").textContent = shown.length ? String(shown.length) : "";

  var host = $("colList");
  host.textContent = "";
  if(!shown.length){
    var e = document.createElement("p"); e.className = "empty";
    e.textContent = colleagues().length ? t("colEmptyFilter") : t("colEmpty");
    host.appendChild(e);
    return;
  }
  shown.forEach(function(c){ host.appendChild(colCard(c)); });

  var note = document.createElement("p");
  note.className = "labnote"; note.style.marginTop = "14px";
  note.textContent = t("colNote");
  host.appendChild(note);
}

function colCard(c){
  var b = document.createElement("button");
  b.className = "patcard colcard";
  var main = document.createElement("div"); main.className = "pc-main";

  var nm = document.createElement("div"); nm.className = "pc-alias";
  nm.textContent = c.name || "—";
  main.appendChild(nm);

  if(c.role){
    var r = document.createElement("div"); r.className = "pc-dx"; r.textContent = c.role;
    main.appendChild(r);
  }

  /* l'unica etichetta che dice qualcosa e' se c'e' da fare qualcosa:
     che ognuno abbia Fachlich e Personale non e' una notizia */
  var nTodo = colOpenTodos(c.id).length;
  if(nTodo){
    var chips = document.createElement("div"); chips.className = "pc-chips";
    chips.appendChild(miniChip(nTodo + " " + t("rTodo").toLowerCase(), "todo"));
    main.appendChild(chips);
  }

  b.appendChild(main);
  var ch = document.createElement("span"); ch.className = "chev"; ch.textContent = "›";
  b.appendChild(ch);
  b.dataset.cid = c.id;
  b.onclick = function(){
    cview.listY = window.scrollY || 0;
    cview.id = c.id; cview.tab = "fach"; renderCol(); window.scrollTo(0,0);
  };
  return b;
}

var CTABS = [["fach","cFach"], ["pers","cPers"], ["ev","cEv"], ["todo","tTodo"]];

function renderColDetail(){
  var c = colById(cview.id);
  modificaAperta = false;
  $("colListHead").hidden = true;
  $("colFilterRow").hidden = true;
  $("colList").hidden = true;
  $("colDetail").hidden = false;

  $("cdName").textContent = c.name || "—";
  $("cdRole").textContent = c.role || "";

  var tabs = $("cdTabs");
  tabs.textContent = "";
  CTABS.forEach(function(pair){
    var b = document.createElement("button");
    b.className = "ptab" + (cview.tab === pair[0] ? " on" : "");
    b.append(document.createTextNode(t(pair[1])));
    var n = pair[0] === "ev" ? colEvents(c).length
          : pair[0] === "todo" ? colOpenTodos(c.id).length : 0;
    if(n){ var s = document.createElement("span"); s.className = "tn"; s.textContent = n; b.appendChild(s); }
    b.onclick = function(){ cview.tab = pair[0]; renderCol(); };
    tabs.appendChild(b);
  });

  var sec = $("cdSec");
  sec.textContent = "";
  if(cview.tab === "fach") secQuaderno(sec, c, "fachlich", "cFachTitle", "cFachPh");
  else if(cview.tab === "pers") secQuaderno(sec, c, "personale", "cPersTitle", "cPersPh");
  else if(cview.tab === "ev") secEventi(sec, c);
  else if(cview.tab === "todo") secColTodo(sec, c);
}

/* ------------------------------------- Fachlich e Personale: un foglio solo
   Lo stesso quaderno del braccio Note, salvato dentro il collega. Il foglio
   non viene ridisegnato mentre scrivi: il cursore resta dov'è. */
function secQuaderno(host, c, campo, titleKey, phKey){
  var card = secCard(host, titleKey, t("noteH"), function(){ quadernoTitolo(ed); });
  var ed = document.createElement("div");
  ed.className = "notearea qsmall";
  ed.contentEditable = "true";
  ed.setAttribute("role", "textbox");
  ed.setAttribute("aria-multiline", "true");
  ed.id = "q-" + campo;
  card.appendChild(ed);

  var riga = document.createElement("p"); riga.className = "qhint";
  var mic = document.createElement("button"); mic.className = "mic-sm";
  mic.appendChild(svgIcon("mic", 15));
  mic.setAttribute("aria-label", t("listening"));
  mic.onclick = function(){ quadernoDetta(ed, mic); };
  var testo = document.createElement("span"); testo.textContent = t("cQNote");
  var salvato = document.createElement("span"); salvato.className = "qsaved";
  riga.appendChild(mic); riga.appendChild(testo); riga.appendChild(salvato);
  card.appendChild(riga);

  quadernoCollega(ed, function(txt){
    c[campo] = txt; save(); segnalaSalvato(salvato);
  }, t(phKey));
  quadernoRiempi(ed, c[campo] || "", t(phKey));
}

/* ------------------------------------------------------------- eventi */
function secEventi(host, c){
  var card = secCard(host, "cEvTitle", t("cEvAdd"), function(){ openEventoSheet(c); });
  var lista = colEvents(c).slice().sort(function(a,b){
    if(a.day !== b.day) return a.day < b.day ? 1 : -1;
    return (b.ts||0) - (a.ts||0);
  });
  if(!lista.length){
    var e = document.createElement("p"); e.className = "emptysm"; e.textContent = t("cEvEmpty");
    card.appendChild(e);
    return;
  }
  lista.forEach(function(ev){
    var it = document.createElement("div"); it.className = "evitem";
    var b = document.createElement("div"); b.className = "evbody";
    var d = document.createElement("div"); d.className = "evday";
    d.append(document.createTextNode(
      parseDay(ev.day).toLocaleDateString(t("locale"), { weekday:"short", day:"numeric", month:"long", year:"numeric" })));
    var ago = document.createElement("span"); ago.className = "evago";

/* Gira una volta sola. Se un collega con quello stesso nome c'è già,
   il testo viene aggiunto in fondo al suo, non al posto del suo. */

  if(S.settings.colSeed) return;

  SEME_COLLEGHI.forEach(function(semi){

      return String(x.name || "").trim().toLowerCase() === semi.name.toLowerCase();
    })[0];

      c = { id:uid(), name:semi.name, role:semi.role, created:Date.now(),
        fachlich:"", personale:"", events:[] };
      colleagues().push(c);
    }
    c.fachlich = unisci(c.fachlich, semi.fachlich);

    (semi.eventi || []).forEach(function(e){
