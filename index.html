  ta.setSelectionRange(ta.value.length, ta.value.length);
  autoGrow(ta);
}

/* Se nel testo di un compito compare lo pseudonimo di un paziente, il compito
   viene agganciato a quella scheda: comparira' anche nel suo "Da fare".
   Si cerca la parola intera, senza accenti e senza maiuscole, e fra piu'
   pseudonimi vince il piu' lungo — cosi' "Rosa" non ruba il posto a "Rosanna". */
var ACCENTI = { "à":"a","á":"a","â":"a","ä":"a","ã":"a","å":"a",
  "è":"e","é":"e","ê":"e","ë":"e", "ì":"i","í":"i","î":"i","ï":"i",
  "ò":"o","ó":"o","ô":"o","ö":"o","õ":"o", "ù":"u","ú":"u","û":"u","ü":"u",
  "ç":"c","ñ":"n","ý":"y","ÿ":"y" };
function nomePulito(s2){
  return String(s2 || "").toLowerCase().split("").map(function(c){
    return ACCENTI[c] || c;
  }).join("");
}
function lettera(c){ return /[0-9a-z]/.test(c); }
function parolaDentro(testo, nome){
  var i = 0;
  while((i = testo.indexOf(nome, i)) >= 0){
    var prima = i > 0 ? testo.charAt(i-1) : " ";
    var dopo = testo.charAt(i + nome.length) || " ";
    if(!lettera(prima) && !lettera(dopo)) return true;
    i += nome.length;
  }
  return false;
}
/* Dentro la scheda di Rosa scrivere "Rosa" un'altra volta e' inutile: qui il
   nome viene tolto dalla riga, insieme alla preposizione che lo reggeva, e la
   frase si ricuce. Il testo vero non si tocca: nel turno resta com'e' scritto. */
var PREPOSIZIONI = ["a","ad","al","allo","alla","ai","agli","alle",
  "di","del","dello","della","dei","degli","delle",
  "da","dal","dallo","dalla","dai","dagli","dalle",
  "per","con","su","in","presso",
  "an","zu","zum","zur","bei","beim","von","vom","fur","mit"];
function togliNome(testo, nome){
  var a = nomePulito(nome || "").trim();
  if(a.length < 2 || !testo) return testo;
  var piatto = nomePulito(testo);
  var res = "", last = 0, i = 0, tolto = false;
  while((i = piatto.indexOf(a, i)) >= 0){
    var prima = i > 0 ? piatto.charAt(i-1) : " ";
    var dopo = piatto.charAt(i + a.length) || " ";
    if(!lettera(prima) && !lettera(dopo) && i >= last){
      var taglio = i;
      /* se prima del nome c'e' una preposizione, se ne va anche quella */
      var testa = piatto.slice(last, i).replace(/\s+$/, "");
      var ultima = /([a-z']+)$/.exec(testa);
      if(ultima && PREPOSIZIONI.indexOf(ultima[1]) >= 0 && (last + testa.length - ultima[1].length) >= last){
        taglio = last + testa.length - ultima[1].length;
      }
      res += testo.slice(last, taglio);
      last = i + a.length;
      tolto = true;
    }
    i += a.length;
  }
  if(!tolto) return testo;
  res += testo.slice(last);
  res = res.replace(/\s+/g, " ")
           .replace(/\s+([,.;:!?])/g, "$1")
           .replace(/^[\s,;:.\u2013\u2014-]+/, "")
           .replace(/[\s,;:\u2013\u2014-]+$/, "")
           .trim();
  if(!res) return testo;
  /* se la frase cominciava col nome, la parola nuova prende la maiuscola */
  if(/^[A-ZÀ-Þ]/.test(testo)) res = res.charAt(0).toUpperCase() + res.slice(1);
  return res;
}

function trovaPaziente(testo){
  var t2 = nomePulito(testo), best = null, bestLen = 0;
  patients().forEach(function(p){
    var a = nomePulito(p.alias);
    if(a.length < 2 || !parolaDentro(t2, a)) return;
    var meglio = a.length > bestLen ||
      (a.length === bestLen && patPresente(p, todayStr()) && best && !patPresente(best, todayStr()));
    if(meglio){ best = p; bestLen = a.length; }
  });
  return best;
}

/* Chi riguarda questo compito: pseudonimo e stanza per un paziente, nome per un
   collega. Vengono letti dalla scheda, non da quello che era scritto quando il
   compito e' nato: se cambi stanza o pseudonimo, l'etichetta segue. */
/* I due segni che decidono dove va una voce: "!" la manda in cima, il cuore
   in fondo. Non possono stare accesi insieme: accendendone uno l'altro si spegne. */
function segniRow(urgente, senzaFretta){
  var urg = document.createElement("button");
  urg.className = "urgbtn" + (urgente ? " on" : ""); urg.textContent = "!";
  urg.setAttribute("aria-label", "!"); urg.title = "!";
  var wish = document.createElement("button");
  wish.className = "wishbtn" + (senzaFretta ? " on" : "");
  wish.appendChild(svgIcon("heart", 16, 1.9));
  wish.setAttribute("aria-label", t("wish")); wish.title = t("wishHint");
  urg.onclick = function(){
    urg.classList.toggle("on");
    if(urg.classList.contains("on")) wish.classList.remove("on");
  };
  wish.onclick = function(){
    wish.classList.toggle("on");
    if(wish.classList.contains("on")) urg.classList.remove("on");
  };
  return {
    urg:urg, wish:wish,
    urgente:function(){ return urg.classList.contains("on"); },
    senzaFretta:function(){ return wish.classList.contains("on"); }
  };
}

function chipDiChi(it){
  var out = [], alias = "", stanza = "";
  if(it.pid){
    var p = patById(it.pid);
    if(p){ alias = p.alias || ""; stanza = p.room || ""; }
  } else if(it.cid){
    var c = colById(it.cid);
    if(c) alias = c.name || "";
  }
  if(alias || stanza){
    if(alias) out.push(chip("tagchip chi", alias));
    if(stanza) out.push(chip("tagchip", stanza));
    return out;
  }
  /* compito libero, o scheda sparita: resta l'etichetta scritta a mano */
  var tag = (it.tag || "").trim();
  if(tag) out.push(chip("tagchip", tag));
  return out;
}

  var s = document.createElement("span");
  s.className = cls; s.textContent = text; return s;
}

function addFromCompose(){
  var ta = $("composeText"), text = ta.value.trim();
  if(!text) return;
  /* "M:" qui dentro fa una morale, senza paziente. Quello che resta,
     se resta qualcosa, diventa il compito. */
  var fuori = estraiMorali(text, {});
  var nMor = fuori.n;
  if(nMor){
    text = fuori.resto;
    if(!text){
      ta.value = ""; ta.style.height = "auto";
      $("composeUrg").classList.remove("on");
      $("composeWish").classList.remove("on");
      save(); render(); avvisaMorali(nMor);
      return;
    }
  }
  /* su un giorno futuro il compito nasce con quella data e ci resta:
     comparira' da solo nell'agenda quando quel giorno arriva. */
  var target = composePick ? composePick.get() : todayStr();
  var it = {
    id:uid(), text:stripMarks(text), tag:$("composeTag").value.trim(),

    stage:"todo", day:target, created:Date.now(),
    comment:"", alarm:null, alarmFired:false, lastOffset:null
  };

  view.day = target; view._wasToday = (target === todayStr());

  save(); render();
}

/* ---------------------------------------------------------------- toast */
function showToast(msg, actionLabel, action){
  var old = document.querySelector(".toast"); if(old) old.remove();
  clearTimeout(toastTimer);
  var el = document.createElement("div");
  el.className = "toast";
  el.appendChild(document.createTextNode(msg));
  if(actionLabel){

  }

/* ---------------------------------------------------------------- swipe */
function attachSwipe(row, it){
  var x0 = 0, y0 = 0, dx = 0, active = false, decided = false;
  row.addEventListener("pointerdown", function(e){
    if(e.target.closest("button, textarea, input")) return;
    x0 = e.clientX; y0 = e.clientY; dx = 0; active = true; decided = false;
  });
  row.addEventListener("pointermove", function(e){
    if(!active) return;
    var mx = e.clientX - x0, my = e.clientY - y0;
    if(!decided){
      if(Math.abs(mx) < 8 && Math.abs(my) < 8) return;
      if(Math.abs(my) > Math.abs(mx) || mx > 0){ active = false; return; }
      decided = true;
      try{ row.setPointerCapture(e.pointerId); }catch(err){}
    }
    dx = Math.max(mx, -120);
    row.style.transform = "translateX(" + dx + "px)";
  });
  function end(){
    if(!active) return;
    active = false;
    row.style.transition = "transform .16s ease";
    row.style.transform = "translateX(0)";
    setTimeout(function(){ row.style.transition = ""; }, 200);
    if(dx < -60) openAlarmSheet(it);
    dx = 0;
  }
  row.addEventListener("pointerup", end);
  row.addEventListener("pointercancel", end);
  row.addEventListener("pointerleave", function(){ if(active && !decided) active = false; });
}

function openSheet(build){

  sheet.appendChild(g);

  scrim.addEventListener("click", function(e){ if(e.target === scrim) scrim.remove(); });
  document.body.appendChild(scrim);
  build(sheet, function(){ scrim.remove(); });
  return sheet;
}

var QUICK = [15, 30, 60, 120, 240];

function openAlarmSheet(it){
  openSheet(function(sheet, close){
    var h = document.createElement("h2"); h.textContent = t("alarmFor");
    var sub = document.createElement("p"); sub.className = "sub"; sub.textContent = it.text;
    sheet.appendChild(h); sheet.appendChild(sub);

    var lab = document.createElement("div"); lab.className = "sheet-label"; lab.textContent = t("quick");
    sheet.appendChild(lab);
    var row = document.createElement("div"); row.className = "quickrow";
    QUICK.forEach(function(m){
      var b = document.createElement("button");
      b.className = "qchip"; b.textContent = fmtOffset(m);
      b.onclick = function(){ setAlarm(it, Date.now() + m*60000, m); close(); };
      row.appendChild(b);
    });
    sheet.appendChild(row);

    var lab2 = document.createElement("div"); lab2.className = "sheet-label"; lab2.textContent = t("exact");
    sheet.appendChild(lab2);
    var fr = document.createElement("div"); fr.className = "fieldrow";
    var ti = document.createElement("input");
    ti.type = "time"; ti.id = "alarm-time-" + it.id;
    ti.value = it.alarm ? fmtTime(it.alarm) : fmtTime(Date.now() + 3600000);
    var ok = document.createElement("button");
    ok.className = "btn"; ok.style.background = "var(--accent)"; ok.textContent = t("set");
    ok.onclick = function(){
      if(!ti.value) return;
      var p = ti.value.split(":");
      var d = new Date(); d.setHours(+p[0], +p[1], 0, 0);
      if(d.getTime() <= Date.now()) d.setDate(d.getDate() + 1);
      setAlarm(it, d.getTime(), Math.round((d.getTime() - Date.now())/60000));
      close();
    };
    fr.appendChild(ti); fr.appendChild(ok);
    sheet.appendChild(fr);

    var acts = document.createElement("div"); acts.className = "sheet-actions";
    if(it.alarm){
      var rm = document.createElement("button");
      rm.className = "btn btn-ghost"; rm.textContent = t("removeAlarm");
      rm.onclick = function(){ clearAlarm(it); close(); };
      acts.appendChild(rm);
    }
    if(it.lastOffset){
      var rn = document.createElement("button");
      rn.className = "btn btn-ghost"; rn.textContent = t("renew") + " (+" + fmtOffset(it.lastOffset) + ")";
      rn.onclick = function(){ setAlarm(it, Date.now() + it.lastOffset*60000, it.lastOffset); close(); };
      acts.appendChild(rn);
    }
    var cl = document.createElement("button");
    cl.className = "btn btn-ghost"; cl.textContent = t("close");
    cl.onclick = close;
    acts.appendChild(cl);
    sheet.appendChild(acts);
  });
}

/* Calendario riutilizzabile: un tocco sul giorno sceglie e chiude, senza OK.
   Lo usano sia la barra in alto sia tutti i campi data dell'app. */
function calendarNode(selDay, onPick){
  var wrap = document.createElement("div");
  var shown = parseDay(selDay || todayStr());
  shown = new Date(shown.getFullYear(), shown.getMonth(), 1);

  var head = document.createElement("div"); head.className = "calhead";
  var prevB = document.createElement("button");
  prevB.className = "iconbtn"; prevB.textContent = "‹"; prevB.setAttribute("aria-label", "-1");
  var label = document.createElement("div"); label.className = "calmonth";
  var nextB = document.createElement("button");
  nextB.className = "iconbtn"; nextB.textContent = "›"; nextB.setAttribute("aria-label", "+1");
  head.appendChild(prevB); head.appendChild(label); head.appendChild(nextB);
  wrap.appendChild(head);

  var dow = document.createElement("div"); dow.className = "caldow";
  for(var i = 0; i < 7; i++){
    var s = document.createElement("span");
    s.textContent = new Date(2024, 0, 1 + i).toLocaleDateString(t("locale"), { weekday:"short" }).slice(0, 2);
    dow.appendChild(s);
  }
  wrap.appendChild(dow);

  var grid = document.createElement("div"); grid.className = "calgrid";
  wrap.appendChild(grid);

  prevB.onclick = function(){ shown = new Date(shown.getFullYear(), shown.getMonth()-1, 1); paint(); };
  nextB.onclick = function(){ shown = new Date(shown.getFullYear(), shown.getMonth()+1, 1); paint(); };
  paint();
  return wrap;

  function paint(){
    label.textContent = shown.toLocaleDateString(t("locale"), { month:"long", year:"numeric" });
    grid.textContent = "";
    var counts = openByDay();
    var first = new Date(shown.getFullYear(), shown.getMonth(), 1);
    var lead = (first.getDay() + 6) % 7;            /* la settimana parte da lunedi' */
    var start = new Date(first); start.setDate(1 - lead);
    for(var n = 0; n < 42; n++){
      var d = new Date(start); d.setDate(start.getDate() + n);
      grid.appendChild(cell(d, counts));
    }
  }
  function cell(d, counts){
    var s = dayStr(d);
    var b = document.createElement("button");
    b.className = "calcell";
    if(d.getMonth() !== shown.getMonth()) b.classList.add("out");
    if(s === todayStr()) b.classList.add("today");
    if(s === selDay) b.classList.add("sel");
    var inner = document.createElement("span"); inner.className = "cin";
    var num = document.createElement("span");
    num.className = "cnum"; num.textContent = String(d.getDate());
    var dot = document.createElement("span");
    dot.className = "cdot" + (counts[s] ? "" : " cdot-off");
    inner.appendChild(num); inner.appendChild(dot);
    b.appendChild(inner);
    b.onclick = function(){ onPick(s); };      /* un tocco solo: niente OK */
    return b;
  }
}

/* campo data: mostra la data scritta per esteso, si tocca e si sceglie in un tocco */

/* ---------------------------------------------------------------- speech */
var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
var recog = null, recTarget = null, recBtn = null, recAfter = null, recBase = "";

var micErr = null;
/* "keep": il microfono resta acceso anche nelle pause e si ferma solo quando
   lo tocchi tu (o chiudi il foglio, o per 45 s non senti piu' niente).
   Il riconoscimento del telefono chiude comunque la sessione a ogni silenzio:
   qui la riapro subito, e il testo gia' dettato resta nel campo. */
var recKeep = false, recHeard = 0, recQuick = 0, recRestart = null;
var REC_SILENZIO_MAX = 45000;

function dictateInto(field, btn, after, keep){
  if(!SR){ showToast(t("micNo")); field.focus(); return; }
  if(recog || recTarget){ stopDictation(); return; }
  recTarget = field; recBtn = btn; recAfter = after || null; recKeep = !!keep;
  recHeard = Date.now(); recQuick = 0;
  btn.classList.add("rec");
  $("micNote").textContent = t("listening");
  avviaAscolto();
}
function avviaAscolto(){
  recRestart = null;
  var field = recTarget;
  if(!field) return;
  recBase = field.value ? field.value.replace(/\s+$/, "") + " " : "";
  var r = new SR();
  r.lang = S.settings.speech;
  r.interimResults = true;
  r.continuous = false;
  var partito = Date.now();
  recog = r;
  r.onresult = function(e){
    if(recog !== r || !recTarget) return;
    var s = "";
    for(var i = 0; i < e.results.length; i++) s += e.results[i][0].transcript;
    recTarget.value = recBase + s;
    recHeard = Date.now();
    autoGrow(recTarget);
    if(recAfter) recAfter();
  };
  r.onerror = function(e){
    if(recog !== r) return;
    var err = (e && e.error) || "error";
    /* nelle pause il telefono dice "no-speech": in modalita' continua non e' un errore */
    if(recKeep && (err === "no-speech" || err === "aborted")) return;
    micErr = err; stopDictation();
  };
  r.onend = function(){
    if(recog !== r) return;
    if(!recKeep){ stopDictation(); return; }
    var f = recTarget;
    var chiuso = !f || !f.isConnected || document.hidden;
    var muto = Date.now() - recHeard > REC_SILENZIO_MAX;
    /* sessioni che muoiono appena nate, una dopo l'altra: c'e' qualcosa che non va */
    recQuick = (Date.now() - partito < 400) ? recQuick + 1 : 0;
    if(chiuso || muto || recQuick >= 5){ stopDictation(); return; }
    if(recAfter) recAfter();
    recog = null;
    recRestart = setTimeout(avviaAscolto, 120);
  };
  try{ r.start(); }catch(e){ micErr = "not-allowed"; stopDictation(); }
}
function stopDictation(){
  var field = recTarget;
  var r = recog;
  recog = null; recKeep = false;
  if(recRestart){ clearTimeout(recRestart); recRestart = null; }
  if(r){ try{ r.stop(); }catch(e){} }
  if(recBtn) recBtn.classList.remove("rec");
  $("micNote").textContent = "";
  if(recAfter) recAfter();
  recBtn = null; recTarget = null; recAfter = null;
  if(micErr && micErr !== "aborted"){
    var blocked = (micErr === "not-allowed" || micErr === "service-not-allowed" || micErr === "audio-capture");
    showToast(blocked ? t("micBlocked") : t("micErr"));
    if(blocked && field) field.focus();
  }
  micErr = null;
}
function autoGrow(el){
  if(el.tagName !== "TEXTAREA") return;
  el.style.height = "auto";
  el.style.height = Math.min(el.scrollHeight, 140) + "px";
}

/* ---------------------------------------------------------------- alarms */
function askNotifPermission(cb){
  if(typeof Notification === "undefined") { if(cb) cb(); return; }
  if(Notification.permission === "default"){
    Notification.requestPermission().then(function(){ if(cb) cb(); });
  }else if(cb) cb();
}
function updateBadge(n){
  try{
    if(n > 0 && navigator.setAppBadge) navigator.setAppBadge(n);
    else if(navigator.clearAppBadge) navigator.clearAppBadge();
  }catch(e){}
  document.title = (n > 0 ? "(" + n + ") " : "") + "Agenda di turno";
}
function notify(it){
  var title = "⏰ " + (it.tag ? it.tag + " · " : "") + it.text;
  var opts = { body:t("alarm"), tag:it.id, silent:true, renotify:false, requireInteraction:false };
  try{
    if(typeof Notification !== "undefined" && Notification.permission === "granted"){
      if(navigator.serviceWorker && navigator.serviceWorker.controller){
        navigator.serviceWorker.ready.then(function(reg){ reg.showNotification(title, opts); })
          .catch(function(){ try{ new Notification(title, opts); }catch(e2){} });
      }else{
        new Notification(title, opts);
      }
    }
  }catch(e){}
  if(S.settings.vibrate && navigator.vibrate){ try{ navigator.vibrate([90, 60, 90]); }catch(e){} }
}
function tick(){
  var now = Date.now(), changed = false;
  S.items.forEach(function(it){
    if(it.alarm && !it.alarmFired && it.stage !== "done" && it.alarm <= now){
      it.alarmFired = true; changed = true; notify(it);
    }
  });
  if(view.day !== todayStr() && view._wasToday){ view.day = todayStr(); changed = true; }
  if(changed){ save(); if(!editingId && !modificaAperta && !sysScrive()) render(); }
}

/* ------------------------------------------------- valori di laboratorio
   Nessun parametro preimpostato: i nomi li scrivi tu, uno alla volta, e
   l'app se li ricorda per il prelievo dopo. S.settings.labNames tiene il
   tuo vocabolario: nome, unita' e, se vuoi, l'intervallo di riferimento. */
function labNames(){ return S.settings.labNames || (S.settings.labNames = []); }
function labKey(n){ return String(n || "").trim().toLowerCase(); }
function labMeta(name){
  var k = labKey(name);
  if(!k) return null;
  return labNames().filter(function(x){ return labKey(x.name) === k; })[0] || null;
}
function rememberLabName(name, unit){
  var n = String(name || "").trim();
  if(!n) return;
  var m = labMeta(n);
  if(m){ if(unit) m.unit = unit; m.used = (m.used || 0) + 1; }
  else labNames().push({ name:n, unit:unit || "", min:null, max:null, used:1 });
}
function labUnitOf(name){ var m = labMeta(name); return m ? (m.unit || "") : ""; }
function hasNum(v){ return v !== null && v !== undefined && !isNaN(v); }
function outOfRange(name, v){
  var m = labMeta(name);
  if(!m || !hasNum(v)) return 0;
  if(hasNum(m.max) && v > m.max) return 1;
  if(hasNum(m.min) && v < m.min) return -1;
  return 0;
}
function rangeText(name){
  var m = labMeta(name);
  if(!m) return "";
  var lo = hasNum(m.min) ? fmtNum(m.min) : "";
  var hi = hasNum(m.max) ? fmtNum(m.max) : "";
  if(!lo && !hi) return "";
  return lo + "–" + hi;
}

/* Un prelievo e' una lista di voci {name, value, unit}: solo quelle che hai
   davvero in mano. I record salvati in un formato piu' vecchio si convertono
   qui la prima volta che vengono letti. */
function labEntries(l){
  if(l.entries) return l.entries;
  var out = [];
  if(l.values) Object.keys(l.values).forEach(function(k){ out.push({ name:k, value:l.values[k], unit:"" }); });
  if(l.extra) l.extra.forEach(function(x){ out.push({ name:x.name, value:x.value, unit:x.unit || "" }); });
  l.entries = out;
  return out;
}
function labValue(l, name){
  var k = labKey(name);
  var hit = labEntries(l).filter(function(e){ return labKey(e.name) === k; })[0];
  return hit ? hit.value : null;
}
/* i nomi che compaiono nei prelievi di questo paziente, in ordine di prima comparsa */
function patLabNames(p){
  var seen = {}, out = [];
  sortedLabs(p).forEach(function(l){
    labEntries(l).forEach(function(e){
      var k = labKey(e.name);
      if(k && !seen[k]){ seen[k] = 1; out.push(e.name); }
    });
  });
  return out;
}

    });
    cand.sort(function(a, b){
      var sa = suoi.indexOf(labKey(a.name)) >= 0 ? 1 : 0, sb = suoi.indexOf(labKey(b.name)) >= 0 ? 1 : 0;
      if(sa !== sb) return sb - sa;
      return (b.used || 0) - (a.used || 0);
    });
    var nome = cand.length ? cand[0].name : c[0];
    var unita = cand.length && cand[0].unit ? cand[0].unit : c[1];
    chiavi.forEach(function(k){ if(k) out.push({ k:k, name:nome, unit:unita, noto:true, c:c[0] }); });
  });
  voc.forEach(function(x){
    [voceNorm(voceSenzaParentesi(x.name)), voceNorm(x.name)].forEach(function(k){
      if(k) out.push({ k:k, name:x.name, unit:x.unit || "", noto:true });
    });
  });
  return out;
}

/* il nome in un pezzo di testo: vince la voce che finisce piu' vicina al
   numero, e a parita' la piu' lunga ("lattato deidrogenasi" batte "lattato") */
function voceTrovaNome(pezzo, elenco){
  var tok = voceNorm(pezzo).split(" ").filter(Boolean);
  if(!tok.length) return null;
  var best = null, bestFine = -1, bestLen = -1;
  elenco.forEach(function(v){
    var vt = v.k.split(" ");
    for(var i = 0; i + vt.length <= tok.length; i++){
      var ok = true;
      for(var j = 0; j < vt.length; j++) if(tok[i + j] !== vt[j]){ ok = false; break; }
      if(!ok) continue;
      var fine = i + vt.length - 1;
      if(fine > bestFine || (fine === bestFine && v.k.length > bestLen)){
        best = v; bestFine = fine; bestLen = v.k.length;
      }
    }
  });
  if(best) return best;
  /* nome che non conosco: tengo le parole vere, senza articoli e unita' */
  var resto = tok.filter(function(w){ return VOCE_VUOTE.indexOf(w) < 0 && !/^\d+$/.test(w); }).slice(-3);
  if(!resto.length) return null;
  var n = resto.join(" ");
  n = n.length <= 3 ? n.toUpperCase() : n.charAt(0).toUpperCase() + n.slice(1);
  return { name:n, unit:labUnitOf(n), noto:false };
}

/* un numero che non sta bene con la tua unita': probabilmente detto in un'altra
   (creatinina in mg/dl, emoglobina in g/dl, glicemia in mg/dl) */
function voceUnitaStrana(c, v, u){
  if(c === "Creatinina" && /mol/.test(u) && v < 20) return true;
  if(c === "Emoglobina" && /mmol/.test(u) && v > 12) return true;
  if(c === "Glicemia" && /mmol/.test(u) && v > 40) return true;
  return false;
}
function leggiValoriDettati(testo, p){
  var parole = Object.keys(VOCE_NUM).join("|");
  var sep = "virgola|komma|punto|point";
  function re(src){ return new RegExp(src, "giu"); }
  var B = "(^|[^\\p{L}\\d])", E = "(?=$|[^\\p{L}\\d])";
  var s = " " + String(testo || "") + " ";
  /* nomi che contengono un numero: li scrivo attaccati prima di cercare i valori */
  s = s.replace(re(B + "at\\s*(?:3|iii)" + E), "$1ATIII");
  s = s.replace(re(B + "f\\s*t\\s*([34])" + E), "$1fT$2");
  s = s.replace(re(B + "hb\\s*a\\s*1\\s*c" + E), "$1HbA1c");
  s = s.replace(re(B + "25\\s*-?\\s*oh" + E), "$1");
  s = s.replace(re(B + "p\\s*(o|co)\\s*2" + E), function(m, a, g){ return a + "p" + g + "2"; });
  /* numeri detti a parole: accanto alla virgola tutti, altrove solo quelli sicuri */
  s = s.replace(re("(" + sep + ")\\s+(" + parole + ")" + E), function(m, a, w){ return a + " " + VOCE_NUM[w.toLowerCase()]; });
  s = s.replace(re(B + "(" + parole + ")\\s+(" + sep + ")" + E), function(m, a, w, b){ return a + VOCE_NUM[w.toLowerCase()] + " " + b; });
  s = s.replace(re(B + "(" + VOCE_NUM_SICURI + ")" + E), function(m, a, w){ return a + VOCE_NUM[w.toLowerCase()]; });
  s = s.replace(re("(\\d)\\s+(?:" + sep + ")\\s+(\\d)"), "$1,$2");
  s = s.replace(re(B + "(?:meno|minus)\\s+(\\d)"), "$1-$2");

  var elenco = voceElenco(p);
  var out = [], prima = 0, m;
  var rx = /(^|[^\p{L}\d])(-?\d+(?:[.,]\d+)?)/gu;
  while((m = rx.exec(s))){
    var inizio = m.index + m[1].length;
    var pezzo = s.slice(prima, inizio);
    prima = inizio + m[2].length;
    var nm = voceTrovaNome(pezzo, elenco);
    if(!nm) continue;
    var v = parseFloat(m[2].replace(",", "."));
    if(isNaN(v)) continue;
    /* lo stesso valore detto due volte: vale l'ultimo */
    out = out.filter(function(x){ return labKey(x.name) !== labKey(nm.name); });
    out.push({ name:nm.name, value:v, unit:nm.unit || "", noto:nm.noto,
      dubbio:voceUnitaStrana(nm.c, v, nm.unit || "") });
  }
  return out;
}

/* ------------------------------------------------------------- stato pazienti */
var pview = { id:null, tab:"sys", q:"", showIcu:false, unlocked:false };
var mode = "shift";

function patients(){ return S.patients || (S.patients = []); }
function patById(id){ return patients().filter(function(p){ return p.id === id; })[0] || null; }
/* Da quando un paziente e' in reparto: la data di ricovero se c'e', altrimenti
   il giorno in cui l'hai creato. Fino a quando: il giorno della dimissione
   compreso — dal giorno dopo sparisce dalla lista, ma resta nei giorni passati. */
/* L'ordine del reparto: si legge il numero dentro la stanza, cosi' "St. 2" viene
   prima di "St. 14" e non dopo, come farebbe un confronto alfabetico.
   Chi non ha ancora una stanza va in fondo, nell'ordine in cui e' stato scritto. */
function numStanza(txt){
  var m = String(txt || "").match(/\d+/);
  return m ? parseInt(m[0], 10) : null;
}
function confrontaStanza(a, b){
  var na = numStanza(a.room), nb = numStanza(b.room);
  if(na === null && nb === null) return 0;
  if(na === null) return 1;
  if(nb === null) return -1;
  if(na !== nb) return na - nb;
  /* stesso numero: "12a" prima di "12b" */
  return String(a.room || "").localeCompare(String(b.room || ""), undefined, { numeric:true });
}
/* un paziente nuovo si infila al suo posto, non in fondo */
function inserisciPerStanza(np){
  var arr = patients(), i = 0;
  while(i < arr.length && confrontaStanza(arr[i], np) <= 0) i++;
  arr.splice(i, 0, np);
  return i;
}
function ordinaPerStanza(){
  S.patients = patients().slice().sort(confrontaStanza);
  save();
}

function patVerlauf(p){ return p.verlauf || (p.verlauf = []); }

function patInizio(p){
  return p.admDate || dayStr(new Date(p.created || Date.now()));
}
function patPresente(p, giorno){
  var g = giorno || todayStr();
  if(patInizio(p) > g) return false;
  if(p.dischargedOn && p.dischargedOn < g) return false;
  return true;
}
/* Terapia intensiva: ogni passaggio e' un periodo { from, to }. Il paziente
   conta in intensiva dal giorno "from" compreso fino al giorno prima di "to"
   (il giorno in cui torna, e' di nuovo in reparto). Cosi' lo storico resta
   giusto anche sfogliando i giorni passati. */
function icuStays(p){ return p.icuStays || (p.icuStays = []); }
function icuAperta(p){ return (p.icuStays || []).filter(function(s){ return !s.to; })[0] || null; }
function patInIcu(p, giorno){
  var g = giorno || todayStr();
  return (p.icuStays || []).some(function(s){ return s.from <= g && (!s.to || g < s.to); });
}
function mandaInIcu(p){
  var prima = JSON.stringify(p.icuStays || []);
  var primaV = verlauf(p).slice();
  var g = view.day || todayStr();
  var s = { id:uid(), from:g, to:null };
  icuStays(p).push(s);
  verlauf(p).unshift(verlEvento("icu", s, g));   /* casella nel Verlauf */
  if(pview.id === p.id) pview.tab = "icu";
  save(); render(); renderPat();
  showToast(t("icuSent") + " " + fmtDayShort(g), t("undo"), function(){
    p.icuStays = JSON.parse(prima); p.verlauf = primaV; save(); render(); renderPat();
  });
}
function riportaDaIcu(p){
  var s = icuAperta(p);
  if(!s) return;
  var prima = JSON.stringify(p.icuStays || []);
  var primaV = verlauf(p).slice();
  var g = view.day || todayStr();
  if(!s.id) s.id = uid();
  if(g <= s.from){   /* tornato lo stesso giorno: vale come correzione */
    p.icuStays.splice(p.icuStays.indexOf(s), 1);
    togliEventiIcu(p, s);
  } else {
    s.to = g;
    verlauf(p).unshift(verlEvento("back", s, g));   /* Wiederaufnahme */
  }
  save(); render(); renderPat();
  showToast(t("icuBackDone") + " " + fmtDayShort(g), t("undo"), function(){
    p.icuStays = JSON.parse(prima); p.verlauf = primaV; save(); render(); renderPat();
  });
}

/* Il Verlauf registra da solo i passaggi in intensiva: una casella
   "Terapia intensiva" col giorno in cui parte, una "Wiederaufnahme" col
   giorno in cui torna in reparto. Legate al periodo con icuId. */
function fmtDayFull(iso){
  if(!iso) return "";
  return parseDay(iso).toLocaleDateString(t("locale"), { day:"2-digit", month:"2-digit", year:"numeric" });
}
function verlEvento(kind, stay, giorno, ora){
  return { id:uid(), kind:kind, icuId:stay.id, day:giorno,
    time:(ora === undefined ? nowTime() : ora), ts:Date.now(),
    quando:"", text:"", photos:[], tasks:[], morals:[] };
}
function togliEventiIcu(p, stay){
  if(!p.verlauf || !stay || !stay.id) return;
  p.verlauf = p.verlauf.filter(function(v){ return !(v.kind && v.icuId === stay.id); });
}
/* per le voci recuperate dal passato: al loro posto in base al giorno */
function mettiPerData(p, v){
  var l = verlauf(p);
  for(var i = 0; i < l.length; i++){
    if((l[i].day || "") < v.day){ l.splice(i, 0, v); return; }
  }
  l.push(v);
}

function patDimesso(p, giorno){
  return !!(p.dischargedOn && p.dischargedOn <= (giorno || todayStr()));
}
function activePatients(){ return patients().filter(function(p){ return patPresente(p, todayStr()); }); }
function patTodos(pid){ return S.items.filter(function(i){ return i.pid === pid; }); }
function patOpenTodos(pid){ return patTodos(pid).filter(function(i){ return i.stage !== "done"; }); }
function lastLab(p){ var l = (p.labs || []); return l.length ? l[l.length-1] : null; }
function sortedLabs(p){
  return (p.labs || []).slice().sort(function(a,b){
    return (a.day + " " + (a.time||"00:00")).localeCompare(b.day + " " + (b.time||"00:00"));
  });
}
function patHasWarn(p){
  var l = lastLab(p);
  if(!l) return false;
  return labEntries(l).some(function(e){ return outOfRange(e.name, e.value) !== 0; });
}
function daysSince(iso){
  if(!iso) return null;
  var d = parseDay(iso), now = parseDay(todayStr());
  return Math.round((now - d) / 86400000);
}
/* "4° giorno post-op" se l'intervento e' passato, "fra 3 giorni" se e' programmato */
function opWords(iso){
  var n = daysSince(iso);
  if(n === null) return null;
  if(n > 0) return n + t("postOpDay");
  if(n === 0) return t("opDay0");
  return (n === -1) ? t("opTomorrow") : t("opAheadN").replace("N", String(-n));
}
function fmtDayShort(iso){
  if(!iso) return "";
  var d = parseDay(iso);
  return d.toLocaleDateString(t("locale"), { day:"2-digit", month:"2-digit" });
}
function nowTime(){
  var d = new Date();
  return String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
}
function numOrNull(s){
  if(s === null || s === undefined) return null;
  s = String(s).trim().replace(",", ".");
  if(!s) return null;
  var v = parseFloat(s);
  return isNaN(v) ? null : v;
}
function fmtNum(v){
  if(v === null || v === undefined || isNaN(v)) return "";
  return (Math.abs(v) < 10 && v % 1 !== 0) ? String(Math.round(v*100)/100) : String(Math.round(v*10)/10);
}

  mode = m;

  $("shiftShell").hidden = (m !== "shift");

  $("morShell").hidden = (m !== "mor");
  $("medShell").hidden = (m !== "med");
  $("scnShell").hidden = (m !== "scn");
  document.querySelector("footer.compose").hidden = (m !== "shift");
  $("modeShift").classList.toggle("on", m === "shift");
  $("modePat").classList.toggle("on", m === "pat");
  $("modeNote").classList.toggle("on", m === "note");
  $("modeCol").classList.toggle("on", m === "col");
  $("modeMor").classList.toggle("on", m === "mor");
  $("modeMed").classList.toggle("on", m === "med");
  $("modeScn").classList.toggle("on", m === "scn");
  $("modeScnName").textContent = t("mScn");
  $("modeShiftName").textContent = t("mShift");
  $("modePatName").textContent = t("mPat");
  $("modeNoteName").textContent = t("mNote");
  $("modeColName").textContent = t("mCol");
  $("modeMorName").textContent = t("mMor");
  $("modeMedName").textContent = "Medis";
  /* il tasto scelto deve vedersi anche se sta in fondo alla barra */
  var mOn = document.querySelector(".modeseg button.on");
  if(mOn){
    var mSeg = mOn.parentNode, mr = mOn.getBoundingClientRect(), sr = mSeg.getBoundingClientRect();
    if(mr.right > sr.right) mSeg.scrollLeft += mr.right - sr.right + 4;
    else if(mr.left < sr.left) mSeg.scrollLeft -= sr.left - mr.left + 4;
  }
  S.settings.lastMode = m; save();
  if(m === "pat") gatePat();
  else if(m === "note") renderNote();
  else if(m === "col") renderCol();

    /* si carica solo la prima volta che lo apri: l'avvio dell'app resta veloce */
    var fr = $("medFrame");
    if(!fr.getAttribute("src")) fr.setAttribute("src", "medis.html");
  }
  else render();
}
function gatePat(){

function renderPatList(){
  sysLascia();
  $("patDetail").hidden = true;
  $("patListHead").hidden = false;
  $("patFilterRow").hidden = false;
  $("patList").hidden = false;
  paintDayLabel($("patDayName"), $("patDayDate"), $("patTodayBtn"));
  $("patSearch").placeholder = t("patSearch");
  $("patSearch").value = pview.q;
  $("patSearchX").hidden = !pview.q;
  $("patShowOff").textContent = t("icuBtn");
  $("patShowOff").classList.add("icubtn");
  $("patShowOff").classList.toggle("on", pview.showIcu);
  $("patSortCol").textContent = "⇅ " + t("sortColBtn");
  $("patSortCol").title = t("sortColHint");
  $("patSortCol").classList.toggle("on", !!S.settings.patByColor);

  var all = patients().filter(function(p){
    if(!patPresente(p, view.day)) return false;
    return pview.showIcu ? (patInIcu(p, view.day) && !patDimesso(p, view.day)) : true;
  });
  var q = pview.q.trim().toLowerCase();
  var shown = q ? all.filter(function(p){
    return ((p.alias||"") + " " + (p.room||"") + " " + (p.dx||"") + " " + (p.surgeon||"")).toLowerCase().indexOf(q) >= 0;
  }) : all;
  /* l'ordine e' quello che decidi tu trascinando: qui si tiene solo
     i dimessi in fondo, il resto segue l'ordine dell'elenco */
  var perColore = !!S.settings.patByColor;
  shown.sort(function(a,b){
    /* in reparto, poi terapia intensiva, poi dimessi.
       Con "Colori" acceso: arancioni (da controllare) in cima, poi quelli
       senza colore, poi gli azzurri (in dimissione), poi intensiva e dimessi.
       Dentro ogni gruppo resta l'ordine scelto trascinando. */
    function rango(x){
      if(patDimesso(x, view.day)) return 9;
      if(perColore){
        if(x.color === "crit") return 0;
        if(x.color === "dim") return 2;
        if(patInIcu(x, view.day)) return 3;
        return 1;
      }
      return patInIcu(x, view.day) ? 1 : 0;
    }
    return rango(a) - rango(b);
  });


  var host = $("patList");
  host.textContent = "";
  if(!shown.length){
    var e = document.createElement("p"); e.className = "empty";
    e.textContent = !patients().length ? t("patEmpty")
      : (pview.q.trim() ? t("patEmptyFilter") : (pview.showIcu ? t("icuEmpty") : t("patEmptyDay")));
    host.appendChild(e);
    return;
  }
  var trascinabile = !q && shown.length > 1;
  shown.forEach(function(p){
    var card = patCard(p);
    if(trascinabile) attachPatDrag(card);
    host.appendChild(card);
  });

  if(trascinabile){
    var hint = document.createElement("p");
    hint.className = "labnote"; hint.style.marginTop = "12px";
    hint.textContent = t("dragHint");
    host.appendChild(hint);
  }
  var note = document.createElement("p");
  note.className = "labnote"; note.style.marginTop = trascinabile ? "6px" : "14px";
  note.textContent = t("patNote");
  host.appendChild(note);
}

/* Riordinare le schede: tieni premuto, poi trascina su e giu'.
   La scheda vera resta al suo posto come spazio vuoto e si sposta fra le altre;
   sotto il dito viaggia una copia. Cosi' schede di altezza diversa non danno noia. */
var patDragged = false;
function attachPatDrag(card){
  var timer = null, ghost = null, active = false, startY = 0, grabDy = 0;

  card.addEventListener("pointerdown", function(e){
    if(e.button) return;
    startY = e.clientY;
    clearTimeout(timer);
    timer = setTimeout(function(){ begin(startY); }, 380);
  });
  /* se muovi subito, stai scorrendo la lista: niente trascinamento */
  card.addEventListener("pointermove", function(e){
    if(!active && Math.abs(e.clientY - startY) > 8) clearTimeout(timer);
  });
  card.addEventListener("pointerup", function(){ clearTimeout(timer); });
  card.addEventListener("pointercancel", function(){ clearTimeout(timer); });
  card.addEventListener("pointerleave", function(){ if(!active) clearTimeout(timer); });

  function begin(y){
    var r = card.getBoundingClientRect();
    grabDy = y - r.top;
    ghost = card.cloneNode(true);
    ghost.className = "patcard ghost";
    ghost.style.width = r.width + "px";
    ghost.style.left = r.left + "px";
    ghost.style.top = (y - grabDy) + "px";
    document.body.appendChild(ghost);
    card.classList.add("placeholder");
    active = true; patDragged = true;
    /* gli ascoltatori stanno sul documento: il dito puo' uscire dalla scheda */
    document.addEventListener("pointermove", onMove);
    document.addEventListener("pointerup", fine);
    document.addEventListener("pointercancel", fine);
    document.addEventListener("touchmove", stopScroll, { passive:false });
    if(S.settings.vibrate && navigator.vibrate){ try{ navigator.vibrate(18); }catch(e){} }
  }
  function onMove(e){ if(active) sposta(e.clientY); }
  function stopScroll(e){ if(active && e.cancelable) e.preventDefault(); }
  function sposta(y){
    ghost.style.top = (y - grabDy) + "px";
    var host = card.parentNode;
    if(!host) return;
    var sibs = Array.prototype.filter.call(host.children, function(n){
      return n !== card && n.classList && n.classList.contains("patcard");
    });
    for(var i = 0; i < sibs.length; i++){
      var r = sibs[i].getBoundingClientRect();
      if(y < r.top + r.height / 2){ host.insertBefore(card, sibs[i]); return; }
    }
    if(sibs.length) host.insertBefore(card, sibs[sibs.length-1].nextSibling);
  }
  function fine(){
    clearTimeout(timer);
    document.removeEventListener("pointermove", onMove);
    document.removeEventListener("pointerup", fine);
    document.removeEventListener("pointercancel", fine);
    document.removeEventListener("touchmove", stopScroll);
    if(!active) return;
    active = false;
    if(ghost){ ghost.remove(); ghost = null; }
    card.classList.remove("placeholder");
    salvaOrdine(card.parentNode);
    setTimeout(function(){ patDragged = false; }, 80);
  }
}
/* l'ordine delle schede sullo schermo diventa l'ordine dell'elenco */
function salvaOrdine(host){
  var ids = Array.prototype.map.call(host.querySelectorAll(".patcard"),
    function(n){ return n.dataset.pid; });
  var resto = {};
  patients().forEach(function(p){ resto[p.id] = p; });
  var nuovo = [];
  ids.forEach(function(id){
    if(resto[id]){ nuovo.push(resto[id]); delete resto[id]; }
  });
  patients().forEach(function(p){ if(resto[p.id]) nuovo.push(p); });
  S.patients = nuovo;
  save();
}

function patCard(p){
  var b = document.createElement("button");
  var inIcu = patInIcu(p, view.day) && !patDimesso(p, view.day);
  var dimesso = patDimesso(p, view.day);
  /* il colore scelto a mano vince sul viola dell'intensiva (il chip Intensiva resta) */
  var col = (!dimesso && PCOL[p.color]) ? p.color : null;
  b.className = "patcard" + (dimesso ? " off" : "") +
    (col ? " col-" + col : (inIcu ? " icu" : (patHasWarn(p) ? " warn" : "")));
  var main = document.createElement("div"); main.className = "pc-main";

  var al = document.createElement("div"); al.className = "pc-alias";
  al.textContent = p.alias || "—";
  main.appendChild(al);

  if(p.dx){ var dx = document.createElement("div"); dx.className = "pc-dx"; dx.textContent = p.dx; main.appendChild(dx); }
  if(p.surgeon){ var su = document.createElement("div"); su.className = "pc-dx"; su.textContent = t("fSurg") + ": " + p.surgeon; main.appendChild(su); }

  var chips = document.createElement("div"); chips.className = "pc-chips";
  if(p.room) chips.appendChild(miniChip(p.room, ""));
  if(inIcu) chips.appendChild(miniChip(t("icuChip"), "icu"));
  if(col) chips.appendChild(miniChip(t(PCOL[col].chip), col));
  if(p.dischargedOn === view.day) chips.appendChild(miniChip(t("dischargedToday"), ""));
  else if(patDimesso(p, view.day)) chips.appendChild(miniChip(t("patOff") + " " + fmtDayShort(p.dischargedOn), ""));
  var op = opWords(p.opDate);
  if(op) chips.appendChild(miniChip(op, ""));
  var open = patOpenTodos(p.id);
  var nTodo = open.filter(function(i){ return i.stage === "todo"; }).length;
  var nRes = open.filter(function(i){ return i.stage === "result"; }).length;
  if(nTodo) chips.appendChild(miniChip(nTodo + " " + t("rTodo").toLowerCase(), "todo"));
  if(nRes) chips.appendChild(miniChip(nRes + " " + t("rResult").toLowerCase(), "res"));
  var l = lastLab(p);
  if(l) chips.appendChild(miniChip(t("tLab") + " " + fmtDayShort(l.day), patHasWarn(p) ? "bad" : "ok"));
  main.appendChild(chips);

  b.appendChild(main);
  var side = document.createElement("span"); side.className = "pc-side";
  var ch = document.createElement("span"); ch.className = "chev"; ch.textContent = "›";
  side.appendChild(ch);
  /* pallino colore: si cambia da qui, senza aprire il paziente.
     La scheda e' gia' un pulsante, quindi questo e' uno span con ruolo di pulsante
     che non lascia passare il tocco (ne' l'apertura ne' il trascinamento). */
  if(!dimesso){
    var dot = document.createElement("span");
    dot.className = "colordot" + (col ? " c-" + col : (inIcu ? " c-icu" : ""));
    dot.setAttribute("role", "button");
    dot.setAttribute("aria-label", t("colPick"));
    dot.title = t("colPick");
    dot.appendChild(document.createElement("i"));
    ["pointerdown", "pointerup", "touchstart"].forEach(function(ev){
      dot.addEventListener(ev, function(e){ e.stopPropagation(); }, { passive:true });
    });
    dot.addEventListener("click", function(e){
      e.stopPropagation(); e.preventDefault();
      openColorSheet(p);
    });
    side.appendChild(dot);
  }
  b.appendChild(side);
  b.dataset.pid = p.id;
  b.onclick = function(){
    if(patDragged) return;            /* stavi spostando la scheda, non aprendola */
    /* mi segno dove stavi nella lista: tornando indietro riparti da li' */
    pview.listY = window.scrollY || 0;
    pview.id = p.id; pview.tab = "sys"; renderPat(); window.scrollTo(0,0);
  };
  return b;
}
function miniChip(text, cls){
  var s = document.createElement("span");
  s.className = "minichip" + (cls ? " " + cls : "");
  s.textContent = text;
  return s;
}

/* ------------------------------------------------------------- scheda */
var PTABS = [
  ["sys","tSys"], ["todo","tTodo"], ["notes","tNotes"], ["verl","tVerl"], ["check","tCheck"],
  ["lab","tLab"], ["ther","tTher"], ["icu","tIcu"], ["sum","tSum"]
];
/* la sezione Intensiva c'e' finche' il paziente e' in terapia intensiva,
   e resta se ci hai scritto qualcosa */
function icuTabVisibile(p){
  return (patInIcu(p, view.day) && !patDimesso(p, view.day)) || (p.icu || []).length > 0;
}

function renderPatDetail(){
  var p = patById(pview.id);
  modificaAperta = false;
  $("patListHead").hidden = true;
  $("patFilterRow").hidden = true;
  $("patList").hidden = true;
  $("patDetail").hidden = false;

  var al = $("pdAlias");
  al.textContent = "";
  al.append(document.createTextNode(p.alias || "—"));
  if(p.room) al.appendChild(miniChip(p.room, ""));
  if(patInIcu(p, view.day) && !patDimesso(p, view.day)) al.appendChild(miniChip(t("icuChip"), "icu"));
  if(p.dischargedOn) al.appendChild(miniChip(t("patOff") + " " + fmtDayShort(p.dischargedOn), ""));
  $("pdDx").textContent = p.dx || "";

  var bits = [];
  var op = opWords(p.opDate);
  if(op) bits.push(op + " · " + t("fOp") + " " + fmtDayShort(p.opDate));
  if(p.surgeon) bits.push(t("fSurg") + ": " + p.surgeon);
  $("pdDay").textContent = bits.join("  ·  ");

  /* la scheda di un sistema resta aperta solo se resti sui Sistemi dello stesso paziente */
  if(pview.tab !== "sys" || (sysAperto && sysAperto.pid !== p.id)) sysLascia();

  var tabs = $("pdTabs");
  tabs.textContent = "";
  if(pview.tab === "icu" && !icuTabVisibile(p)) pview.tab = "sys";
  /* finche' il paziente e' in terapia intensiva, la sezione Intensiva viene per prima;
     tornato in reparto, torna al suo posto in fondo */
  var ordine = PTABS;
  if(patInIcu(p, view.day) && !patDimesso(p, view.day)){
    ordine = PTABS.filter(function(x){ return x[0] === "icu"; })
      .concat(PTABS.filter(function(x){ return x[0] !== "icu"; }));
  }
  ordine.forEach(function(pair){
    if(pair[0] === "icu" && !icuTabVisibile(p)) return;
    var b = document.createElement("button");
    b.className = "ptab" + (pair[0] === "icu" ? " icutab" : "") + (pview.tab === pair[0] ? " on" : "");
    b.append(document.createTextNode(t(pair[1])));
    var n = tabCount(p, pair[0]);
    if(n) { var s = document.createElement("span"); s.className = "tn"; s.textContent = n; b.appendChild(s); }
    if((pair[0] === "lab" && patHasWarn(p)) || (pair[0] === "sys" && sysHasBad(p))){
      var d = document.createElement("span"); d.className = "warndot"; b.appendChild(d);
    }
    b.onclick = function(){ pview.tab = pair[0]; renderPat(); };
    tabs.appendChild(b);
  });

  /* la sezione aperta deve vedersi anche se sta in fondo alla fila */
  var tabOn = tabs.querySelector(".ptab.on");
  if(tabOn){
    var dx = tabOn.getBoundingClientRect().right - tabs.getBoundingClientRect().right;
    var sx = tabOn.getBoundingClientRect().left - tabs.getBoundingClientRect().left;
    if(dx > 0) tabs.scrollLeft += dx + 8;
    else if(sx < 0) tabs.scrollLeft += sx - 8;
  }

  var sec = $("pdSec");
  sec.textContent = "";
  if(pview.tab === "lab") secLab(sec, p);
  else if(pview.tab === "ther") secTher(sec, p);
  else if(pview.tab === "check") secCheck(sec, p);
  else if(pview.tab === "todo") secTodo(sec, p);
  else if(pview.tab === "notes") secNotes(sec, p);
  else if(pview.tab === "verl") secVerlauf(sec, p);
  else if(pview.tab === "icu") secIcu(sec, p);
  else if(pview.tab === "sum") secSum(sec, p);
  else if(pview.tab === "sys") secSys(sec, p);
}
function tabCount(p, tab){
  if(tab === "ther") return (p.meds || []).filter(function(m){ return !m.stopped; }).length;
  if(tab === "lab") return (p.labs || []).length;
  if(tab === "check") return (p.checklists || []).length;
  if(tab === "todo") return patOpenTodos(p.id).length;
  if(tab === "notes") return (p.notes || []).length + (p.files || []).length;
  if(tab === "verl") return (p.verlauf || []).length;
  if(tab === "icu") return (p.icu || []).length;
  if(tab === "sys") return sysCount(p);
  return 0;
}
function secCard(host, titleKey, actionLabel, action){
  var c = document.createElement("div"); c.className = "seccard";

    var a = document.createElement("button"); a.className = "hact";
    a.textContent = actionLabel; a.onclick = action;

}

/* ---------------------------------------------------------------- terapia */
function secTher(host, p){
  var c = secCard(host, "therTitle", t("addMed"), function(){ openMedSheet(p, null); });
  var meds = (p.meds || []).slice().sort(function(a,b){
    if(!!a.stopped !== !!b.stopped) return a.stopped ? 1 : -1;
    return (a.name||"").localeCompare(b.name||"");
  });
  if(!meds.length){ var e = document.createElement("p"); e.className = "emptysm"; e.textContent = t("medEmpty"); c.appendChild(e); return; }
  meds.forEach(function(m){
    var row = document.createElement("div");
    row.className = "medrow" + (m.stopped ? " stopped" : "");
    var nm = document.createElement("div"); nm.className = "mname";
    nm.append(document.createTextNode(m.name || "—"));
    var sub = [];
    if(m.note) sub.push(m.note);
    if(m.stopped) sub.push(t("stoppedOn") + " " + fmtDayShort(m.stopped));
    if(sub.length){ var sm = document.createElement("span"); sm.className = "mnote"; sm.textContent = sub.join(" · "); nm.appendChild(sm); }
    var ds = document.createElement("div"); ds.className = "mdose"; ds.textContent = m.dose || "";
    var ed = document.createElement("button"); ed.className = "mx"; ed.setAttribute("aria-label", t("editPat"));
    ed.appendChild(svgIcon("gear", 15)); ed.onclick = function(){ openMedSheet(p, m); };
    row.appendChild(nm); row.appendChild(ds); row.appendChild(ed);
    c.appendChild(row);
  });
}
function openMedSheet(p, m){
  openSheet(function(sheet, close){

    sheet.appendChild(h);
    var fName = fieldEl(t("medName"), t("medNamePh"), m ? m.name : "");

    ok.textContent = t("saveBtn");
    ok.onclick = function(){
      var name = fName.input.value.trim();
      if(!name){ fName.input.focus(); return; }
      if(m){ m.name = name; m.dose = fDose.input.value.trim(); m.note = fNote.input.value.trim(); }
      else {
        p.meds = p.meds || [];
        p.meds.push({ id:uid(), name:name, dose:fDose.input.value.trim(), note:fNote.input.value.trim(),
          since:todayStr(), stopped:null });
      }
      save(); close(); renderPat();
    };
    acts.appendChild(ok);
    if(m){
      var st = document.createElement("button"); st.className = "btn btn-ghost";
      st.textContent = m.stopped ? t("medResume") : t("medStop");
      st.onclick = function(){ m.stopped = m.stopped ? null : todayStr(); save(); close(); renderPat(); };
      acts.appendChild(st);
      var dl = document.createElement("button"); dl.className = "btn btn-ghost";
      dl.style.color = "var(--alert)"; dl.style.borderColor = "var(--alert)";
      dl.textContent = t("del");
      dl.onclick = function(){
        p.meds = (p.meds || []).filter(function(x){ return x.id !== m.id; });
        save(); close(); renderPat();
      };
      acts.appendChild(dl);
    }
    var cn = document.createElement("button"); cn.className = "btn btn-ghost";
    cn.textContent = t("cancel"); cn.onclick = close;
    acts.appendChild(cn);
    sheet.appendChild(acts);

function fieldEl(label, ph, val, type){
  var wrap = document.createElement("div");
  wrap.appendChild(labelEl(label));
  var input = document.createElement("input");
  input.type = type || "text";
  input.placeholder = ph || "";
  input.value = val || "";
  input.autocomplete = "off";
  input.style.cssText = "width:100%; padding:10px 11px; border:1px solid var(--line-strong);" +
    "border-radius:8px; background:var(--surface); font-size:15px";
  wrap.appendChild(input);
  return { wrap:wrap, input:input };
}

/* ------------------------------------------------------------- laboratorio */
function secLab(host, p){
  var c = secCard(host, "labTitle", t("addLab"), function(){ openLabSheet(p); });
  var labs = sortedLabs(p);
  var names = patLabNames(p);
  if(!labs.length || !names.length){
    var e = document.createElement("p"); e.className = "emptysm"; e.textContent = t("labEmpty");
    c.appendChild(e);
  } else {
    var cols = labs.slice(-6);
    var wrap = document.createElement("div"); wrap.className = "labwrap";
    var tab = document.createElement("table"); tab.className = "labtab";
    var thead = document.createElement("thead");
    var hr = document.createElement("tr");
    hr.appendChild(th(t("tLab"), "pname"));
    hr.appendChild(th("", "unit"));
    cols.forEach(function(l){ hr.appendChild(th(fmtDayShort(l.day) + (l.time ? "\n" + l.time : ""))); });
    hr.appendChild(th(t("refShort"), "ref"));
    thead.appendChild(hr); tab.appendChild(thead);

    var tb = document.createElement("tbody");
    names.forEach(function(name){ tb.appendChild(labRow(name, cols)); });
    tab.appendChild(tb);
    wrap.appendChild(tab);
    c.appendChild(wrap);

    var note = document.createElement("p"); note.className = "labnote"; note.textContent = t("labRefNote");
    c.appendChild(note);

    var acts = document.createElement("div"); acts.className = "btnrow";
    var mb = document.createElement("button"); mb.className = "btn btn-ghost";
    mb.textContent = t("myValues"); mb.onclick = function(){ openMyValuesSheet(); };
    acts.appendChild(mb);
    var lb = document.createElement("button"); lb.className = "btn btn-ghost";
    lb.textContent = t("labDel"); lb.onclick = function(){ openLabDelSheet(p); };
    acts.appendChild(lb);
    c.appendChild(acts);
  }

  function th(text, cls){
    var e = document.createElement("th");
    if(cls) e.className = cls;
    e.style.whiteSpace = "pre";
    e.textContent = text;
    return e;
  }
  function labRow(name, cols){
    var tr = document.createElement("tr");
    var nd = document.createElement("td"); nd.className = "pname";
    var nb = document.createElement("button");
    nb.className = "namebtn"; nb.textContent = name;
    nb.title = t("nameTap");
    nb.onclick = function(){ openNameSheet(name); };
    nd.appendChild(nb);
    tr.appendChild(nd);
    var ud = document.createElement("td"); ud.className = "unit"; ud.textContent = labUnitOf(name);
    tr.appendChild(ud);
    var prev = null;
    cols.forEach(function(l, i){
      var v = labValue(l, name);
      var td = document.createElement("td"); td.className = "val" + (i === cols.length-1 ? " last" : "");
      if(!hasNum(v)){ td.textContent = "·"; td.style.color = "var(--ink-3)"; }
      else {
        var oo = outOfRange(name, v);
        if(oo > 0) td.classList.add("hi");
        if(oo < 0) td.classList.add("lo");
        td.append(document.createTextNode(fmtNum(v)));
        if(prev !== null && v !== prev){
          var a = document.createElement("span"); a.className = "arrow";
          a.textContent = v > prev ? "↑" : "↓";
          td.appendChild(a);
        }
        prev = v;
      }
      tr.appendChild(td);
    });
    var rd = document.createElement("td"); rd.className = "ref"; rd.textContent = rangeText(name);
    tr.appendChild(rd);
    return tr;
  }
}

function openLabSheet(p){
  openSheet(function(sheet, close){
    var h = document.createElement("h2"); h.textContent = t("labNew");
    sheet.appendChild(h);
    var sub = document.createElement("p"); sub.className = "sub"; sub.textContent = t("labNewHint");
    sheet.appendChild(sub);

    var dF = dateFieldEl("", todayStr(), false);
    dF.wrap.style.flex = "1"; dF.wrap.style.minWidth = "0";
    var row = document.createElement("div"); row.className = "fieldrow"; row.style.marginTop = "0";
    var tEl = document.createElement("input"); tEl.type = "time"; tEl.value = nowTime();
    tEl.style.flex = "none"; tEl.style.width = "104px";
    row.appendChild(dF.wrap); row.appendChild(tEl);
    sheet.appendChild(row);

    /* dettatura: parli (o incolli), le righe qui sotto si riempiono da sole */
    var vbox = document.createElement("div"); vbox.className = "voicebox";
    var vmic = document.createElement("button"); vmic.className = "voicemic";
    vmic.appendChild(svgIcon("mic", 18));
    var vlab = document.createElement("span"); vlab.textContent = t("labVoice");
    vmic.appendChild(vlab);
    var vta = document.createElement("textarea"); vta.className = "pastearea voiceta";
    vta.placeholder = t("labVoicePh");
    var vst = document.createElement("div"); vst.className = "voicest";
    vbox.appendChild(vmic); vbox.appendChild(vta); vbox.appendChild(vst);
    sheet.appendChild(vbox);
    var righeVoce = [];
    /* nomi nuovi venuti dalla voce: un tocco = li correggi con la tastiera,
       due tocchi = entrano nel vocabolario. Le righe della voce si rifanno
       mentre detti, quindi i tocchi si contano per nome, non per riga. */
    var tocco = { k:null, t:0, timer:null };
    var appenaAggiunti = [];
    function rigaNuova(k){
      return Array.prototype.filter.call(rowsHost.children, function(fr){
        return fr.dataset.nuovo === "1" && labKey(fr.querySelector(".e-name").value) === k;
      })[0] || null;
    }
    function toccaNome(fr){
      if(fr.dataset.nuovo !== "1") return;
      var k = labKey(fr.querySelector(".e-name").value), ora = Date.now();
      clearTimeout(tocco.timer);
      if(tocco.k === k && ora - tocco.t < 400){
        tocco.k = null;
        nelVocabolario(k);
        return;
      }
      tocco = { k:k, t:ora, timer:setTimeout(function(){ tocco.k = null; correggiNome(k); }, 400) };
    }
    function correggiNome(k){
      var fr = rigaNuova(k);
      if(!fr) return;
      var fn = fr.querySelector(".e-name");
      fr.dataset.nuovo = "0"; fr.dataset.voice = "0";
      fn.readOnly = false;
      fr.querySelector(".entryhint").textContent = t("labFixName");
      fn.focus();
      try{ var n = fn.value.length; fn.setSelectionRange(n, n); }catch(e){}
    }
    function nelVocabolario(k){
      var fr = rigaNuova(k);
      if(!fr) return;
      var fn = fr.querySelector(".e-name");
      var nome = fn.value.trim();
      if(!nome) return;
      try{ fn.blur(); window.getSelection().removeAllRanges(); }catch(e){}
      rememberLabName(nome, fr.querySelector(".e-unit").value.trim());
      save();
      appenaAggiunti.push(labKey(nome));
      fr.dataset.nuovo = "0";
      fn.readOnly = false;
      fn.classList.remove("e-new");
      fr.querySelector(".entryhint").textContent = t("labVocAdded");
      leggiVoce();
      showToast(t("labVocAddedToast").replace("X", nome), t("undo"), function(){
        S.settings.labNames = labNames().filter(function(z){ return labKey(z.name) !== labKey(nome); });
        appenaAggiunti = appenaAggiunti.filter(function(z){ return z !== labKey(nome); });
        save();
        if(rowsHost.isConnected) leggiVoce();
      });
    }
    function leggiVoce(){
      var trovati = leggiValoriDettati(vta.value, p);
      /* rifaccio le righe della voce; quelle che hai toccato a mano restano */
      righeVoce.forEach(function(fr){ if(fr.dataset.voice === "1") fr.remove(); });
      righeVoce = [];
      Array.prototype.slice.call(rowsHost.children).forEach(function(fr){
        var ins = fr.querySelectorAll("input");
        if(fr.dataset.voice !== "0" && !ins[0].value.trim() && !ins[1].value.trim()) fr.remove();
      });
      /* una riga corretta a mano conta anche col nome che aveva detto la voce,
         altrimenti al prossimo pezzo di dettatura ricomparirebbe doppia */
      var tenute = [];
      Array.prototype.forEach.call(rowsHost.children, function(fr){
        var fn = fr.querySelector(".e-name");
        if(fn) tenute.push(labKey(fn.value));
        if(fr.dataset.vname) tenute.push(fr.dataset.vname);
      });
      var nuovi = 0;
      trovati.forEach(function(f){
        if(tenute.indexOf(labKey(f.name)) >= 0) return;
        var fr = addRow(f.name, f.unit, false, f.value);
        fr.dataset.voice = "1";
        fr.dataset.vname = labKey(f.name);
        if(!f.noto){
          nuovi++;

          fr.dataset.nuovo = "1";
          fn.readOnly = true;
          fn.classList.add("e-new");
          fn.addEventListener("click", function(){ toccaNome(fr); });

          fr.querySelector(".e-unit").classList.add("e-new");

        righeVoce.push(fr);
      });
      if(!rowsHost.children.length) addRow();
      /* mentre detti, i nomi gia' usati si fanno da parte: le righe restano sotto gli occhi */
      if(knownLab){ knownLab.hidden = trovati.length > 0; chips.hidden = trovati.length > 0; }

      var parte = !vmic.classList.contains("rec");

        leggiVoce();

      }, true);
    };

    var prev = lastLab(p);
    var rowsHost = document.createElement("div"); rowsHost.style.marginTop = "10px";

    function addRow(name, unit, focusValue, value){
      var fr = document.createElement("div");

      };
      if(hasNum(value)) fv.value = String(value).replace(".", ",");
      /* una riga venuta dalla voce che correggi a mano non la tocco piu' */
      [fn, fv, fu].forEach(function(el){
        el.addEventListener("input", function(){
          if(fr.dataset.voice === "1") fr.dataset.voice = "0";
          el.classList.remove("e-new");
        });
      });
      line.appendChild(fn); line.appendChild(fv); line.appendChild(fu); line.appendChild(rm);
      var hint = document.createElement("div"); hint.className = "entryhint";
      fr.appendChild(line); fr.appendChild(hint);
      function refresh(){
        if(!fu.value) fu.value = labUnitOf(fn.value);
        var pv = prev ? labValue(prev, fn.value) : null;
        hint.textContent = hasNum(pv) ? t("labPrev") + ": " + fmtNum(pv) : "";
      }
      fn.addEventListener("blur", refresh);
      fn.addEventListener("change", refresh);
      rowsHost.appendChild(fr);
      refresh();
      if(focusValue) setTimeout(function(){ fv.focus(); }, 40);
      return fr;
    }

    var known = patLabNames(p);
    labNames().slice().sort(function(a,b){ return (b.used||0) - (a.used||0); }).forEach(function(m){
      if(known.filter(function(n){ return labKey(n) === labKey(m.name); }).length === 0) known.push(m.name);
    });
    var knownLab = null, chips = null;
    if(known.length){
      knownLab = labelEl(t("labKnown"));
      sheet.appendChild(knownLab);
      chips = document.createElement("div"); chips.className = "chiprow";
      var mine = patLabNames(p).map(labKey);
      known.slice(0, 40).forEach(function(n){
        var b = document.createElement("button");

        b.textContent = n;

      "text-decoration:underline; text-underline-offset:3px";

/* allegati: i file stanno in IndexedDB, non in localStorage */
var FDB = null;
function withDB(cb){
  if(FDB) return cb(FDB);
  try{
    var rq = indexedDB.open("agenda-turno-files", 1);
    rq.onupgradeneeded = function(){ rq.result.createObjectStore("f"); };
    rq.onsuccess = function(){ FDB = rq.result; cb(FDB); };
    rq.onerror = function(){ cb(null); };
  }catch(e){ cb(null); }
}
function putBlob(key, blob, cb){
  withDB(function(db){
    if(!db) return cb(false);
    try{
      var tx = db.transaction("f", "readwrite");
      tx.objectStore("f").put(blob, key);
      tx.oncomplete = function(){ cb(true); };
      tx.onerror = function(){ cb(false); };
    }catch(e){ cb(false); }
  });
}
function getBlob(key, cb){
  withDB(function(db){
    if(!db) return cb(null);
    try{
      var tx = db.transaction("f", "readonly");
      var rq = tx.objectStore("f").get(key);
      rq.onsuccess = function(){ cb(rq.result || null); };
      rq.onerror = function(){ cb(null); };
    }catch(e){ cb(null); }
  });
}
function delBlob(key){
  withDB(function(db){
    if(!db) return;
    try{ db.transaction("f", "readwrite").objectStore("f").delete(key); }catch(e){}
  });
}
function pickFile(p){
  var inp = document.createElement("input");
  inp.type = "file";
  inp.accept = "image/*,application/pdf";
  inp.onchange = function(){
    var f = inp.files && inp.files[0];
    if(!f) return;
    if(f.type === "application/pdf") savePdf(p, f);
    else openRedactSheet(f, function(key, name, size){
      p.files = p.files || [];
      p.files.push({ id:key, day:todayStr(), time:nowTime(), ts:Date.now(),
        name:name, type:"image/jpeg", size:size });
      save(); renderPat();
    });
  };
  inp.click();
}

    sheet.appendChild(h);

/* Copre a mano i dati stampati su una foto. La usano sia gli allegati
   della sezione Note sia le foto attaccate a un commento. */
function openRedactSheet(f, onSaved){
  var url = URL.createObjectURL(f);
  var img = new Image();
  img.onload = function(){
    openSheet(function(sheet, close){
      var h = document.createElement("h2"); h.textContent = t("redTitle");
      sheet.appendChild(h);
      var sub = document.createElement("p"); sub.className = "sub"; sub.textContent = t("redText");
      sheet.appendChild(sub);

      var maxW = 1400;
      var sc = Math.min(1, maxW / img.naturalWidth);
      var cw = Math.round(img.naturalWidth * sc), chh = Math.round(img.naturalHeight * sc);
      var wrap = document.createElement("div"); wrap.className = "redwrap";
      var cv = document.createElement("canvas"); cv.width = cw; cv.height = chh;
      var cx = cv.getContext("2d");
      var boxes = [];
      function paint(extra){
        cx.drawImage(img, 0, 0, cw, chh);
        cx.fillStyle = "#000";
        boxes.concat(extra ? [extra] : []).forEach(function(b){
          cx.fillRect(b.x, b.y, b.w, b.h);
        });
      }
      paint();
      wrap.appendChild(cv);
      sheet.appendChild(wrap);

      var drag = null;
      function pt(ev){
        var r = cv.getBoundingClientRect();
        var src = ev.touches ? ev.touches[0] : ev;
        return { x:(src.clientX - r.left) * (cw / r.width), y:(src.clientY - r.top) * (chh / r.height) };
      }
      function down(ev){ ev.preventDefault(); var q = pt(ev); drag = { x:q.x, y:q.y, w:0, h:0 }; }
      function move(ev){
        if(!drag) return;
        ev.preventDefault();
        var q = pt(ev);
        drag.w = q.x - drag.x; drag.h = q.y - drag.y;
        paint(norm(drag));
      }
      function up(){
        if(!drag) return;
        var b = norm(drag);
        if(b.w > 3 && b.h > 3) boxes.push(b);
        drag = null; paint(); labels();
      }
      function norm(b){
        return { x:Math.min(b.x, b.x+b.w), y:Math.min(b.y, b.y+b.h), w:Math.abs(b.w), h:Math.abs(b.h) };
      }
      cv.addEventListener("mousedown", down); cv.addEventListener("mousemove", move);
      window.addEventListener("mouseup", up);
      cv.addEventListener("touchstart", down, { passive:false });
      cv.addEventListener("touchmove", move, { passive:false });
      cv.addEventListener("touchend", up);

      var acts = document.createElement("div"); acts.className = "sheet-actions";
      var ok = document.createElement("button"); ok.className = "btn"; ok.style.background = "var(--accent)";
      ok.onclick = function(){
        cv.toBlob(function(blob){
          if(!blob) return;
          var key = uid();
          putBlob(key, blob, function(done){
            URL.revokeObjectURL(url);
            if(!done) return;
            close();
            onSaved(key, (f.name || "foto").replace(/\.[^.]+$/, "") + ".jpg", blob.size);
          });
        }, "image/jpeg", 0.85);
      };
      var un = document.createElement("button"); un.className = "btn btn-ghost";
      un.textContent = t("redUndo");
      un.onclick = function(){ boxes.pop(); paint(); labels(); };
      /* il tasto dice "Salva" finche' non copri niente, poi "Salva coperta" */
      function labels(){
        ok.textContent = boxes.length ? t("redSave") : t("redSaveAs");
        un.hidden = !boxes.length;
      }
      labels();
      var cn = document.createElement("button"); cn.className = "btn btn-ghost";
      cn.textContent = t("cancel");
      cn.onclick = function(){ URL.revokeObjectURL(url); close(); };
      acts.appendChild(ok); acts.appendChild(un); acts.appendChild(cn);
      sheet.appendChild(acts);
    });
  };
  img.onerror = function(){ URL.revokeObjectURL(url); showToast(t("importErr")); };
  img.src = url;
}
function fileCard(p, f){

/* ------------------------------------------------- da testo a compito
   Quello che scrivi fra due marcatori — di partenza l'asterisco, *così* —
   diventa un compito vero nell'agenda del turno, con la sua casellina.
   Il resto del testo resta testo. I marcatori spariscono dopo la conversione,
   e la frase resta evidenziata: cosi' non si creano due volte gli stessi compiti
   e vedi a colpo d'occhio che cosa e' gia' diventato un compito. */
function taskMark(){ return S.settings.taskMark || "*"; }

/* le coppie di marcatori trovate nel testo, con la posizione */
function findMarks(text){
  var m = taskMark(), res = [], i = 0;
  if(!m || !text) return res;
  var numerico = /^[\d.,]+$/.test(m);
  while(i < text.length){
    var a = text.indexOf(m, i);
    if(a < 0) break;
    var b = text.indexOf(m, a + m.length);
    if(b < 0) break;
    var inner = text.slice(a + m.length, b);
    /* niente a capo dentro, niente vuoti */
    if(inner.indexOf("\n") >= 0 || !inner.trim() || inner.length > 300){ i = a + m.length; continue; }
    /* se il marcatore e' un numero, non deve stare dentro un altro numero */
    if(numerico){
      var prima = text.charAt(a - 1), dopo = text.charAt(b + m.length);
      if(/[\d.,]/.test(prima) || /[\d.,]/.test(dopo)){ i = a + m.length; continue; }
    }
    res.push({ start:a, end:b + m.length, text:inner.trim() });
    i = b + m.length;
  }
  return res;
}

/* converte i pezzi segnati di owner[campo] in compiti del paziente p.
   Torna quanti ne ha creati. */
function convertiMarcati(owner, campo, campoTask, p, crea){
  var text = owner[campo] || "";
  var trovati = findMarks(text);
  if(!trovati.length) return 0;
  owner[campoTask] = owner[campoTask] || [];
  var out = "", last = 0;
  trovati.forEach(function(f){
    out += text.slice(last, f.start) + f.text;
    last = f.end;
    var it = crea ? crea(f.text) : addPatTodo(p, f.text, false);
    owner[campoTask].push({ text:f.text, itemId:it.id, at:Date.now() });
  });
  out += text.slice(last);
  owner[campo] = out;
  save();
  return trovati.length;
}
/* Il testo di un compito non porta mai i marcatori: li tolgo da qualunque
   strada arrivi (barra del turno, Aggiungi del paziente, modifica a mano). */
function stripMarks(text){
  var m = taskMark();
  if(!m || !text) return text;
  var found = findMarks(text), out = "", last = 0;
  found.forEach(function(f){ out += text.slice(last, f.start) + f.text; last = f.end; });
  out += text.slice(last);
  /* i marcatori spaiati si buttano, ma solo se non sono numeri:
     "controlla 5 volte" non deve perdere il suo 5 */
  if(!/^[\d.,]+$/.test(m)) out = out.split(m).join("");
  return out.trim();
}
function avvisaCompiti(n){
  if(!n) return;
  showToast(n === 1 ? t("taskMade1") : t("taskMadeN").replace("N", String(n)));
}

/* il testo con le frasi diventate compito evidenziate; un tocco ci porta sopra */
function textWithTasks(text, tasks){
  var frag = document.createDocumentFragment();
  if(!tasks || !tasks.length){
    frag.appendChild(document.createTextNode(text || ""));
    return frag;
  }
  var marks = [];
  tasks.forEach(function(tk){
    var i = (text || "").indexOf(tk.text);
    if(i >= 0) marks.push({ start:i, end:i + tk.text.length, task:tk });
  });
  marks.sort(function(a,b){ return a.start - b.start; });
  var last = 0;
  marks.forEach(function(mk){
    if(mk.start < last) return;
    if(mk.start > last) frag.appendChild(document.createTextNode(text.slice(last, mk.start)));
    var it = S.items.filter(function(x){ return x.id === mk.task.itemId; })[0];
    var sp = document.createElement("button");
    sp.className = "mktask" + (!it ? " gone" : it.stage === "done" ? " done" : "");
    sp.textContent = mk.task.text;
    sp.title = it ? t("taskGo") : t("taskGone");
    /* Un tocco porta al compito. Ma due tocchi vogliono dire "correggi la nota":
       aspetto un attimo prima di saltare, cosi' il secondo tocco fa in tempo a
       fermarmi. Lo stesso se intanto si e' aperto il riquadro con la pressione lunga. */
    var salto = null;
    sp.onclick = function(e){
      e.stopPropagation();
      clearTimeout(salto);
      salto = setTimeout(function(){
        if(modificaAperta) return;
        vaiAlCompito(mk.task.itemId);
      }, 280);
    };
    sp.addEventListener("dblclick", function(){ clearTimeout(salto); });
    frag.appendChild(sp);
    last = mk.end;
  });
  if(last < (text || "").length) frag.appendChild(document.createTextNode(text.slice(last)));
  return frag;
}
function vaiAlCompito(id){
  var it = S.items.filter(function(x){ return x.id === id; })[0];
  if(!it) return;
  view.day = (it.day > todayStr()) ? it.day : todayStr();
  view._wasToday = (view.day === todayStr());
  view.rail = it.stage;
  setMode("shift");
  setTimeout(function(){
    var el = document.querySelector('.item[data-id="' + id + '"]');
    if(el) el.scrollIntoView({ block:"center", behavior:"smooth" });
  }, 80);
}
